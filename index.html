<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#092b4d 0%,#041522 45%,#01070d 100%);
    color:#fff;
    overflow-x:hidden;
    user-select:none;
}

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    min-height:100vh;
    padding:10px 10px 30px;
}

/* ================= LOGO ================= */

.logo{
    text-align:center;
    font-size:31px;
    font-weight:900;
    letter-spacing:5px;
    color:#00e5ff;
    text-shadow:
        0 0 8px #00e5ff,
        0 0 18px #00e5ff,
        0 0 32px rgba(0,229,255,.7);
    margin-bottom:9px;
}

/* ================= INFO ================= */

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:7px;
}

.infoBox{
    background:rgba(4,20,34,.94);
    border:1px solid rgba(0,229,255,.45);
    border-radius:11px;
    padding:7px;
    text-align:center;
    box-shadow:0 0 12px rgba(0,229,255,.1);
}

.infoTitle{
    color:#7896aa;
    font-size:10px;
    margin-bottom:3px;
}

.infoValue{
    color:#fff;
    font-size:18px;
    font-weight:900;
}

/* ================= TIMER ================= */

.timerBox{
    text-align:center;
    margin:4px 0 6px;
}

.timerTitle{
    color:#ffd34e;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
}

.timer{
    color:#ffd34e;
    font-size:28px;
    line-height:30px;
    font-weight:900;
    text-shadow:
        0 0 7px rgba(255,211,78,.8),
        0 0 16px rgba(255,211,78,.35);
}

.timer.closed{
    color:#ff5555;
    text-shadow:0 0 12px rgba(255,70,70,.7);
}

/* ================= MODE ================= */

.modeBar{
    display:flex;
    gap:7px;
    margin-bottom:7px;
}

.modeBtn{
    flex:1;
    border:1px solid rgba(0,229,255,.4);
    background:#061a2b;
    color:#bceefa;
    border-radius:9px;
    padding:8px 4px;
    font-size:11px;
    font-weight:900;
}

.modeBtn.active{
    border-color:#ffd34e;
    color:#ffd34e;
    box-shadow:0 0 10px rgba(255,211,78,.25);
}

/* ================= WHEEL ================= */

.wheelArea{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:2px 0 7px;
}

.wheel{
    position:relative;
    width:min(64vw,275px);
    height:min(64vw,275px);
    border-radius:50%;
    border:7px solid #ffd34e;
    background:
        radial-gradient(circle,#0a304d 0%,#031522 62%,#010910 100%);
    box-shadow:
        0 0 12px rgba(255,211,78,.75),
        0 0 28px rgba(0,229,255,.22),
        inset 0 0 28px rgba(0,229,255,.15);
}

.wheelRing{
    position:absolute;
    inset:12px;
    border-radius:50%;
    border:1px solid rgba(0,229,255,.35);
    pointer-events:none;
}

.wheelNumber{
    position:absolute;
    left:50%;
    top:50%;
    width:35px;
    height:35px;
    margin-left:-17.5px;
    margin-top:-17.5px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:15px;
    font-weight:900;
    text-shadow:0 0 5px #000;
}

.wheelCenter{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:76px;
    height:76px;
    border-radius:50%;
    background:#03111d;
    border:3px solid #00e5ff;
    box-shadow:
        0 0 13px rgba(0,229,255,.8),
        inset 0 0 13px rgba(0,229,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:10;
}

.centerText{
    color:#00e5ff;
    font-size:17px;
    font-weight:900;
    line-height:20px;
}

.pointer{
    position:absolute;
    left:50%;
    top:-5px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:19px solid #ff4545;
    filter:drop-shadow(0 0 5px #ff4545);
    z-index:20;
}

/* ================= RESULT ================= */

.result{
    min-height:22px;
    text-align:center;
    color:#b9d5e5;
    font-size:13px;
    font-weight:700;
    margin-bottom:5px;
}

/* ================= LAST WIN ================= */

.lastTitle{
    text-align:center;
    color:#7896aa;
    font-size:10px;
    margin-bottom:4px;
}

.lastWins{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:7px;
}

.lastNumber{
    width:35px;
    height:35px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#061b2c;
    border:1px solid rgba(0,229,255,.35);
    color:#fff;
    font-size:15px;
    font-weight:900;
}

/* ================= SELECTED BET ================= */

.selectedBet{
    min-height:37px;
    border:1px solid rgba(0,229,255,.38);
    background:rgba(4,20,34,.92);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:7px;
    margin-bottom:7px;
    font-size:12px;
}

.selectedBet span{
    color:#00e5ff;
    font-weight:900;
}

/* ================= NUMBER GRID ================= */

.numberGrid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
}

.betNumber{
    min-height:53px;
    border-radius:9px;
    border:1px solid rgba(0,229,255,.38);
    background:
        linear-gradient(180deg,#092640,#031421);
    color:#fff;
    font-size:19px;
    font-weight:900;
    touch-action:none;
    position:relative;
    transition:transform .08s;
}

.betNumber:active{
    transform:scale(.94);
}

.betNumber.selected{
    border-color:#ffd34e;
    box-shadow:
        0 0 10px rgba(255,211,78,.55),
        inset 0 0 9px rgba(255,211,78,.12);
}

.betNumber.disabled{
    opacity:.48;
}

.betCount{
    display:block;
    color:#ffd34e;
    font-size:8px;
    line-height:10px;
}

/* ================= GAME BUTTONS ================= */

.gameButtons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:10px;
}

.gameButton{
    border:1px solid rgba(0,229,255,.35);
    background:#061a2b;
    color:#d8f8ff;
    border-radius:9px;
    padding:9px 3px;
    font-size:10px;
    font-weight:900;
}

/* ================= SMALL SCREEN ================= */

@media(max-width:360px){

    .app{
        padding-left:7px;
        padding-right:7px;
    }

    .wheel{
        width:250px;
        height:250px;
    }

    .numberGrid{
        gap:5px;
    }

    .betNumber{
        min-height:48px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">ZYNO</div>

    <div class="info">

        <div class="infoBox">
            <div class="infoTitle">BALANCE</div>
            <div class="infoValue" id="balance">10000</div>
        </div>

        <div class="infoBox">
            <div class="infoTitle">LAST WIN</div>
            <div class="infoValue" id="lastWin">—</div>
        </div>

    </div>

    <div class="timerBox">
        <div class="timerTitle">BETTING TIME</div>
        <div class="timer" id="timer">60</div>
    </div>

    <div class="modeBar">

        <button class="modeBtn active" id="mode36">
            🔴 ZYNO 0–36
        </button>

        <button class="modeBtn" id="mode11">
            🔢 ZYNO 0–11
        </button>

    </div>

    <div class="wheelArea">

        <div class="wheel" id="wheel">

            <div class="pointer"></div>

            <div class="wheelRing"></div>

            <div class="wheelCenter">
                <div class="centerText" id="centerText">
                    ZYNO
                </div>
            </div>

        </div>

    </div>

    <div class="result" id="result">
        Number select karo
    </div>

    <div class="lastTitle">
        LAST 4 WIN
    </div>

    <div class="lastWins" id="lastWins">
        <div class="lastNumber">—</div>
        <div class="lastNumber">—</div>
        <div class="lastNumber">—</div>
        <div class="lastNumber">—</div>
    </div>

    <div class="selectedBet" id="selectedBet">
        Number select karo
    </div>

    <div class="numberGrid" id="numberGrid"></div>

    <div class="gameButtons">

        <button class="gameButton">
            🎲 ZYNO LUDO
        </button>

        <button class="gameButton">
            🔢 ZYNO 0–11
        </button>

        <button class="gameButton">
            🃏 TEEN PATTI
        </button>

    </div>

</div>

<script>

/* =====================================================
   ZYNO SETTINGS
===================================================== */

const START_BALANCE = 10000;

/* 60 seconds total */
const TOTAL_TIME = 60;

/*
   At 56 seconds remaining,
   betting closes.
   Last 4 seconds = NO NEW BET.
*/
const BET_CLOSE_AT = 56;

/*
   Holding number:
   every 0.25 second = 1 point
*/
const BET_INTERVAL = 250;


/* =====================================================
   GAME STATE
===================================================== */

let balance = Number(
    localStorage.getItem("zynoBalance")
) || START_BALANCE;

let currentMode =
    localStorage.getItem("zynoMode") || "36";

let bets = {};

let selectedNumber = null;

let spinning = false;

let bettingOpen = true;

let timerInterval = null;

let roundStartTime =
    Number(localStorage.getItem("zynoRoundStart"));

let lastWins =
    JSON.parse(
        localStorage.getItem("zynoLastWins") || "[]"
    );


/* =====================================================
   ELEMENTS
===================================================== */

const balanceEl =
    document.getElementById("balance");

const timerEl =
    document.getElementById("timer");

const lastWinEl =
    document.getElementById("lastWin");

const lastWinsEl =
    document.getElementById("lastWins");

const selectedBetEl =
    document.getElementById("selectedBet");

const numberGrid =
    document.getElementById("numberGrid");

const resultEl =
    document.getElementById("result");

const wheel =
    document.getElementById("wheel");

const centerText =
    document.getElementById("centerText");

const mode36Btn =
    document.getElementById("mode36");

const mode11Btn =
    document.getElementById("mode11");


/* =====================================================
   SAVE
===================================================== */

function saveBalance(){

    localStorage.setItem(
        "zynoBalance",
        Math.floor(balance)
    );
}

function saveLastWins(){

    localStorage.setItem(
        "zynoLastWins",
        JSON.stringify(lastWins)
    );
}


/* =====================================================
   BALANCE
===================================================== */

function updateBalance(){

    balanceEl.textContent =
        Math.floor(balance);

    saveBalance();
}


/* =====================================================
   MODE
===================================================== */

function getMaxNumber(){

    return currentMode === "11" ? 11 : 36;
}

function setMode(mode){

    if(spinning) return;

    currentMode = mode;

    localStorage.setItem(
        "zynoMode",
        mode
    );

    mode36Btn.classList.toggle(
        "active",
        mode === "36"
    );

    mode11Btn.classList.toggle(
        "active",
        mode === "11"
    );

    bets = {};

    selectedNumber = null;

    centerText.textContent = "ZYNO";

    selectedBetEl.textContent =
        "Number select karo";

    resultEl.textContent =
        "Number select karo";

    createWheel();

    createNumberGrid();
}


/* =====================================================
   WHEEL
===================================================== */

function createWheel(){

    wheel.querySelectorAll(
        ".wheelNumber"
    ).forEach(el => el.remove());

    const max =
        getMaxNumber();

    const total =
        max + 1;

    const radius =
        wheel.clientWidth * 0.385;

    for(let i=0;i<total;i++){

        const number =
            document.createElement("div");

        number.className =
            "wheelNumber";

        number.textContent =
            i;

        const angle =
            (360 / total) * i - 90;

        const rad =
            angle * Math.PI / 180;

        const x =
            Math.cos(rad) * radius;

        const y =
            Math.sin(rad) * radius;

        number.style.transform =
            `translate(${x}px,${y}px)`;

        wheel.appendChild(number);
    }
}


/* =====================================================
   NUMBER GRID
===================================================== */

function createNumberGrid(){

    numberGrid.innerHTML = "";

    const max =
        getMaxNumber();

    for(let i=0;i<=max;i++){

        createBetButton(i);
    }
}


/* =====================================================
   BET BUTTON
===================================================== */

function createBetButton(number){

    const button =
        document.createElement("button");

    button.className =
        "betNumber";

    button.dataset.number =
        number;

    button.innerHTML = `
        ${number}
        <span class="betCount" id="bet-${number}">
            BET 0
        </span>
    `;

    let interval = null;


    function startBet(e){

        if(e){
            e.preventDefault();
        }

        if(spinning) return;

        if(!bettingOpen){

            resultEl.textContent =
                "Betting band hai";

            return;
        }

        if(balance <= 0){

            resultEl.textContent =
                "Balance khatam hai";

            return;
        }

        selectedNumber =
            number;

        button.classList.add(
            "selected"
        );

        updateSelectedBet();


        /*
           Every 0.25 second = 1 point
        */

        interval =
            setInterval(()=>{

                if(
                    !bettingOpen ||
                    spinning ||
                    balance <= 0
                ){

                    stopBet();

                    return;
                }

                balance -= 1;

                if(!bets[number]){
                    bets[number] = 0;
                }

                bets[number] += 1;

                updateBalance();

                updateBetCount(number);

                updateSelectedBet();

            },BET_INTERVAL);
    }


    function stopBet(e){

        if(e){
            e.preventDefault();
        }

        if(interval){

            clearInterval(interval);

            interval = null;
        }

        button.classList.remove(
            "selected"
        );
    }


    button.addEventListener(
        "pointerdown",
        startBet
    );

    button.addEventListener(
        "pointerup",
        stopBet
    );

    button.addEventListener(
        "pointercancel",
        stopBet
    );

    button.addEventListener(
        "pointerleave",
        stopBet
    );

    numberGrid.appendChild(button);
}


/* =====================================================
   BET COUNT
===================================================== */

function updateBetCount(number){

    const el =
        document.getElementById(
            `bet-${number}`
        );

    if(!el) return;

    el.textContent =
        `BET ${bets[number] || 0}`;
}


/* =====================================================
   SELECTED BET
===================================================== */

function updateSelectedBet(){

    if(selectedNumber === null){

        selectedBetEl.textContent =
            "Number select karo";

        return;
    }

    const amount =
        bets[selectedNumber] || 0;

    selectedBetEl.innerHTML =
        `Number <span>${selectedNumber}</span> par total <span>${amount}</span> points bet`;
}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    clearInterval(timerInterval);

    /*
       Refresh par naya 60 sec start nahi hoga.
       Existing round continue hoga.
    */

    if(
        !roundStartTime ||
        Date.now() - roundStartTime
        >= TOTAL_TIME * 1000
    ){

        roundStartTime =
            Date.now();

        localStorage.setItem(
            "zynoRoundStart",
            roundStartTime
        );
    }

    updateTimer();

    timerInterval =
        setInterval(updateTimer,250);
}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(){

    const elapsed =
        Math.floor(
            (Date.now() - roundStartTime) / 1000
        );

    let remaining =
        TOTAL_TIME - elapsed;

    if(remaining < 0){
        remaining = 0;
    }

    timerEl.textContent =
        remaining;


    /*
       LAST 4 SECONDS:
       New betting closed.
    */

    if(
        remaining <= BET_CLOSE_AT &&
        bettingOpen
    ){

        bettingOpen = false;

        document
            .querySelectorAll(".betNumber")
            .forEach(btn=>{
                btn.classList.add("disabled");
            });

        timerEl.classList.add("closed");

        resultEl.textContent =
            "Betting band — wheel spin hoga";
    }


    /*
       60 seconds complete:
       spin.
    */

    if(
        remaining <= 0 &&
        !spinning
    ){

        clearInterval(timerInterval);

        startSpin();
    }
}


/* =====================================================
   RANDOM WIN
===================================================== */

function getWinningNumber(){

    return Math.floor(
        Math.random() *
        (getMaxNumber()+1)
    );
}


/* =====================================================
   SPIN
===================================================== */

function startSpin(){

    if(spinning) return;

    spinning = true;

    bettingOpen = false;

    document
        .querySelectorAll(".betNumber")
        .forEach(btn=>{
            btn.classList.add("disabled");
        });

    resultEl.textContent =
        "Wheel spin ho raha hai...";


    const winningNumber =
        getWinningNumber();


    /*
       IMPORTANT:

       Wheel ka winning number
       pointer ke neeche set NAHI kiya jayega.

       Wheel sirf visual spin karega.

       Result center mein aayega.
    */

    const rotations =
        4 + Math.floor(
            Math.random()*3
        );

    const randomRotation =
        Math.floor(
            Math.random()*360
        );

    const finalRotation =
        rotations * 360 +
        randomRotation;


    wheel.style.transition =
        "transform 5.8s cubic-bezier(.12,.72,.12,1)";

    wheel.style.transform =
        `rotate(${finalRotation}deg)`;


    setTimeout(()=>{

        finishRound(
            winningNumber
        );

    },6000);
}


/* =====================================================
   FINISH ROUND
===================================================== */

function finishRound(
    winningNumber
){

    /*
       MOST IMPORTANT CHANGE:

       Center mein ZYNO ki jagah
       WIN NUMBER dikhega.

       Example:
       WIN 17

       Winning number ko
       pointer ke neeche nahi laya jayega.
    */

    centerText.innerHTML =
        `WIN<br>${winningNumber}`;


    lastWinEl.textContent =
        winningNumber;


    addLastWin(
        winningNumber
    );


    const winningBet =
        bets[winningNumber] || 0;


    /* ==========================================
       0–11 RULE

       10 points bet = 100 points

       Formula:
       every 1 point = 10 payout
    ========================================== */

    if(currentMode === "11"){

        if(winningBet > 0){

            const payout =
                winningBet * 10;

            balance += payout;

            resultEl.textContent =
                `WIN ${winningNumber} — ${payout} points mile`;

        }else{

            resultEl.textContent =
                `Winning Number: ${winningNumber}`;
        }
    }


    /* ==========================================
       0–36 RULE

       Old rule:
       winning amount = bet × 35
       + original bet returned

       Example:
       10 bet
       350 win
       + 10 returned
       = 360 total
    ========================================== */

    else{

        if(winningBet > 0){

            const winAmount =
                winningBet * 35;

            const returnedBet =
                winningBet;

            const totalPayout =
                winAmount +
                returnedBet;

            balance +=
                totalPayout;

            resultEl.textContent =
                `WIN ${winningNumber} — ${totalPayout} points mile`;

        }else{

            resultEl.textContent =
                `Winning Number: ${winningNumber}`;
        }
    }


    updateBalance();


    /*
       Center mein WIN number
       thodi der rahega.
    */

    setTimeout(()=>{

        resetRound();

    },3000);
}


/* =====================================================
   LAST 4 WIN
===================================================== */

function addLastWin(number){

    lastWins.push(number);

    if(lastWins.length > 4){

        lastWins.shift();
    }

    saveLastWins();

    renderLastWins();
}


/* =====================================================
   RENDER LAST 4
===================================================== */

function renderLastWins(){

    lastWinsEl.innerHTML = "";

    const values =
        [null,null,null,null];

    const start =
        4 - lastWins.length;

    lastWins.forEach(
        (number,index)=>{

            values[
                start + index
            ] = number;
        }
    );


    values.forEach(number=>{

        const div =
            document.createElement("div");

        div.className =
            "lastNumber";

        div.textContent =
            number === null
            ? "—"
            : number;

        lastWinsEl.appendChild(
            div
        );
    });
}


/* =====================================================
   RESET ROUND
===================================================== */

function resetRound(){

    /*
       Wheel वापस normal position.
    */

    wheel.style.transition =
        "none";

    wheel.style.transform =
        "rotate(0deg)";


    bets = {};

    selectedNumber =
        null;

    spinning =
        false;

    bettingOpen =
        true;


    centerText.textContent =
        "ZYNO";


    selectedBetEl.textContent =
        "Number select karo";


    resultEl.textContent =
        "Number select karo";


    document
        .querySelectorAll(".betNumber")
        .forEach(btn=>{

            btn.classList.remove(
                "disabled"
            );

            btn.classList.remove(
                "selected"
            );
        });


    createNumberGrid();


    /*
       New 60-second round
    */

    roundStartTime =
        Date.now();

    localStorage.setItem(
        "zynoRoundStart",
        roundStartTime
    );


    timerEl.classList.remove(
        "closed"
    );


    startTimer();
}


/* =====================================================
   MODE BUTTONS
===================================================== */

mode36Btn.addEventListener(
    "click",
    ()=>{
        setMode("36");
    }
);

mode11Btn.addEventListener(
    "click",
    ()=>{
        setMode("11");
    }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
    "load",
    ()=>{

        updateBalance();

        renderLastWins();

        setMode(
            currentMode
        );

        startTimer();
    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        createWheel();
    }
);

</script>

</body>
</html>
