<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#102c52 0%,#061329 42%,#020812 100%);
    color:white;
    overflow-x:hidden;
    padding-bottom:25px;
}

/* HEADER */

.header{
    text-align:center;
    padding:12px 10px 6px;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:5px;
    color:#00e5ff;
    text-shadow:
        0 0 8px #00e5ff,
        0 0 20px #00e5ff;
}

/* INFO */

.info-row{
    width:94%;
    max-width:520px;
    margin:8px auto 10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.info-box{
    background:rgba(0,20,45,.88);
    border:1px solid #087ea0;
    border-radius:10px;
    padding:8px 5px;
    text-align:center;
    box-shadow:0 0 8px rgba(0,229,255,.16);
}

.info-title{
    color:#8ea6bb;
    font-size:11px;
    font-weight:bold;
}

.info-value{
    color:#fff;
    font-size:17px;
    font-weight:900;
    margin-top:2px;
}

/* LAST 4 */

.last4-box{
    width:94%;
    max-width:520px;
    margin:0 auto 9px;
    background:rgba(0,20,45,.88);
    border:1px solid #087ea0;
    border-radius:10px;
    padding:7px;
}

.last4-title{
    text-align:center;
    color:#8ea6bb;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.last4{
    display:flex;
    justify-content:center;
    gap:8px;
}

.last-number{
    width:38px;
    height:30px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:15px;
    background:#151d29;
    border:1px solid #566170;
}

.last-number.red{
    background:#a9101c;
    border-color:#ff5662;
}

.last-number.black{
    background:#090b0e;
    border-color:#555;
}

.last-number.green{
    background:#087a46;
    border-color:#16d27f;
}

/* TIMER */

.timer-box{
    width:94%;
    max-width:520px;
    margin:5px auto 10px;
    text-align:center;
}

.timer-label{
    color:#ffd34e;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
}

.timer{
    font-size:27px;
    font-weight:900;
    color:#ffd34e;
    text-shadow:0 0 12px rgba(255,211,78,.6);
    margin-top:2px;
}

/* WHEEL */

.wheel-area{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:3px auto 10px;
}

.wheel{
    position:relative;
    width:min(68vw,275px);
    height:min(68vw,275px);
    border-radius:50%;
    border:7px solid #ffd34e;
    background:#101820;
    box-shadow:
        0 0 10px #ffd34e,
        0 0 25px rgba(255,211,78,.35),
        inset 0 0 20px #000;
    overflow:hidden;
}

.wheel-inner{
    position:absolute;
    inset:15px;
    border:2px solid rgba(255,211,78,.6);
    border-radius:50%;
}

.wheel-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:68px;
    height:68px;
    border-radius:50%;
    background:#061329;
    border:3px solid #00e5ff;
    box-shadow:0 0 16px #00e5ff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#00e5ff;
    font-size:14px;
    font-weight:900;
    z-index:5;
}

.wheel-number{
    position:absolute;
    left:50%;
    top:50%;
    width:42px;
    height:42px;
    margin-left:-21px;
    margin-top:-21px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:900;
    z-index:3;
    pointer-events:none;
}

.wheel-number.red{
    color:#ff4855;
}

.wheel-number.black{
    color:#fff;
}

.wheel-number.green{
    color:#20e98b;
}

/* POINTER */

.pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:18px solid #ffd34e;
    filter:drop-shadow(0 0 5px #ffd34e);
    z-index:10;
}

/* RESULT */

.result{
    width:94%;
    max-width:520px;
    margin:0 auto 10px;
    min-height:25px;
    text-align:center;
    color:#00e5ff;
    font-size:14px;
    font-weight:900;
}

/* NUMBER GRID */

.numbers-title{
    text-align:center;
    color:#8ea6bb;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.number-grid{
    width:94%;
    max-width:520px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
}

.bet-number{
    min-height:44px;
    border-radius:8px;
    border:1px solid #31506c;
    background:linear-gradient(#10263d,#071522);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:900;
    position:relative;
    cursor:pointer;
    touch-action:none;
    outline:none;
    -webkit-tap-highlight-color:transparent;
}

.bet-number.red{
    background:linear-gradient(#a71824,#650b13);
    border-color:#e52d3c;
}

.bet-number.black{
    background:linear-gradient(#20252a,#090b0e);
}

.bet-number.green{
    background:linear-gradient(#07844d,#03492c);
    border-color:#14c878;
}

.bet-number.selected{
    box-shadow:
        0 0 0 2px #00e5ff,
        0 0 13px #00e5ff;
    border-color:#00e5ff;
}

.bet-count{
    position:absolute;
    right:3px;
    bottom:2px;
    font-size:9px;
    color:#00e5ff;
    font-weight:900;
}

/* GAME BUTTONS */

.games{
    width:94%;
    max-width:520px;
    margin:13px auto 0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.game-btn{
    border:1px solid #175a79;
    border-radius:9px;
    padding:9px 3px;
    background:#071a2b;
    color:white;
    font-size:11px;
    font-weight:900;
}

/* DISABLED */

.bet-number.disabled{
    opacity:.45;
    pointer-events:none;
}

/* WIN ANIMATION */

@keyframes winPulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.15)}
    100%{transform:scale(1)}
}

.win{
    animation:winPulse .7s ease;
}

@media(max-width:360px){
    .wheel{
        width:245px;
        height:245px;
    }

    .bet-number{
        min-height:40px;
        font-size:15px;
    }

    .wheel-number{
        font-size:16px;
    }
}
</style>
</head>

<body
    oncontextmenu="return false"
    onselectstart="return false">

<div class="header">
    <div class="logo">ZYNO</div>
</div>

<div class="info-row">

    <div class="info-box">
        <div class="info-title">BALANCE</div>
        <div class="info-value">
            <span id="balance">10000</span>
        </div>
    </div>

    <div class="info-box">
        <div class="info-title">LAST WIN</div>
        <div class="info-value">
            <span id="lastWin">-</span>
        </div>
    </div>

</div>

<div class="last4-box">

    <div class="last4-title">LAST 4 WIN</div>

    <div class="last4" id="last4">
        <div class="last-number">-</div>
        <div class="last-number">-</div>
        <div class="last-number">-</div>
        <div class="last-number">-</div>
    </div>

</div>

<div class="timer-box">
    <div class="timer-label">BETTING TIME</div>
    <div class="timer" id="timer">60</div>
</div>

<div class="wheel-area">

    <div class="wheel" id="wheel">

        <div class="pointer"></div>

        <div class="wheel-inner"></div>

        <div class="wheel-center" id="wheelCenter">
            ZYNO
        </div>

    </div>

</div>

<div class="result" id="result"></div>

<div class="numbers-title">
    NUMBER PAR PRESS & HOLD KARKE BET LAGAO
</div>

<div class="number-grid" id="numberGrid"></div>

<div class="games">

    <button class="game-btn">🎲 ZYNO LUDO</button>

    <button class="game-btn">🔢 ZYNO 0–11</button>

    <button class="game-btn">🃏 TEEN PATTI</button>

</div>

<script>

/* =========================================
   ZYNO ROULETTE
========================================= */

const TOTAL_TIME = 60;

let balance = Number(
    localStorage.getItem("zyno_balance") || 10000
);

let bets = {};

let lastWins = JSON.parse(
    localStorage.getItem("zyno_lastWins") || "[]"
);

let roundEndTime = Number(
    localStorage.getItem("zyno_roundEnd") || 0
);

let roundFinished = false;
let timerInterval = null;

let audioContext = null;


/* =========================================
   BALANCE
========================================= */

function updateBalance(){

    document.getElementById("balance").textContent =
        Math.floor(balance);

    localStorage.setItem(
        "zyno_balance",
        balance
    );
}


/* =========================================
   ROULETTE COLORS
========================================= */

const redNumbers = [
    1,3,5,7,9,12,14,16,18,
    19,21,23,25,27,30,32,34,36
];

function numberColor(number){

    if(number === 0){
        return "green";
    }

    return redNumbers.includes(number)
        ? "red"
        : "black";
}


/* =========================================
   CREATE WHEEL NUMBERS
========================================= */

const wheel = document.getElementById("wheel");

const wheelNumbers = [];

for(let i = 0; i <= 36; i++){

    const el = document.createElement("div");

    el.className =
        "wheel-number " + numberColor(i);

    el.textContent = i;

    wheel.appendChild(el);

    wheelNumbers.push(el);
}


/* =========================================
   POSITION WHEEL NUMBERS
========================================= */

function positionWheelNumbers(){

    const size = wheel.clientWidth;

    const center = size / 2;

    const radius = size * 0.395;

    wheelNumbers.forEach((el,index)=>{

        const angle =
            (index / 37) * Math.PI * 2
            - Math.PI / 2;

        const x =
            center +
            Math.cos(angle) * radius;

        const y =
            center +
            Math.sin(angle) * radius;

        el.style.left = x + "px";
        el.style.top = y + "px";

        el.style.marginLeft = "-21px";
        el.style.marginTop = "-21px";

    });
}

window.addEventListener(
    "resize",
    positionWheelNumbers
);

positionWheelNumbers();


/* =========================================
   NUMBER GRID
========================================= */

const numberGrid =
    document.getElementById("numberGrid");

for(let i = 0; i <= 36; i++){

    const button =
        document.createElement("button");

    button.className =
        "bet-number " + numberColor(i);

    button.dataset.number = i;

    button.innerHTML = `
        <span>${i}</span>
        <span class="bet-count" id="bet-${i}"></span>
    `;

    /*
       Prevent blue selection/copy effect
    */

    button.addEventListener(
        "contextmenu",
        e => e.preventDefault()
    );

    button.addEventListener(
        "selectstart",
        e => e.preventDefault()
    );

    /*
       Touch / mouse
    */

    button.addEventListener(
        "pointerdown",
        startBet
    );

    button.addEventListener(
        "pointerup",
        stopBet
    );

    button.addEventListener(
        "pointercancel",
        stopBet
    );

    button.addEventListener(
        "pointerleave",
        stopBet
    );

    numberGrid.appendChild(button);
}


/* =========================================
   BET HOLD SYSTEM
   0.25 SEC = 1 POINT
========================================= */

let bettingNumber = null;
let betTimer = null;
let holdStarted = false;

function startBet(e){

    e.preventDefault();

    if(roundFinished){
        return;
    }

    /*
       Audio unlock on user interaction
    */

    unlockAudio();

    const number =
        Number(this.dataset.number);

    bettingNumber = number;
    holdStarted = true;

    this.classList.add("selected");

    /*
       First point immediately
    */

    addBetPoint(number);

    /*
       Every 0.25 second = 1 point
    */

    clearInterval(betTimer);

    betTimer = setInterval(()=>{

        if(!holdStarted){
            return;
        }

        if(roundFinished){
            stopBet();
            return;
        }

        addBetPoint(number);

    },250);

}


function stopBet(e){

    if(e){
        e.preventDefault();
    }

    holdStarted = false;

    clearInterval(betTimer);
    betTimer = null;

    document.querySelectorAll(".bet-number")
        .forEach(el=>{
            el.classList.remove("selected");
        });

}


/* =========================================
   ADD BET
========================================= */

function addBetPoint(number){

    if(balance <= 0){
        stopBet();
        return;
    }

    if(!bets[number]){
        bets[number] = 0;
    }

    bets[number]++;
    balance--;

    updateBalance();

    const count =
        document.getElementById("bet-" + number);

    if(count){
        count.textContent =
            "BET " + bets[number];
    }
}


/* =========================================
   TIMER
========================================= */

function setupRound(){

    const now = Date.now();

    /*
       IMPORTANT:
       Refresh ke baad timer reset nahi hoga.
    */

    if(
        !roundEndTime ||
        roundEndTime <= now
    ){

        roundEndTime =
            now + TOTAL_TIME * 1000;

        localStorage.setItem(
            "zyno_roundEnd",
            roundEndTime
        );

    }

    roundFinished = false;

    startTimer();
}


function startTimer(){

    clearInterval(timerInterval);

    updateTimer();

    timerInterval =
        setInterval(updateTimer,100);
}


function updateTimer(){

    const remaining =
        Math.max(
            0,
            roundEndTime - Date.now()
        );

    const seconds =
        Math.ceil(remaining / 1000);

    document.getElementById("timer")
        .textContent = seconds;

    if(remaining <= 0){

        clearInterval(timerInterval);

        if(!roundFinished){

            roundFinished = true;

            stopBet();

            finishRound();
        }
    }
}


/* =========================================
   FINISH ROUND
========================================= */

function finishRound(){

    /*
       Random winning number
    */

    const winningNumber =
        Math.floor(Math.random() * 37);

    showWinner(winningNumber);

    /*
       Save last wins
    */

    lastWins.push(winningNumber);

    if(lastWins.length > 4){
        lastWins.shift();
    }

    localStorage.setItem(
        "zyno_lastWins",
        JSON.stringify(lastWins)
    );

    updateLastWins();

    /*
       Payout
    */

    const playerBet =
        Number(bets[winningNumber] || 0);

    if(playerBet > 0){

        /*
           35:1 roulette payout
           Bet return included
        */

        const winAmount =
            playerBet * 35;

        const returnedBet =
            playerBet;

        const total =
            winAmount + returnedBet;

        balance += total;

        updateBalance();

        document.getElementById("lastWin")
            .textContent =
            winningNumber + " +" + total;

    }else{

        document.getElementById("lastWin")
            .textContent =
            winningNumber;
    }

    /*
       Clear current bets
    */

    setTimeout(()=>{
        clearBetDisplay();
    },1500);

    /*
       New round after result
    */

    setTimeout(()=>{

        bets = {};

        roundEndTime =
            Date.now() + TOTAL_TIME * 1000;

        localStorage.setItem(
            "zyno_roundEnd",
            roundEndTime
        );

        document.getElementById("lastWin")
            .textContent =
            winningNumber;

        setupRound();

    },3500);

}


/* =========================================
   WINNER DISPLAY
========================================= */

function showWinner(number){

    const center =
        document.getElementById("wheelCenter");

    center.textContent =
        "WIN " + number;

    center.classList.remove("win");

    void center.offsetWidth;

    center.classList.add("win");

    /*
       Highlight winning grid number
    */

    document.querySelectorAll(".bet-number")
        .forEach(el=>{
            el.classList.remove("win");
        });

    const winningButton =
        document.querySelector(
            `.bet-number[data-number="${number}"]`
        );

    if(winningButton){

        winningButton.classList.add("win");

    }

    /*
       Strong result sound
    */

    playWinSound(number);
}


/* =========================================
   LAST 4
========================================= */

function updateLastWins(){

    const box =
        document.getElementById("last4");

    box.innerHTML = "";

    /*
       Sirf actual winning numbers
       Last 4 me wahi aayenge.
    */

    const values = [...lastWins];

    while(values.length < 4){
        values.unshift(null);
    }

    values.forEach(number=>{

        const el =
            document.createElement("div");

        el.className =
            "last-number";

        if(number !== null){

            el.textContent = number;

            el.classList.add(
                numberColor(number)
            );

        }else{

            el.textContent = "-";
        }

        box.appendChild(el);

    });

}


/* =========================================
   CLEAR BET DISPLAY
========================================= */

function clearBetDisplay(){

    document.querySelectorAll(".bet-count")
        .forEach(el=>{
            el.textContent = "";
        });

    document.querySelectorAll(".bet-number")
        .forEach(el=>{
            el.classList.remove("selected");
            el.classList.remove("win");
        });

}


/* =========================================
   AUDIO
========================================= */

function unlockAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state === "suspended"){

            audioContext.resume();

        }

    }catch(e){

        console.log("Audio unavailable");

    }

}


/*
   Loud winning sound.
   Browser/device volume ko code se maximum
   force nahi kiya ja sakta, lekin sound gain
   strong rakha gaya hai.
*/

function playWinSound(number){

    try{

        unlockAudio();

        if(!audioContext){
            return;
        }

        const now =
            audioContext.currentTime;

        const gain =
            audioContext.createGain();

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.9,
            now + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.9
        );

        gain.connect(
            audioContext.destination
        );

        /*
           3-tone roulette result sound
        */

        [520,720,920].forEach(
            (frequency,index)=>{

                const osc =
                    audioContext.createOscillator();

                osc.type = "square";

                osc.frequency.value =
                    frequency;

                osc.connect(gain);

                const start =
                    now + index * 0.16;

                const end =
                    start + 0.14;

                osc.start(start);
                osc.stop(end);

            }
        );

    }catch(e){

        console.log("Sound error",e);

    }

}


/* =========================================
   INITIAL LOAD
========================================= */

updateBalance();

updateLastWins();

/*
   Refresh ke baad saved timer se continue
*/

setupRound();


/* =========================================
   SAFARI TOUCH PROTECTION
========================================= */

document.addEventListener(
    "gesturestart",
    e => e.preventDefault()
);

document.addEventListener(
    "selectstart",
    e => e.preventDefault()
);

document.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);

</script>

</body>
</html>
