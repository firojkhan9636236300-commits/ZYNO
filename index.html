<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#102b49 0%,#020b18 48%,#010611 100%);
    color:#fff;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:10px 8px 45px;
}

/* HEADER */

.header{
    text-align:center;
    padding:5px 0 14px;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#00e5ff;
    letter-spacing:5px;
    text-shadow:0 0 15px rgba(0,229,255,.45);
}

.subtitle{
    color:#9eb4ca;
    font-size:11px;
    margin-top:3px;
}

/* GAME BOX */

.game-box{
    position:relative;
    background:
        linear-gradient(
            145deg,
            #21143a 0%,
            #17102d 45%,
            #0b0b1e 100%
        );

    border:4px solid #00e5ff;
    border-radius:55px 55px 0 0;

    padding:20px 15px 35px;

    box-shadow:
        0 0 20px rgba(0,229,255,.18),
        inset 0 0 60px rgba(102,0,180,.08);
}

/* INFO */

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:12px;
}

.info-box{
    background:rgba(8,12,30,.75);
    border:1px solid #31415f;
    border-radius:10px;
    text-align:center;
    padding:8px 3px;
}

.info-title{
    color:#9daec5;
    font-size:8px;
}

.info-value{
    color:#00e5ff;
    font-size:14px;
    font-weight:bold;
    margin-top:4px;
}

/* BETTING TIME */

.betting-time{
    text-align:center;
    margin:4px 0 2px;
}

.betting-title{
    color:#c1bfd7;
    font-size:16px;
    letter-spacing:1px;
}

.timer-big{
    color:#ffd34e;
    font-size:52px;
    line-height:1;
    font-weight:bold;
    text-shadow:0 0 18px rgba(255,211,78,.35);
    margin-top:5px;
}

/* WHEEL */

.wheel-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px 0 20px;
}

.wheel{
    width:min(82vw,370px);
    height:min(82vw,370px);

    border-radius:50%;
    position:relative;

    border:12px solid #ffd34e;

    background:
        repeating-conic-gradient(
            from -4.86deg,
            #090b12 0deg 4.86deg,
            #5a287f 4.86deg 9.72deg
        );

    box-shadow:
        0 0 0 5px #513814,
        0 0 35px rgba(255,211,78,.35),
        inset 0 0 35px #000;
}

/* INNER GOLD RING */

.wheel-ring{
    position:absolute;
    inset:15%;

    border-radius:50%;

    border:5px solid #ffd34e;

    box-shadow:
        0 0 15px rgba(255,211,78,.25),
        inset 0 0 20px #000;
}

/* CENTER */

.wheel-center{
    position:absolute;
    width:31%;
    height:31%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#080b16;

    border:8px solid #00e5ff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#00e5ff;
    font-size:20px;
    font-weight:bold;
    letter-spacing:3px;

    box-shadow:
        0 0 20px rgba(0,229,255,.35),
        inset 0 0 15px #000;

    z-index:3;
}

/* WHEEL NUMBERS */

.wheel-number{
    position:absolute;

    left:50%;
    top:50%;

    width:28px;
    height:28px;

    margin-left:-14px;
    margin-top:-14px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:15px;
    font-weight:bold;

    text-shadow:
        0 2px 4px #000;

    z-index:2;
}

/* POINTER */

.pointer{
    position:absolute;

    top:-13px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:25px solid #ffd34e;

    filter:drop-shadow(0 0 7px rgba(255,211,78,.7));

    z-index:8;
}

/* NUMBER SECTION */

.number-section{
    margin-top:2px;
}

.number-title{
    text-align:center;
    color:#00e5ff;
    font-weight:bold;
    font-size:14px;
    margin-bottom:9px;
    letter-spacing:.5px;
}

.number-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
}

.number{
    min-height:40px;

    border-radius:6px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:bold;

    border:1px solid rgba(255,255,255,.15);

    cursor:pointer;
    user-select:none;

    transition:.15s;
}

.number.red{
    background:#542049;
}

.number.black{
    background:#090b12;
}

.number.zero{
    background:#078b67;
}

.number.selected{
    border:2px solid #00e5ff;

    box-shadow:
        0 0 0 2px rgba(0,229,255,.15),
        0 0 15px rgba(0,229,255,.8);

    transform:scale(.94);
}

/* BET STATUS */

.selected-bet{
    margin-top:10px;

    background:
        linear-gradient(135deg,#24183d,#100d20);

    border:1px solid #5b4677;

    border-radius:10px;

    padding:10px;

    text-align:center;

    color:#bfc6d8;

    font-size:12px;
}

.selected-bet strong{
    color:#00e5ff;
}

/* BET AMOUNT */

.bet-area{
    margin-top:10px;

    background:#0a1020;

    border:1px solid #344766;

    border-radius:12px;

    padding:11px;
}

.bet-label{
    color:#9eabc0;
    font-size:11px;
    margin-bottom:6px;
}

.bet-row{
    display:flex;
    gap:7px;
}

.bet-input{
    flex:1;
    min-width:0;

    background:#030712;

    border:1px solid #3b5272;

    border-radius:7px;

    color:#fff;

    padding:11px;

    font-size:14px;

    outline:none;
}

.bet-input:focus{
    border-color:#00e5ff;
}

.bet-button{
    background:
        linear-gradient(90deg,#00a9e8,#00e5ff);

    color:#00101b;

    border:none;

    border-radius:7px;

    padding:0 18px;

    font-weight:bold;
}

/* GAME BUTTONS */

.game-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;

    margin-top:12px;
}

.game-button{
    min-height:48px;

    border-radius:10px;

    border:1px solid #00bde9;

    background:
        linear-gradient(
            135deg,
            #24143f,
            #101126
        );

    color:#00e5ff;

    font-size:14px;
    font-weight:bold;

    box-shadow:
        0 0 12px rgba(0,229,255,.12);
}

.game-button:active{
    transform:scale(.97);
}

/* SPIN */

.spin-button{
    width:100%;

    margin-top:12px;

    min-height:52px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            90deg,
            #d69b22,
            #ffd34e,
            #e7ad2c
        );

    color:#17100a;

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 0 18px rgba(255,211,78,.25);
}

.spin-button:active{
    transform:scale(.98);
}

/* RESULT */

.result{
    text-align:center;

    margin-top:12px;

    min-height:25px;

    color:#ffd34e;

    font-weight:bold;

    font-size:14px;
}

/* MOBILE */

@media(max-width:480px){

    .container{
        padding:5px 5px 35px;
    }

    .logo{
        font-size:25px;
    }

    .game-box{
        padding:17px 9px 30px;
        border-radius:45px 45px 0 0;
    }

    .timer-big{
        font-size:48px;
    }

    .wheel{
        width:72vw;
height:72vw;
        border-width:9px;
    }

    .wheel-number{
        font-size:13px;
        width:24px;
        height:24px;
        margin-left:-12px;
        margin-top:-12px;
    }

    .number-grid{
        gap:3px;
    }

    .number{
        min-height:38px;
        font-size:13px;
    }

    .game-button{
        font-size:12px;
    }

    .spin-button{
        min-height:50px;
    }
}

@media(max-width:350px){

    .game-box{
        padding-left:7px;
        padding-right:7px;
    }

    .wheel{
        width:84vw;
        height:84vw;
    }

    .number{
        min-height:35px;
        font-size:12px;
    }

    .info-value{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">ZYNO</div>
        <div class="subtitle">
            ROULETTE • PLAY • WIN • REPEAT
        </div>
    </div>


    <div class="game-box">

        <!-- INFO -->

        <div class="info">

            <div class="info-box">
                <div class="info-title">BALANCE</div>
                <div class="info-value" id="balance">
                    10000
                </div>
            </div>

            <div class="info-box">
                <div class="info-title">BET TIME</div>
                <div class="info-value" id="timer">
                    60
                </div>
            </div>

            <div class="info-box">
                <div class="info-title">LAST WIN</div>
                <div class="info-value" id="lastWin">
                    0
                </div>
            </div>

        </div>


        <!-- BIG TIMER -->

        <div class="betting-time">

            <div class="betting-title">
                BETTING TIME
            </div>

            <div class="timer-big" id="bigTimer">
                60
            </div>

        </div>


        <!-- WHEEL -->

        <div class="wheel-area">

            <div class="wheel">

                <div class="pointer"></div>

                <div class="wheel-ring"></div>

                <div class="wheel-center">
                    ZYNO
                </div>

            </div>

        </div>


        <!-- NUMBERS -->

        <div class="number-section">

            <div class="number-title">
                SELECT NUMBER 0 - 36
            </div>

            <div class="number-grid" id="numberGrid"></div>

        </div>


        <!-- SELECTED BET -->

        <div class="selected-bet" id="selectedBet">
            Number select karo
        </div>


        <!-- BET AMOUNT -->

        <div class="bet-area">

            <div class="bet-label">
                BET AMOUNT
            </div>

            <div class="bet-row">

                <input
                    type="number"
                    id="betAmount"
                    class="bet-input"
                    placeholder="Enter points"
                    min="1"
                >

                <button
                    class="bet-button"
                    onclick="placeBet()">
                    BET
                </button>

            </div>

        </div>


        <!-- OTHER GAMES -->

        <div class="game-buttons">

            <button
                class="game-button"
                onclick="openLudo()">
                🎲 ZYNO LUDO 0–11
            </button>

            <button
                class="game-button"
                onclick="openTeenPatti()">
                🃏 TEEN PATTI
            </button>

        </div>


        <!-- SPIN -->

        <button
            class="spin-button"
            onclick="spinRoulette()">
            SPIN
        </button>


        <!-- RESULT -->

        <div class="result" id="result">
            Select a number and place your bet
        </div>

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let balance = 10000;

let selectedNumber = null;

let currentBet = 0;

let timeLeft = 60;

let spinning = false;


/* =========================
   ROULETTE RED NUMBERS
========================= */

const redNumbers = [
    1,3,5,7,9,
    12,14,16,18,
    19,21,23,25,27,
    30,32,34,36
];


/* =========================
   NUMBER GRID
========================= */

const numberGrid =
    document.getElementById("numberGrid");


for(let i = 0; i <= 36; i++){

    const div =
        document.createElement("div");

    div.classList.add("number");


    if(i === 0){

        div.classList.add("zero");

    }
    else if(redNumbers.includes(i)){

        div.classList.add("red");

    }
    else{

        div.classList.add("black");

    }


    div.textContent = i;


    div.onclick = function(){

        if(spinning) return;

        document
            .querySelectorAll(".number")
            .forEach(n =>
                n.classList.remove("selected")
            );


        div.classList.add("selected");


        selectedNumber = i;


        document.getElementById("selectedBet")
            .innerHTML =
            "Selected Number: <strong>" +
            i +
            "</strong>";


        document.getElementById("result")
            .textContent =
            "Number " + i + " selected";

    };


    numberGrid.appendChild(div);
}


/* =========================
   CREATE WHEEL NUMBERS
========================= */

const wheel =
    document.querySelector(".wheel");


for(let i = 0; i <= 36; i++){

    const number =
        document.createElement("div");

    number.className =
        "wheel-number";

    number.textContent = i;


    const angle =
        (i * (360 / 37)) - 90;


    const radius =
        window.innerWidth <= 480
        ? 37
        : 39;


    const x =
        Math.cos(angle * Math.PI / 180)
        * radius;

    const y =
        Math.sin(angle * Math.PI / 180)
        * radius;


    number.style.transform =
        "translate(" +
        x + "vw," +
        y + "vw)";


    /* Better positioning using percentage */

    const angleRad =
        angle * Math.PI / 180;

    const xPercent =
        50 + Math.cos(angleRad) * 39;

    const yPercent =
        50 + Math.sin(angleRad) * 39;


    number.style.left =
        xPercent + "%";

    number.style.top =
        yPercent + "%";

    number.style.transform =
        "translate(-50%,-50%)";


    wheel.appendChild(number);
}


/* =========================
   PLACE BET
========================= */

function placeBet(){

    if(selectedNumber === null){

        document.getElementById("result")
            .textContent =
            "Pehle number select karo";

        return;
    }


    const amount =
        Number(
            document.getElementById("betAmount").value
        );


    if(!amount || amount < 1){

        document.getElementById("result")
            .textContent =
            "Minimum bet 1 point hai";

        return;
    }


    if(amount > balance){

        document.getElementById("result")
            .textContent =
            "Balance kam hai";

        return;
    }


    currentBet = amount;


    document.getElementById("selectedBet")
        .innerHTML =
        "Number <strong>" +
        selectedNumber +
        "</strong> par <strong>" +
        amount +
        "</strong> points bet";


    document.getElementById("result")
        .textContent =
        "Bet placed successfully";

}


/* =========================
   SPIN ROULETTE
========================= */

function spinRoulette(){

    if(spinning) return;


    if(selectedNumber === null){

        document.getElementById("result")
            .textContent =
            "Pehle number select karo";

        return;
    }


    if(currentBet <= 0){

        document.getElementById("result")
            .textContent =
            "Pehle BET button dabao";

        return;
    }


    spinning = true;


    document.getElementById("result")
        .textContent =
        "🎡 Roulette spinning...";


    setTimeout(function(){

        const winningNumber =
            Math.floor(Math.random() * 37);


        if(winningNumber === selectedNumber){

            const winAmount =
                currentBet * 35;


            balance += winAmount;


            document.getElementById("lastWin")
                .textContent =
                winAmount;


            document.getElementById("result")
                .textContent =
                "🎉 WIN! Number " +
                winningNumber +
                " — +" +
                winAmount +
                " points";

        }
        else{

            balance -= currentBet;


            document.getElementById("lastWin")
                .textContent =
                "0";


            document.getElementById("result")
                .textContent =
                "Number " +
                winningNumber +
                " aaya — Bet lost " +
                currentBet +
                " points";

        }


        document.getElementById("balance")
            .textContent =
            balance;


        currentBet = 0;

        spinning = false;


        document.getElementById("betAmount")
            .value = "";

    },1500);

}


/* =========================
   TIMER
========================= */

setInterval(function(){

    if(timeLeft > 0){

        timeLeft--;

    }
    else{

        timeLeft = 60;

        selectedNumber = null;

        currentBet = 0;

        document
            .querySelectorAll(".number")
            .forEach(n =>
                n.classList.remove("selected")
            );

        document.getElementById("selectedBet")
            .textContent =
            "New betting round started";

    }


    document.getElementById("timer")
        .textContent =
        timeLeft;


    document.getElementById("bigTimer")
        .textContent =
        timeLeft;


},1000);


/* =========================
   OTHER GAMES
========================= */

function openLudo(){

    document.getElementById("result")
        .textContent =
        "ZYNO LUDO 0–11 opening soon";

}


function openTeenPatti(){

    document.getElementById("result")
        .textContent =
        "ZYNO TEEN PATTI opening soon";

}

</script>

</body>
</html>
