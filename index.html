<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    overflow-x:hidden;
    overflow-y:auto;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% 20%,
            #102b52 0%,
            #061326 40%,
            #020811 80%
        );

    overflow-x:hidden;
    overflow-y:auto;

    -webkit-overflow-scrolling:touch;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;

    margin:0 auto;

    padding-top:
        max(5px,env(safe-area-inset-top));

    padding-left:10px;
    padding-right:10px;

    padding-bottom:
        max(
            180px,
            calc(150px + env(safe-area-inset-bottom))
        );
}


/* =====================================================
   WHEEL AREA
===================================================== */

.wheel-area{
    position:relative;

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    padding-top:4px;
    padding-bottom:8px;

    overflow:visible;
}


/* =====================================================
   POINTER
===================================================== */

.pointer{
    position:absolute;

    top:2px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:17px solid #ffd34e;

    filter:
        drop-shadow(
            0 0 5px rgba(255,211,78,.55)
        );

    z-index:100;

    pointer-events:none;
}


/* =====================================================
   WHEEL WRAP
===================================================== */

.wheel-wrap{
    position:relative;

    width:min(68vw,275px);
    height:min(68vw,275px);

    min-width:220px;
    min-height:220px;

    max-width:275px;
    max-height:275px;

    flex-shrink:0;

    border-radius:50%;

    padding:8px;

    background:#06101f;

    border:2px solid #d7ad36;

    box-shadow:
        0 0 7px rgba(255,211,78,.25),
        0 0 25px rgba(0,0,0,.8),
        inset 0 0 20px rgba(0,0,0,.9);

    overflow:visible;
}


/* =====================================================
   WHEEL
===================================================== */

.wheel{
    position:relative;

    width:100%;
    height:100%;

    border-radius:50%;

    overflow:visible;

    background:
        repeating-conic-gradient(
            from -4.86deg,
            #b81722 0deg 4.865deg,
            #101820 4.865deg 9.73deg
        );

    border:2px solid #191f29;

    transform:rotate(0deg);

    transition:
        transform 5.8s
        cubic-bezier(.12,.72,.12,1);

    isolation:isolate;
}


/* =====================================================
   INNER RING
===================================================== */

.wheel::before{
    content:"";

    position:absolute;

    inset:7px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,211,78,.22);

    box-shadow:
        0 0 5px rgba(255,211,78,.10),
        inset 0 0 8px rgba(255,211,78,.07);

    z-index:3;

    pointer-events:none;
}


/* =====================================================
   CENTER CIRCLE
===================================================== */

.wheel::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:38%;
    height:38%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #0c2945 0%,
            #06111f 65%,
            #020711 100%
        );

    border:
        2px solid
        rgba(255,211,78,.50);

    box-shadow:
        0 0 10px rgba(0,0,0,.9),
        inset 0 0 14px rgba(0,0,0,.9);

    z-index:8;

    pointer-events:none;
}


/* =====================================================
   WHEEL NUMBERS
===================================================== */

.number{
    position:absolute;

    left:50%;
    top:50%;

    width:24px;
    height:24px;

    margin:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:12px;
    line-height:1;

    font-weight:900;

    text-align:center;

    z-index:20;

    pointer-events:none;

    white-space:nowrap;

    transform:
        translate(-50%,-50%)
        rotate(var(--angle))
        translateY(-98px)
        rotate(calc(-1 * var(--angle)));

    text-shadow:
        0 1px 2px #000,
        0 0 3px rgba(0,0,0,.8);
}

.number.zero{
    color:#ffd34e;
}


/* =====================================================
   CENTER LOGO
===================================================== */

.center-logo{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:30;

    font-size:19px;

    font-weight:900;

    letter-spacing:3px;

    color:#00e5ff;

    text-shadow:
        0 0 5px rgba(0,229,255,.8),
        0 0 15px rgba(0,229,255,.45);

    pointer-events:none;
}

.center-win{
    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:31;

    display:none;

    font-size:16px;

    font-weight:900;

    color:#ffd34e;

    text-shadow:
        0 0 10px rgba(255,211,78,.75);

    pointer-events:none;
}


/* =====================================================
   TIMER
===================================================== */

.timer-area{
    width:100%;

    text-align:center;

    margin:2px 0 5px;
}

.timer-label{
    font-size:9px;

    color:#6f89a7;

    letter-spacing:2px;

    margin-bottom:2px;
}

.timer{
    font-size:28px;

    line-height:30px;

    font-weight:900;

    color:#ffd34e;

    text-shadow:
        0 0 10px rgba(255,211,78,.25);
}

.timer.closed{
    color:#ff5964;
}


/* =====================================================
   RESULT
===================================================== */

.result{
    min-height:27px;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    color:#00e5ff;

    font-size:12px;

    font-weight:700;

    margin-bottom:5px;
}


/* =====================================================
   BALANCE + LAST WIN
===================================================== */

.bottom-info{
    width:100%;

    display:grid;

    grid-template-columns:
        1fr 1.35fr;

    gap:7px;

    margin:2px 0 7px;
}

.info-box{
    min-height:46px;

    padding:6px 10px;

    border:
        1px solid
        rgba(0,229,255,.22);

    border-radius:10px;

    background:
        rgba(4,17,34,.72);

    box-shadow:
        0 0 12px
        rgba(0,229,255,.05);
}

.info-title{
    color:#6883a5;

    font-size:8px;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.info-value{
    color:#fff;

    font-size:15px;

    font-weight:800;

    margin-top:2px;
}

.last-wins{
    display:flex;

    gap:4px;

    justify-content:flex-start;

    margin-top:3px;
}

.last-number{
    width:22px;
    height:22px;

    border-radius:50%;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:10px;

    font-weight:900;

    color:#fff;

    background:#071a31;

    border:
        1px solid
        rgba(255,255,255,.2);
}


/* =====================================================
   SELECTED
===================================================== */

.selected{
    width:100%;

    min-height:38px;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:7px 10px;

    border-radius:10px;

    background:
        rgba(7,23,43,.85);

    border:
        1px solid
        rgba(0,229,255,.17);

    color:#9ab3d0;

    font-size:11px;

    margin-bottom:7px;
}

.selected strong{
    color:#ffd34e;

    margin:0 3px;
}


/* =====================================================
   NUMBER GRID
===================================================== */

.grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(6,minmax(0,1fr));

    gap:5px;

    padding-left:1px;
    padding-right:1px;

    padding-bottom:
        max(
            70px,
            calc(55px + env(safe-area-inset-bottom))
        );
}


/* =====================================================
   BET NUMBER
===================================================== */

.bet-number{
    position:relative;

    min-width:0;
    min-height:42px;

    border-radius:8px;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        linear-gradient(
            145deg,
            #0c2039,
            #071322
        );

    color:#fff;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    font-size:16px;

    font-weight:900;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

    touch-action:none;

    cursor:pointer;

    box-shadow:
        inset 0 0 8px rgba(0,0,0,.45),
        0 2px 5px rgba(0,0,0,.25);

    transition:
        transform .08s ease,
        border-color .08s ease,
        box-shadow .08s ease;
}

.bet-number.zero{
    color:#ffd34e;

    border-color:
        rgba(255,211,78,.35);
}

.bet-number.active{
    border-color:#00e5ff;

    background:
        linear-gradient(
            145deg,
            #103c59,
            #082238
        );

    box-shadow:
        0 0 10px
        rgba(0,229,255,.28),

        inset 0 0 10px
        rgba(0,229,255,.08);

    transform:scale(.96);
}

.bet-count{
    min-height:10px;

    margin-top:1px;

    color:#ffd34e;

    font-size:7px;

    font-weight:900;

    letter-spacing:.3px;

    line-height:10px;
}

.bet-number.winner{
    border-color:#ffd34e;

    box-shadow:
        0 0 15px
        rgba(255,211,78,.7),

        inset 0 0 10px
        rgba(255,211,78,.15);

    animation:
        winnerPulse .8s
        ease-in-out 3;
}

@keyframes winnerPulse{

    50%{
        transform:scale(1.08);
    }

}


/* =====================================================
   GAME BUTTONS
===================================================== */

.games{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:4px;

    padding-bottom:20px;
}

.game-btn{
    min-height:34px;

    border:
        1px solid
        rgba(0,229,255,.18);

    border-radius:8px;

    background:#071a30;

    color:#8ca7c5;

    font-size:8px;

    font-weight:800;

    letter-spacing:.4px;
}

.game-btn:active{
    transform:scale(.97);
}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .app{
        padding-left:8px;
        padding-right:8px;
    }

    .wheel-wrap{
        width:245px;
        height:245px;

        min-width:245px;
        min-height:245px;
    }

    .number{
        width:23px;
        height:23px;

        font-size:11px;

        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateY(-89px)
            rotate(calc(-1 * var(--angle)));
    }

    .bet-number{
        min-height:41px;

        font-size:15px;
    }

    .grid{
        gap:4px;
    }

}


/* =====================================================
   VERY SMALL
===================================================== */

@media(max-width:330px){

    .wheel-wrap{
        width:225px;
        height:225px;

        min-width:225px;
        min-height:225px;
    }

    .number{
        width:22px;
        height:22px;

        font-size:10px;

        transform:
            translate(-50%,-50%)
            rotate(var(--angle))
            translateY(-81px)
            rotate(calc(-1 * var(--angle)));
    }

    .bet-number{
        min-height:39px;

        font-size:14px;
    }

    .game-btn{
        font-size:7px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- =================================================
         WHEEL
    ================================================== -->

    <div class="wheel-area">

        <div class="pointer"></div>

        <div class="wheel-wrap">

            <div
                class="wheel"
                id="wheel">

                <div
                    class="center-logo"
                    id="centerLogo">
                    ZYNO
                </div>

                <div
                    class="center-win"
                    id="centerWin">
                    WIN
                </div>

            </div>

        </div>

    </div>


    <!-- =================================================
         TIMER
    ================================================== -->

    <div class="timer-area">

        <div class="timer-label">
            BETTING TIME
        </div>

        <div
            class="timer"
            id="timer">
            60
        </div>

    </div>


    <!-- =================================================
         RESULT
    ================================================== -->

    <div
        class="result"
        id="result">

        Number select karo

    </div>


    <!-- =================================================
         BALANCE + LAST WIN
    ================================================== -->

    <div class="bottom-info">

        <div class="info-box">

            <div class="info-title">
                Balance
            </div>

            <div class="info-value">

                <span id="balance">
                    10000
                </span>

            </div>

        </div>


        <div class="info-box">

            <div class="info-title">
                Last Win
            </div>

            <div
                class="last-wins"
                id="lastWins">

                <span class="last-number">-</span>
                <span class="last-number">-</span>
                <span class="last-number">-</span>
                <span class="last-number">-</span>

            </div>

        </div>

    </div>


    <!-- =================================================
         SELECTED BET
    ================================================== -->

    <div
        class="selected"
        id="selected">

        Koi number select nahi hai

    </div>


    <!-- =================================================
         NUMBER GRID
    ================================================== -->

    <div
        class="grid"
        id="grid">
    </div>


    <!-- =================================================
         GAME BUTTONS
    ================================================== -->

    <div class="games">

        <button
            class="game-btn"
            type="button">
            🎲 ZYNO LUDO
        </button>

        <button
            class="game-btn"
            type="button">
            🔢 ZYNO 0–11
        </button>

        <button
            class="game-btn"
            type="button">
            🃏 TEEN PATTI
        </button>

    </div>


</div>


<script>

/* =====================================================
   ZYNO ROULETTE
===================================================== */


/* =====================================================
   DOM
===================================================== */

const wheel =
    document.getElementById("wheel");

const grid =
    document.getElementById("grid");

const timerEl =
    document.getElementById("timer");

const balanceEl =
    document.getElementById("balance");

const resultEl =
    document.getElementById("result");

const selectedEl =
    document.getElementById("selected");

const lastWinsEl =
    document.getElementById("lastWins");

const centerLogo =
    document.getElementById("centerLogo");

const centerWin =
    document.getElementById("centerWin");


/* =====================================================
   VARIABLES
===================================================== */

let balance = 10000;

let timeLeft = 60;

let bettingOpen = true;

let spinning = false;

let selectedNumber = null;

let bets = {};

let lastWins = [];

let wheelRotation = 0;


/* =====================================================
   HOLD BET
===================================================== */

let currentPress = null;

let currentPressTimer = null;

let currentPressing = false;

let currentPressNumber = null;

let currentPressStart = 0;

let currentPressPoints = 0;


/* =====================================================
   BET SPEED
===================================================== */

/*
   0.10 second = 1 point
   0.20 second = 2 points
   0.50 second = 5 points
   1.00 second = 10 points
*/

const POINT_TIME = 100;


/* =====================================================
   ROULETTE NUMBERS
===================================================== */

const wheelNumbers = [

    0,
    32,
    15,
    19,
    4,
    21,
    2,
    25,
    17,
    34,
    6,
    27,
    13,
    36,
    11,
    30,
    8,
    23,
    10,
    5,
    24,
    16,
    33,
    1,
    20,
    14,
    31,
    9,
    22,
    18,
    29,
    7,
    28,
    12,
    35,
    3,
    26

];


/* =====================================================
   CREATE WHEEL NUMBERS
===================================================== */

const slice =
    360 / wheelNumbers.length;


wheelNumbers.forEach(
    (num,index)=>{

        const el =
            document.createElement("div");

        el.className =
            "number" +
            (
                num === 0
                ? " zero"
                : ""
            );

        const angle =
            index * slice;

        el.style.setProperty(
            "--angle",
            angle + "deg"
        );

        el.textContent =
            String(num);

        wheel.appendChild(el);

    }
);


/* =====================================================
   CREATE GRID
===================================================== */

for(
    let i = 0;
    i <= 36;
    i++
){

    const btn =
        document.createElement("div");

    btn.className =
        "bet-number" +
        (
            i === 0
            ? " zero"
            : ""
        );

    btn.dataset.number =
        String(i);

    btn.innerHTML =

        "<div>" +
        i +
        "</div>" +

        "<div " +
        "class=\"bet-count\" " +
        "id=\"count-" +
        i +
        "\">" +
        "</div>";


    grid.appendChild(btn);


    /* =================================================
       POINTER DOWN
    ================================================= */

    btn.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(currentPressing){
                return;
            }

            try{

                btn.setPointerCapture(
                    e.pointerId
                );

            }catch(error){}

            startBet(
                i,
                btn
            );

        },
        {
            passive:false
        }
    );


    /* =================================================
       POINTER UP
    ================================================= */

    btn.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            stopBet(btn);

        },
        {
            passive:false
        }
    );


    /* =================================================
       POINTER CANCEL
    ================================================= */

    btn.addEventListener(
        "pointercancel",
        function(e){

            e.preventDefault();

            stopBet(btn);

        },
        {
            passive:false
        }
    );


    /* =================================================
       POINTER LEAVE
    ================================================= */

    btn.addEventListener(
        "pointerleave",
        function(e){

            if(
                e.pointerType === "mouse" &&
                currentPressing
            ){

                stopBet(btn);

            }

        }
    );

}


/* =====================================================
   START BET
===================================================== */

function startBet(
    number,
    btn
){

    if(currentPressing){
        return;
    }


    if(
        !bettingOpen ||
        spinning
    ){

        resultEl.textContent =
            "Betting closed";

        return;

    }


    if(balance <= 0){

        resultEl.textContent =
            "Balance khatam ho gaya";

        return;

    }


    currentPress =
        btn;

    currentPressNumber =
        number;

    currentPressing =
        true;

    currentPressStart =
        performance.now();

    currentPressPoints =
        0;

    selectedNumber =
        number;


    btn.classList.add(
        "active"
    );


    updateSelected();


    currentPressTimer =
        setInterval(
            function(){

                if(
                    !currentPressing ||
                    !bettingOpen ||
                    spinning
                ){

                    return;

                }


                if(balance <= 0){

                    stopBet(btn);

                    resultEl.textContent =
                        "Balance khatam ho gaya";

                    return;

                }


                const elapsed =
                    performance.now()
                    -
                    currentPressStart;


                const shouldHave =
                    Math.floor(
                        elapsed /
                        POINT_TIME
                    );


                let newPoints =
                    shouldHave -
                    currentPressPoints;


                if(newPoints <= 0){
                    return;
                }


                newPoints =
                    Math.min(
                        newPoints,
                        balance
                    );


                if(newPoints > 0){

                    addBet(
                        number,
                        newPoints
                    );

                    currentPressPoints +=
                        newPoints;

                }


                if(balance <= 0){

                    stopBet(btn);

                }

            },
            10
        );

}


/* =====================================================
   STOP BET
===================================================== */

function stopBet(btn){

    if(!currentPressing){
        return;
    }


    currentPressing =
        false;


    if(currentPressTimer !== null){

        clearInterval(
            currentPressTimer
        );

        currentPressTimer =
            null;

    }


    if(btn){

        btn.classList.remove(
            "active"
        );

    }


    currentPress =
        null;

    currentPressNumber =
        null;

    currentPressStart =
        0;

    currentPressPoints =
        0;

}


/* =====================================================
   STOP ALL BETTING
===================================================== */

function stopAllBetting(){

    currentPressing =
        false;


    if(currentPressTimer !== null){

        clearInterval(
            currentPressTimer
        );

        currentPressTimer =
            null;

    }


    currentPress =
        null;

    currentPressNumber =
        null;

    currentPressStart =
        0;

    currentPressPoints =
        0;


    document
        .querySelectorAll(
            ".bet-number"
        )
        .forEach(
            el=>{

                el.classList.remove(
                    "active"
                );

            }
        );

}


/* =====================================================
   ADD BET
===================================================== */

function addBet(
    number,
    amount
){

    if(
        !bettingOpen ||
        spinning
    ){

        return;

    }


    if(balance < amount){

        amount =
            balance;

    }


    if(amount <= 0){
        return;
    }


    balance -=
        amount;


    bets[number] =
        (bets[number] || 0)
        +
        amount;


    updateBalance();

    updateBetCount(number);

    updateSelected();

}


/* =====================================================
   BALANCE
===================================================== */

function updateBalance(){

    balanceEl.textContent =
        Math.floor(balance);

}


/* =====================================================
   BET COUNT
===================================================== */

function updateBetCount(
    number
){

    const el =
        document.getElementById(
            "count-" + number
        );


    if(!el){
        return;
    }


    const amount =
        bets[number] || 0;


    el.textContent =
        amount > 0
        ? "BET " + amount
        : "";

}


/* =====================================================
   SELECTED
===================================================== */

function updateSelected(){

    if(
        selectedNumber === null
    ){

        selectedEl.innerHTML =
            "Koi number select nahi hai";

        return;

    }


    const total =
        bets[selectedNumber] || 0;


    if(total <= 0){

        selectedEl.innerHTML =
            "Number " +
            "<strong>" +
            selectedNumber +
            "</strong>" +
            " select kiya hai";

        return;

    }


    selectedEl.innerHTML =
        "Number " +
        "<strong>" +
        selectedNumber +
        "</strong>" +
        " par total " +
        "<strong>" +
        total +
        "</strong>" +
        " points bet";

}


/* =====================================================
   TIMER
===================================================== */

/*
   IMPORTANT LOGIC

   60 → 57
   Betting OPEN

   56 → 1
   Betting CLOSED
   Wheel NOT spinning

   0
   Wheel starts spinning
*/

const timerInterval =
    setInterval(
        ()=>{

            /*
               Spin ke time timer ko change nahi karna
            */
            if(spinning){
                return;
            }


            /*
               Countdown
            */
            if(timeLeft > 0){

                timeLeft--;

                timerEl.textContent =
                    timeLeft;

            }


            /*
               56 seconds remaining par
               betting close hogi.

               YAHAN SPIN NAHI HOGA.
            */
            if(
                timeLeft <= 56 &&
                timeLeft > 0 &&
                bettingOpen
            ){

                bettingOpen =
                    false;

                timerEl.classList.add(
                    "closed"
                );

                stopAllBetting();

                resultEl.textContent =
                    "Betting closed";

            }


            /*
               Sirf 0 par wheel spin.
            */
            if(
                timeLeft <= 0 &&
                !spinning
            ){

                timeLeft =
                    0;

                timerEl.textContent =
                    "0";

                spinWheel();

            }

        },
        1000
    );


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning){
        return;
    }


    spinning =
        true;

    bettingOpen =
        false;

    stopAllBetting();


    /*
       Random winner 0–36
    */
    const winner =
        Math.floor(
            Math.random() * 37
        );


    const index =
        wheelNumbers.indexOf(
            winner
        );


    /*
       Winning number ka angle
    */
    const targetAngle =
        -(index * slice);


    /*
       Current rotation normalize
    */
    const currentNormalized =
        (
            wheelRotation % 360
            + 360
        ) % 360;


    /*
       Target normalize
    */
    const targetNormalized =
        (
            targetAngle % 360
            + 360
        ) % 360;


    /*
       Difference
    */
    let difference =
        targetNormalized -
        currentNormalized;


    if(difference < 0){

        difference += 360;

    }


    /*
       8 full rotations
    */
    const extraSpins =
        360 * 8;


    wheelRotation +=
        extraSpins +
        difference;


    wheel.style.transform =
        "rotate(" +
        wheelRotation +
        "deg)";


    resultEl.textContent =
        "Wheel spinning...";


    /*
       CSS transition 5.8 seconds
    */
    setTimeout(
        function(){

            showWinner(
                winner
            );

        },
        5900
    );

}


/* =====================================================
   WINNER
===================================================== */

function showWinner(
    winner
){

    document
        .querySelectorAll(
            ".bet-number"
        )
        .forEach(
            el=>{

                el.classList.remove(
                    "winner"
                );

            }
        );


    const winnerBtn =
        document.querySelector(
            '.bet-number[data-number="' +
            winner +
            '"]'
        );


    if(winnerBtn){

        winnerBtn.classList.add(
            "winner"
        );

    }


    centerLogo.style.display =
        "none";


    centerWin.textContent =
        "WIN " + winner;


    centerWin.style.display =
        "block";


    const winningBet =
        bets[winner] || 0;


    /*
       Roulette payout:
       Bet × 35 win
       + original bet return
    */
    if(winningBet > 0){

        const winAmount =
            winningBet * 35;


        const returnedBet =
            winningBet;


        const totalPayout =
            winAmount +
            returnedBet;


        balance +=
            totalPayout;


        resultEl.textContent =
            "WIN " +
            winner +
            " — +" +
            totalPayout +
            " points";

    }
    else{

        resultEl.textContent =
            "Winning Number: " +
            winner;

    }


    updateBalance();


    addLastWin(
        winner
    );


    /*
       Winner ko 4 seconds dikhana
    */
    setTimeout(
        function(){

            centerWin.style.display =
                "none";

            centerLogo.style.display =
                "block";

            resetGame();

        },
        4000
    );

}


/* =====================================================
   LAST 4 WIN
===================================================== */

function addLastWin(
    number
){

    lastWins.unshift(
        number
    );


    if(lastWins.length > 4){

        lastWins.pop();

    }


    renderLastWins();

}


function renderLastWins(){

    lastWinsEl.innerHTML =
        "";


    const list =
        [...lastWins];


    while(list.length < 4){

        list.push("-");

    }


    /*
       Oldest left
       Newest right
    */
    list.reverse();


    list.forEach(
        function(num){

            const el =
                document.createElement(
                    "span"
                );

            el.className =
                "last-number";

            el.textContent =
                num;

            lastWinsEl.appendChild(
                el
            );

        }
    );

}


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    stopAllBetting();


    bets = {};


    selectedNumber =
        null;


    /*
       Bet counts clear
    */
    document
        .querySelectorAll(
            ".bet-count"
        )
        .forEach(
            function(el){

                el.textContent =
                    "";

            }
        );


    /*
       Winner/active clear
    */
    document
        .querySelectorAll(
            ".bet-number"
        )
        .forEach(
            function(el){

                el.classList.remove(
                    "winner"
                );

                el.classList.remove(
                    "active"
                );

            }
        );


    selectedEl.innerHTML =
        "Koi number select nahi hai";


    /*
       New round
    */
    timeLeft =
        60;


    timerEl.textContent =
        "60";


    timerEl.classList.remove(
        "closed"
    );


    resultEl.textContent =
        "Number select karo";


    bettingOpen =
        true;

    spinning =
        false;

}


/* =====================================================
   TOUCH PROTECTION
===================================================== */

document.addEventListener(
    "touchmove",
    function(e){

        if(
            currentPressing &&
            e.target.closest(
                ".bet-number"
            )
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);


/* =====================================================
   CONTEXT MENU
===================================================== */

document.addEventListener(
    "contextmenu",
    function(e){

        if(
            e.target.closest(
                ".bet-number"
            )
        ){

            e.preventDefault();

        }

    }
);


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden &&
            currentPressing
        ){

            stopBet(
                currentPress
            );

        }

    }
);


/* =====================================================
   INITIAL
===================================================== */

updateBalance();

renderLastWins();

</script>
