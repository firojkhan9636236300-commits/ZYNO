<script>

let balance = 10000;

const BET_TIME = 60;

let timeLeft = BET_TIME;
let bettingOpen = true;
let spinning = false;

let selectedNumber = null;

let bets = {};
let lastResults = [];

let timerInterval = null;
let holdTimer = null;
let holdStart = 0;
let activeButton = null;

const wheel = document.getElementById("wheel");
const grid = document.getElementById("grid");
const timer = document.getElementById("timer");
const balanceEl = document.getElementById("balance");
const lastWinEl = document.getElementById("lastWin");
const result = document.getElementById("result");
const selected = document.getElementById("selected");
const center = document.getElementById("center");
const lastWins = document.getElementById("lastWins");


/* =========================
   EXACT PHOTO ROULETTE ORDER
========================= */

const rouletteNumbers = [
    0,
    19,
    4,
    21,
    2,
    25,
    17,
    34,
    6,
    27,
    13,
    36,
    11,
    30,
    8,
    23,
    10,
    5,
    24,
    16,
    33,
    1,
    20,
    14,
    31,
    9,
    22,
    18,
    29,
    7,
    28,
    12,
    35,
    3,
    26,
    32,
    15
];

const blackNumbers = new Set([
    2,4,6,8,10,11,13,15,17,
    20,22,24,26,28,29,31,33,35
]);

/* =========================
   WHEEL SEGMENT COLORS
========================= */

function getSegmentColor(number){

    if(number === 0){
        return "#159447";
    }

    if(blackNumbers.has(number)){
        return "#080808";
    }

    return "#a91422";
}


/* =========================
   CREATE EXACT WHEEL
========================= */

function createWheel(){

    const oldNumbers =
        wheel.querySelectorAll(".number");

    oldNumbers.forEach(el => el.remove());

    const segment =
        360 / rouletteNumbers.length;

    /* exact alternating wheel background */

    let gradient = "conic-gradient(";

    rouletteNumbers.forEach((number,index)=>{

        const start =
            index * segment;

        const end =
            (index + 1) * segment;

        gradient +=
            `${getSegmentColor(number)} ${start}deg ${end}deg`;

        if(index < rouletteNumbers.length - 1){
            gradient += ",";
        }
    });

    gradient += ")";

    wheel.style.background = gradient;


    /* create numbers */

    rouletteNumbers.forEach((number,index)=>{

        const n =
            document.createElement("div");

        n.className = "number";

        n.textContent = number;

        const angle =
            index * segment;

        n.style.setProperty(
            "--angle",
            angle + "deg"
        );

        /* 0 gets slightly brighter */

        if(number === 0){
            n.style.color = "#ffffff";
            n.style.textShadow =
                "0 1px 3px #000, 0 0 5px rgba(255,255,255,.5)";
        }

        wheel.appendChild(n);
    });
}

createWheel();


/* =========================
   WHEEL RADIUS
========================= */

function updateWheelRadius(){

    const size =
        wheel.getBoundingClientRect().width;

    wheel.style.setProperty(
        "--wheel-radius",
        (size / 2) + "px"
    );
}

updateWheelRadius();

window.addEventListener(
    "resize",
    updateWheelRadius
);


/* =========================
   NUMBER GRID
========================= */

for(let i = 0; i <= 36; i++){

    const btn =
        document.createElement("div");

    btn.className = "numBtn";

    if(i === 0){
        btn.classList.add("zero");
    }

    btn.dataset.number = i;

    btn.innerHTML = `
        <span>${i}</span>
        <span class="betCount"></span>
    `;

    btn.addEventListener(
        "pointerdown",
        (e)=>{

            if(!bettingOpen || spinning)
                return;

            e.preventDefault();

            activeButton = btn;

            selectedNumber = i;

            updateSelected();

            holdStart =
                performance.now();

            clearInterval(holdTimer);

            holdTimer =
                setInterval(()=>{

                    const elapsed =
                        performance.now() - holdStart;

                    const points =
                        Math.floor(elapsed / 250);

                    if(points > 0){

                        addBet(i, points);

                        holdStart =
                            performance.now();
                    }

                },250);

            btn.classList.add("active");
        }
    );


    const stopHold = ()=>{

        clearInterval(holdTimer);

        holdTimer = null;

        if(activeButton){
            activeButton.classList.remove("active");
        }

        activeButton = null;
    };


    btn.addEventListener(
        "pointerup",
        stopHold
    );

    btn.addEventListener(
        "pointercancel",
        stopHold
    );

    btn.addEventListener(
        "pointerleave",
        stopHold
    );

    grid.appendChild(btn);
}


/* =========================
   ADD BET
========================= */

function addBet(number, points){

    if(!bettingOpen || spinning)
        return;

    if(balance <= 0){

        result.textContent =
            "Balance khatam ho gaya";

        return;
    }

    points =
        Math.min(points, balance);

    if(points <= 0)
        return;

    if(!bets[number]){
        bets[number] = 0;
    }

    bets[number] += points;

    balance -= points;

    balanceEl.textContent =
        Math.floor(balance);

    updateBetDisplay(number);

    updateSelected();
}


/* =========================
   BET DISPLAY
========================= */

function updateBetDisplay(number){

    const btn =
        document.querySelector(
            `.numBtn[data-number="${number}"]`
        );

    if(!btn)
        return;

    const count =
        btn.querySelector(".betCount");

    count.textContent =
        bets[number]
        ? "BET " + bets[number]
        : "";
}


/* =========================
   SELECTED NUMBER
========================= */

function updateSelected(){

    if(selectedNumber === null){

        selected.textContent =
            "Koi number select nahi hai";

        return;
    }

    const total =
        bets[selectedNumber] || 0;

    selected.textContent =
        `Number ${selectedNumber} par total ${total} points bet`;
}


/* =========================
   TIMER
========================= */

function startTimer(){

    clearInterval(timerInterval);

    timerInterval =
        setInterval(()=>{

            if(!bettingOpen)
                return;

            timeLeft--;

            if(timeLeft <= 56){

                bettingOpen = false;

                clearInterval(timerInterval);

                timer.textContent = "0";

                result.textContent =
                    "Betting band — wheel spin ho raha hai";

                setTimeout(
                    spinWheel,
                    500
                );

                return;
            }

            timer.textContent =
                timeLeft;

        },1000);
}


/* =========================
   FIND WHEEL INDEX
========================= */

function getWheelIndex(number){

    return rouletteNumbers.indexOf(number);
}


/* =========================
   SPIN WHEEL
========================= */

function spinWheel(){

    if(spinning)
        return;

    spinning = true;
    bettingOpen = false;

    const winningNumber =
        Math.floor(Math.random() * 37);

    const index =
        getWheelIndex(winningNumber);

    const segment =
        360 / rouletteNumbers.length;

    /*
       Number ko top pointer ke neeche lana
    */

    const targetAngle =
        -(index * segment);

    const extraSpins =
        360 * 6;

    wheel.style.transform =
        `rotate(${extraSpins + targetAngle}deg)`;


    setTimeout(()=>{

        showResult(winningNumber);

    },4800);
}


/* =========================
   RESULT
========================= */

function showResult(number){

    center.textContent =
        "WIN " + number;

    lastWinEl.textContent =
        number;

    lastResults.push(number);

    if(lastResults.length > 4){
        lastResults.shift();
    }

    renderLastWins();

    const winningBet =
        bets[number] || 0;

    if(winningBet > 0){

        const winAmount =
            winningBet * 35;

        const returnedBet =
            winningBet;

        const totalPayout =
            winAmount + returnedBet;

        balance += totalPayout;

        result.textContent =
            `WIN! ${number} par ${winningBet} bet — +${totalPayout} points`;

    }else{

        result.textContent =
            `Winning Number: ${number}`;
    }

    balanceEl.textContent =
        Math.floor(balance);

    bets = {};

    document
        .querySelectorAll(".betCount")
        .forEach(el=>{
            el.textContent = "";
        });

    document
        .querySelectorAll(".numBtn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });


    setTimeout(()=>{

        center.textContent =
            "ZYNO";

        wheel.style.transition =
            "none";

        wheel.style.transform =
            "rotate(0deg)";

        requestAnimationFrame(()=>{

            requestAnimationFrame(()=>{

                wheel.style.transition =
                    "transform 4.8s cubic-bezier(.12,.72,.15,1)";

            });

        });

        selectedNumber = null;

        selected.textContent =
            "Koi number select nahi hai";

        timeLeft = BET_TIME;

        timer.textContent =
            timeLeft;

        bettingOpen = true;
        spinning = false;

        result.textContent =
            "Number select karo";

        startTimer();

    },2500);
}


/* =========================
   LAST 4 WIN
========================= */

function renderLastWins(){

    const balls =
        lastWins.querySelectorAll(
            ".winBall"
        );

    const values = [
        ...Array(
            4 - lastResults.length
        ).fill("-"),
        ...lastResults
    ];

    balls.forEach(
        (ball,index)=>{

            ball.textContent =
                values[index];

        }
    );
}


/* =========================
   START
========================= */

balanceEl.textContent =
    balance;

timer.textContent =
    timeLeft;

startTimer();

</script>
