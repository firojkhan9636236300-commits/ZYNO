<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#102b49 0%,#020b18 48%,#010611 100%);
    color:#fff;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:8px 7px 35px;
}

/* HEADER */

.header{
    text-align:center;
    padding:4px 0 12px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#00e5ff;
    letter-spacing:5px;
    text-shadow:0 0 15px rgba(0,229,255,.45);
}

.subtitle{
    color:#9eb4ca;
    font-size:10px;
    margin-top:3px;
}

/* GAME BOX */

.game-box{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #21143a 0%,
            #17102d 45%,
            #0b0b1e 100%
        );

    border:4px solid #00e5ff;
    border-radius:50px 50px 0 0;

    padding:17px 12px 28px;

    box-shadow:
        0 0 20px rgba(0,229,255,.18),
        inset 0 0 60px rgba(102,0,180,.08);
}

/* INFO */

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:10px;
}

.info-box{
    background:rgba(8,12,30,.75);
    border:1px solid #31415f;
    border-radius:9px;
    text-align:center;
    padding:7px 3px;
}

.info-title{
    color:#9daec5;
    font-size:8px;
}

.info-value{
    color:#00e5ff;
    font-size:13px;
    font-weight:bold;
    margin-top:3px;
}

/* TIMER */

.betting-time{
    text-align:center;
    margin:3px 0 0;
}

.betting-title{
    color:#c1bfd7;
    font-size:14px;
    letter-spacing:1px;
}

.timer-big{
    color:#ffd34e;
    font-size:44px;
    line-height:1;
    font-weight:bold;
    text-shadow:0 0 18px rgba(255,211,78,.35);
    margin-top:4px;
}

/* WHEEL */

.wheel-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px 0 16px;
}

.wheel{
    width:min(64vw,290px);
    height:min(64vw,290px);

    border-radius:50%;
    position:relative;

    border:9px solid #ffd34e;

    background:
        repeating-conic-gradient(
            from -4.86deg,
            #090b12 0deg 4.86deg,
            #5a287f 4.86deg 9.72deg
        );

    box-shadow:
        0 0 0 4px #513814,
        0 0 28px rgba(255,211,78,.35),
        inset 0 0 35px #000;
}

/* INNER RING */

.wheel-ring{
    position:absolute;
    inset:15%;

    border-radius:50%;

    border:4px solid #ffd34e;

    box-shadow:
        0 0 15px rgba(255,211,78,.25),
        inset 0 0 20px #000;
}

/* CENTER */

.wheel-center{
    position:absolute;

    width:30%;
    height:30%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#080b16;

    border:6px solid #00e5ff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#00e5ff;
    font-size:16px;
    font-weight:bold;
    letter-spacing:2px;

    box-shadow:
        0 0 20px rgba(0,229,255,.35),
        inset 0 0 15px #000;

    z-index:3;
}

/* WHEEL NUMBERS */

.wheel-number{
    position:absolute;

    width:23px;
    height:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:11px;
    font-weight:bold;

    text-shadow:0 2px 4px #000;

    z-index:4;

    pointer-events:none;
}

/* POINTER */

.pointer{
    position:absolute;

    top:-11px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:21px solid #ffd34e;

    filter:drop-shadow(0 0 7px rgba(255,211,78,.7));

    z-index:8;
}

/* NUMBER SECTION */

.number-section{
    margin-top:1px;
}

.number-title{
    text-align:center;
    color:#00e5ff;
    font-weight:bold;
    font-size:13px;
    margin-bottom:8px;
    letter-spacing:.5px;
}

.number-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
}

.number{
    min-height:38px;

    border-radius:6px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:bold;

    border:1px solid rgba(255,255,255,.15);

    cursor:pointer;
    user-select:none;

    transition:.15s;
}

.number.red{
    background:#542049;
}

.number.black{
    background:#090b12;
}

.number.zero{
    background:#078b67;
}

.number.selected{
    border:2px solid #00e5ff;

    box-shadow:
        0 0 0 2px rgba(0,229,255,.15),
        0 0 15px rgba(0,229,255,.8);

    transform:scale(.94);
}

/* SELECTED BET */

.selected-bet{
    margin-top:9px;

    background:
        linear-gradient(135deg,#24183d,#100d20);

    border:1px solid #5b4677;

    border-radius:10px;

    padding:10px;

    text-align:center;

    color:#bfc6d8;

    font-size:12px;
}

.selected-bet strong{
    color:#00e5ff;
}

/* GAME BUTTONS */

.game-buttons{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:6px;

    margin-top:10px;
}

.game-button{
    min-height:44px;

    border-radius:9px;

    border:1px solid #00bde9;

    background:
        linear-gradient(
            135deg,
            #24143f,
            #101126
        );

    color:#00e5ff;

    font-size:11px;
    font-weight:bold;

    box-shadow:
        0 0 12px rgba(0,229,255,.12);

    cursor:pointer;
}

.game-button:active{
    transform:scale(.97);
}

/* RESULT */

.result{
    text-align:center;

    margin-top:10px;

    min-height:24px;

    color:#ffd34e;

    font-weight:bold;

    font-size:13px;
}

/* MOBILE */

@media(max-width:480px){

    .container{
        padding:5px 5px 30px;
    }

    .logo{
        font-size:25px;
    }

    .game-box{
        padding:15px 8px 25px;
        border-radius:45px 45px 0 0;
    }

    .timer-big{
        font-size:42px;
    }

    .wheel{
        width:64vw;
        height:64vw;
        border-width:8px;
    }

    .wheel-number{
        width:21px;
        height:21px;
        font-size:10px;
    }

    .number-grid{
        gap:3px;
    }

    .number{
        min-height:37px;
        font-size:12px;
    }

    .game-button{
        font-size:10px;
        min-height:43px;
    }
}

@media(max-width:350px){

    .wheel{
        width:61vw;
        height:61vw;
    }

    .number{
        min-height:34px;
        font-size:11px;
    }

    .game-button{
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            ZYNO
        </div>

        <div class="subtitle">
            ROULETTE • PLAY • WIN • REPEAT
        </div>

    </div>


    <div class="game-box">

        <!-- INFO -->

        <div class="info">

            <div class="info-box">

                <div class="info-title">
                    BALANCE
                </div>

                <div class="info-value" id="balance">
                    10000
                </div>

            </div>


            <div class="info-box">

                <div class="info-title">
                    BET TIME
                </div>

                <div class="info-value" id="timer">
                    60
                </div>

            </div>


            <div class="info-box">

                <div class="info-title">
                    LAST WIN
                </div>

                <div class="info-value" id="lastWin">
                    0
                </div>

            </div>

        </div>


        <!-- TIMER -->

        <div class="betting-time">

            <div class="betting-title">
                BETTING TIME
            </div>

            <div class="timer-big" id="bigTimer">
                60
            </div>

        </div>


        <!-- WHEEL -->

        <div class="wheel-area">

            <div class="wheel" id="wheel">

                <div class="pointer"></div>

                <div class="wheel-ring"></div>

                <div class="wheel-center">
                    ZYNO
                </div>

            </div>

        </div>


        <!-- NUMBERS -->

        <div class="number-section">

            <div class="number-title">
                SELECT NUMBER 0 - 36
            </div>

            <div
                class="number-grid"
                id="numberGrid">
            </div>

        </div>


        <!-- SELECTED BET -->

        <div
            class="selected-bet"
            id="selectedBet">

            Number select karo

        </div>


        <!-- OTHER GAMES -->

        <div class="game-buttons">

            <button
                class="game-button"
                onclick="openLudo()">

                🎲 ZYNO LUDO

            </button>


            <button
                class="game-button"
                onclick="openZeroEleven()">

                🔢 ZYNO 0–11

            </button>


            <button
                class="game-button"
                onclick="openTeenPatti()">

                🃏 TEEN PATTI

            </button>

        </div>


        <!-- RESULT -->

        <div
            class="result"
            id="result">

            Number select karo

        </div>

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let balance = 10000;

let selectedNumber = null;

let currentBet = 0;

let timeLeft = 60;

let spinning = false;


/* =========================
   RED NUMBERS
========================= */

const redNumbers = [

    1,3,5,7,9,
    12,14,16,18,
    19,21,23,25,27,
    30,32,34,36

];


/* =========================
   NUMBER GRID
========================= */

const numberGrid =
    document.getElementById("numberGrid");


for(let i = 0; i <= 36; i++){

    const div =
        document.createElement("div");


    div.classList.add("number");


    if(i === 0){

        div.classList.add("zero");

    }
    else if(redNumbers.includes(i)){

        div.classList.add("red");

    }
    else{

        div.classList.add("black");

    }


    div.textContent = i;


    /* NUMBER TAP */

    div.onclick = function(){

        if(spinning) return;


        /* REMOVE OLD SELECTION */

        document
            .querySelectorAll(".number")
            .forEach(n =>
                n.classList.remove("selected")
            );


        /* SELECT NUMBER */

        div.classList.add("selected");

        selectedNumber = i;


        /*
           AUTO BET

           1 POINT AUTOMATICALLY
           NUMBER TAP KARTE HI
        */

        const betAmount = 1;


        if(balance < betAmount){

            document.getElementById("result")
                .textContent =
                "Balance kam hai";

            return;

        }


        currentBet = betAmount;


        document.getElementById("selectedBet")
            .innerHTML =
            "Number <strong>" +
            i +
            "</strong> par <strong>" +
            betAmount +
            "</strong> point bet laga";


        document.getElementById("result")
            .textContent =
            "Bet placed — number " + i;

    };


    numberGrid.appendChild(div);

}


/* =========================
   WHEEL NUMBERS
========================= */

const wheel =
    document.getElementById("wheel");


for(let i = 0; i <= 36; i++){

    const number =
        document.createElement("div");


    number.className =
        "wheel-number";


    number.textContent =
        i;


    /*
       37 NUMBERS
       PERFECT CIRCLE
    */

    const angle =
        (i * 360 / 37) - 90;


    const radius = 39;


    const angleRad =
        angle * Math.PI / 180;


    const x =
        50 + Math.cos(angleRad) * radius;


    const y =
        50 + Math.sin(angleRad) * radius;


    number.style.left =
        x + "%";


    number.style.top =
        y + "%";


    number.style.transform =
        "translate(-50%,-50%)";


    wheel.appendChild(number);

}


/* =========================
   AUTO ROUND
========================= */

function finishRound(){

    if(spinning) return;


    if(selectedNumber === null){

        document.getElementById("result")
            .textContent =
            "Koi number select nahi hua";

        return;

    }


    if(currentBet <= 0){

        document.getElementById("result")
            .textContent =
            "Bet nahi lagi";

        return;

    }


    spinning = true;


    document.getElementById("result")
        .textContent =
        "🎡 Result aa raha hai...";


    /*
       DEMO RESULT
    */

    setTimeout(function(){

        const winningNumber =
            Math.floor(Math.random() * 37);


        if(winningNumber === selectedNumber){

            const winAmount =
                currentBet * 35;


            balance =
                balance + winAmount;


            document.getElementById("lastWin")
                .textContent =
                winAmount;


            document.getElementById("result")
                .textContent =
                "🎉 WIN! Number " +
                winningNumber +
                " — +" +
                winAmount +
                " points";

        }
        else{

            balance =
                balance - currentBet;


            document.getElementById("lastWin")
                .textContent =
                "0";


            document.getElementById("result")
                .textContent =
                "Number " +
                winningNumber +
                " aaya — Bet lost " +
                currentBet +
                " point";

        }


        document.getElementById("balance")
            .textContent =
            balance;


        currentBet = 0;

        selectedNumber = null;

        spinning = false;


        document
            .querySelectorAll(".number")
            .forEach(n =>
                n.classList.remove("selected")
            );


    },1200);

}


/* =========================
   TIMER
========================= */

setInterval(function(){

    if(timeLeft > 0){

        timeLeft--;

    }
    else{

        /*
           ROUND END
        */

        finishRound();


        /*
           NEXT ROUND
        */

        setTimeout(function(){

            timeLeft = 60;

        },1300);

    }


    document.getElementById("timer")
        .textContent =
        timeLeft;


    document.getElementById("bigTimer")
        .textContent =
        timeLeft;


},1000);


/* =========================
   OTHER GAMES
========================= */

function openLudo(){

    document.getElementById("result")
        .textContent =
        "🎲 ZYNO LUDO opening soon";

}


function openZeroEleven(){

    document.getElementById("result")
        .textContent =
        "🔢 ZYNO 0–11 opening soon";

}


function openTeenPatti(){

    document.getElementById("result")
        .textContent =
        "🃏 TEEN PATTI opening soon";

}

</script>

</body>
</html>
