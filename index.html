<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#0a3154 0%,#041522 48%,#01070d 100%);
    color:#fff;
    user-select:none;
    position:fixed;
    inset:0;
}

button{
    font-family:Arial,sans-serif;
    -webkit-user-select:none;
    user-select:none;
}

.app{
    width:100%;
    max-width:520px;
    height:100dvh;
    margin:auto;

    padding:
        4px
        9px
        calc(4px + env(safe-area-inset-bottom));

    overflow:hidden;

    display:flex;
    flex-direction:column;
}

/* =========================
   LOGO
========================= */

.logo{
    text-align:center;

    font-size:30px;
    line-height:34px;

    font-weight:900;
    letter-spacing:5px;

    color:#00e5ff;

    text-shadow:
        0 0 8px #00e5ff,
        0 0 18px #00e5ff,
        0 0 32px rgba(0,229,255,.7);

    flex-shrink:0;

    margin-bottom:3px;
}


/* =========================
   SMALL MODE BUTTONS
========================= */

.modeRow{
    display:flex;
    justify-content:center;

    gap:5px;

    margin-bottom:3px;

    flex-shrink:0;
}

.modeButton{
    width:112px;

    padding:5px 3px;

    border-radius:7px;

    border:1px solid rgba(0,229,255,.35);

    background:
        linear-gradient(
            180deg,
            #08253b,
            #041522
        );

    color:#cdebf3;

    font-size:9px;
    line-height:12px;

    font-weight:900;
}

.modeButton.active{
    color:#00e5ff;

    border-color:#00e5ff;

    box-shadow:
        0 0 8px rgba(0,229,255,.25);
}


/* =========================
   WHEEL AREA
========================= */

.wheelArea{
    display:flex;
    justify-content:center;
    align-items:center;

    flex-shrink:0;

    margin:0 0 2px;
}

.wheel{
    position:relative;

    width:min(58vw,238px);
    height:min(58vw,238px);

    border-radius:50%;

    /* ZYNO BLUE WHEEL */

    border:6px solid #00d9ff;

    background:
        radial-gradient(
            circle,
            #111 0%,
            #050505 62%,
            #000 100%
        );

    box-shadow:

        0 0 10px rgba(0,229,255,.95),

        0 0 25px rgba(0,229,255,.45),

        inset 0 0 25px rgba(0,229,255,.18);

    overflow:hidden;
}


/* =========================
   INNER RING
========================= */

.wheelRing{
    position:absolute;

    inset:10px;

    border:2px solid #00d9ff;

    border-radius:50%;

    pointer-events:none;

    z-index:5;

    box-shadow:
        0 0 5px rgba(0,229,255,.45);
}


/* =========================
   NUMBER ROTOR
========================= */

.numberRotor{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border-radius:50%;

    transform:rotate(0deg);

    z-index:10;
}


/* =========================
   WHEEL NUMBERS
========================= */

.wheelNumber{

    position:absolute;

    left:50%;
    top:50%;

    width:30px;
    height:30px;

    margin-left:-15px;
    margin-top:-15px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:14px;

    font-weight:900;

    border-radius:50%;

    pointer-events:none;

    text-shadow:
        0 1px 3px #000;
}

.wheelNumber.red{
    color:#ff3b45;
}

.wheelNumber.black{
    color:#ffffff;
}

.wheelNumber.green{
    color:#00ff75;
}


/* =========================
   POINTER
========================= */

.pointer{
    position:absolute;

    left:50%;
    top:-4px;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:9px solid transparent;
    border-right:9px solid transparent;

    border-top:18px solid #00e5ff;

    filter:
        drop-shadow(0 0 5px #00e5ff);

    z-index:50;
}


/* =========================
   CENTER
========================= */

.wheelCenter{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:68px;
    height:68px;

    border-radius:50%;

    background:#030303;

    border:3px solid #00d9ff;

    box-shadow:

        0 0 13px rgba(0,229,255,.8),

        inset 0 0 13px rgba(0,229,255,.25);

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    z-index:40;
}

.centerText{
    color:#00e5ff;

    font-size:16px;

    font-weight:900;

    line-height:18px;

    text-shadow:
        0 0 7px rgba(0,229,255,.8);
}


/* =========================
   TIMER
========================= */

.timerBox{
    text-align:center;

    flex-shrink:0;

    margin:0 0 1px;
}

.timerTitle{
    color:#91aaba;

    font-size:8px;

    font-weight:800;

    letter-spacing:.5px;

    line-height:10px;
}

.timer{
    color:#ffd34e;

    font-size:19px;

    font-weight:900;

    line-height:20px;

    text-shadow:
        0 0 7px rgba(255,211,78,.7);
}

.timer.closed{
    color:#ff4040;

    text-shadow:
        0 0 7px rgba(255,50,50,.7);
}


/* =========================
   RESULT + LAST 4
========================= */

.resultLastRow{

    display:flex;

    align-items:center;

    justify-content:space-between;

    width:100%;

    min-height:32px;

    margin-bottom:3px;

    flex-shrink:0;
}

.result{
    flex:1;

    min-width:0;

    color:#b9d6e5;

    font-size:11px;

    font-weight:700;

    text-align:left;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    padding-left:3px;
}


/* =========================
   LAST 4 SIDE
========================= */

.lastArea{

    display:flex;

    align-items:center;

    gap:4px;

    flex-shrink:0;
}

.lastTitle{

    color:#819caf;

    font-size:8px;

    font-weight:800;

    white-space:nowrap;

    writing-mode:vertical-rl;

    transform:rotate(180deg);

    letter-spacing:.3px;
}

.lastWins{

    display:flex;

    justify-content:flex-end;

    gap:3px;
}

.lastNumber{

    width:28px;
    height:27px;

    border-radius:6px;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#061b2c;

    border:1px solid rgba(0,229,255,.4);

    color:#fff;

    font-size:12px;

    font-weight:900;

    box-shadow:
        inset 0 0 5px rgba(0,229,255,.05);
}


/* =========================
   NUMBER GRID
========================= */

.numberGrid{

    display:grid;

    grid-template-columns:
        repeat(6,minmax(0,1fr));

    grid-template-rows:
        repeat(7,minmax(0,1fr));

    gap:4px;

    width:100%;

    /*
      7 rows for 0-36.
      Fixed compact height so every
      number remains visible on mobile.
    */

    height:270px;

    flex-shrink:0;

    overflow:hidden;
}


/* =========================
   BET BUTTON
========================= */

.betNumber{

    width:100%;
    height:100%;

    min-height:0;

    border-radius:8px;

    border:1px solid rgba(0,229,255,.38);

    background:
        linear-gradient(
            180deg,
            #092640,
            #031421
        );

    color:#fff;

    font-size:18px;

    font-weight:900;

    position:relative;

    touch-action:none;

    -webkit-touch-callout:none;

    transition:
        transform .06s,
        box-shadow .12s;
}

.betNumber:active{
    transform:scale(.95);
}

.betNumber.selected{

    border-color:#00e5ff;

    box-shadow:

        0 0 11px rgba(0,229,255,.55),

        inset 0 0 9px rgba(0,229,255,.12);
}

.betNumber.disabled{
    opacity:.45;
}

.betNumber.redNumber{
    color:#ff3a3a;
}

.betNumber.blackNumber{
    color:#ffffff;
}

.betNumber.greenNumber{
    color:#00ff75;
}

.betCount{

    display:block;

    color:#00e5ff;

    font-size:8px;

    line-height:9px;

    font-weight:900;
}


/* =========================
   BOTTOM BUTTONS
========================= */

.gameButtons{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:5px;

    margin-top:4px;

    flex-shrink:0;
}

.gameButton{

    border:1px solid rgba(0,229,255,.35);

    background:#061a2b;

    color:#d8f8ff;

    border-radius:8px;

    padding:6px 2px;

    font-size:9px;

    line-height:12px;

    font-weight:900;

    min-height:31px;
}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:360px){

    .app{
        padding-left:6px;
        padding-right:6px;
    }

    .logo{
        font-size:27px;
        line-height:31px;
    }

    .modeButton{
        width:105px;
        font-size:8px;
    }

    .wheel{
        width:220px;
        height:220px;
    }

    .wheelNumber{
        font-size:13px;

        width:28px;
        height:28px;

        margin-left:-14px;
        margin-top:-14px;
    }

    .wheelCenter{
        width:62px;
        height:62px;
    }

    .centerText{
        font-size:15px;
    }

    .numberGrid{
        height:252px;
        gap:3px;
    }

    .betNumber{
        font-size:16px;
        border-radius:7px;
    }

    .betCount{
        font-size:7px;
        line-height:8px;
    }

    .lastNumber{
        width:25px;
        height:25px;
        font-size:11px;
    }

    .gameButton{
        font-size:8px;
        padding:5px 1px;
    }
}


/* =========================
   VERY SHORT SCREEN
========================= */

@media(max-height:700px){

    .logo{
        font-size:26px;
        line-height:28px;
    }

    .modeButton{
        padding:4px 2px;
    }

    .wheel{
        width:205px;
        height:205px;
    }

    .numberGrid{
        height:224px;
    }

    .wheelCenter{
        width:58px;
        height:58px;
    }

    .wheelNumber{
        font-size:12px;
    }

    .betNumber{
        font-size:15px;
    }
}

</style>
</head>

<body>

<div class="app">


    <!-- LOGO -->

    <div class="logo">
        ZYNO
    </div>


    <!-- SMALL MODE BUTTONS -->

    <div class="modeRow">

        <button
            class="modeButton active"
            id="mode36">
            🔴 ZYNO 0–36
        </button>

        <button
            class="modeButton"
            id="mode11">
            🔢 ZYNO 0–11
        </button>

    </div>


    <!-- WHEEL -->

    <div class="wheelArea">

        <div
            class="wheel"
            id="wheel">

            <div class="pointer"></div>

            <div
                class="numberRotor"
                id="numberRotor">
            </div>

            <div class="wheelRing"></div>

            <div class="wheelCenter">

                <div
                    class="centerText"
                    id="centerText">
                    ZYNO
                </div>

            </div>

        </div>

    </div>


    <!-- TIMER -->

    <div class="timerBox">

        <div class="timerTitle">
            BETTING TIME
        </div>

        <div
            class="timer"
            id="timer">
            60
        </div>

    </div>


    <!-- RESULT + LAST 4 -->

    <div class="resultLastRow">

        <div
            class="result"
            id="result">
            Number select karo
        </div>

        <div class="lastArea">

            <div class="lastTitle">
                LAST 4 WIN
            </div>

            <div
                class="lastWins"
                id="lastWins">
            </div>

        </div>

    </div>


    <!-- NUMBER GRID -->

    <div
        class="numberGrid"
        id="numberGrid">
    </div>


    <!-- BOTTOM BUTTONS -->

    <div class="gameButtons">

        <button class="gameButton">
            🎲 ZYNO LUDO
        </button>

        <button class="gameButton">
            🔢 ZYNO 0–11
        </button>

        <button class="gameButton">
            🃏 TEEN PATTI
        </button>

    </div>

</div>


<script>

/* =====================================================
   ZYNO SETTINGS
===================================================== */

const START_BALANCE = 10000;

const ROUND_TIME = 60;

const BET_CLOSE_TIME = 4;

const BET_SPEED = 250;


/* =====================================================
   STATE
===================================================== */

let balance =
    Number(
        localStorage.getItem("zyno_balance")
    );

if(!Number.isFinite(balance)){
    balance = START_BALANCE;
}

let mode =
    localStorage.getItem("zyno_mode") || "36";

let bets = {};

let selectedNumber = null;

let bettingOpen = true;

let spinning = false;

let roundStart = 0;

let timerInterval = null;

let spinTimeout = null;

let wheelRotation = 0;

let lastWins =
    JSON.parse(
        localStorage.getItem(
            "zyno_last_wins"
        ) || "[]"
    );


/* =====================================================
   ELEMENTS
===================================================== */

const timerEl =
    document.getElementById("timer");

const lastWinsEl =
    document.getElementById("lastWins");

const numberGrid =
    document.getElementById("numberGrid");

const resultEl =
    document.getElementById("result");

const wheel =
    document.getElementById("wheel");

const numberRotor =
    document.getElementById("numberRotor");

const centerText =
    document.getElementById("centerText");

const mode36 =
    document.getElementById("mode36");

const mode11 =
    document.getElementById("mode11");


/* =====================================================
   ROULETTE COLORS
===================================================== */

const redNumbers = new Set([

    1,3,5,7,9,
    12,14,16,18,
    19,21,23,25,27,
    30,32,34,36

]);

function getNumberClass(number){

    if(number === 0){
        return "green";
    }

    if(redNumbers.has(number)){
        return "red";
    }

    return "black";
}


/* =====================================================
   STORAGE
===================================================== */

function saveBalance(){

    localStorage.setItem(
        "zyno_balance",
        String(Math.floor(balance))
    );
}

function saveLastWins(){

    localStorage.setItem(
        "zyno_last_wins",
        JSON.stringify(lastWins)
    );
}


/* =====================================================
   MODE
===================================================== */

function maxNumber(){

    return mode === "36"
        ? 36
        : 11;
}


function setMode(newMode){

    if(spinning) return;

    mode = newMode;

    localStorage.setItem(
        "zyno_mode",
        mode
    );

    mode36.classList.toggle(
        "active",
        mode === "36"
    );

    mode11.classList.toggle(
        "active",
        mode === "11"
    );

    bets = {};

    selectedNumber = null;

    centerText.textContent =
        "ZYNO";

    resultEl.textContent =
        "Number select karo";

    wheelRotation = 0;

    numberRotor.style.transition =
        "none";

    numberRotor.style.transform =
        "rotate(0deg)";

    createWheel();

    createNumberGrid();

    updateBetButtons();
}


/* =====================================================
   CREATE WHEEL
===================================================== */

function createWheel(){

    numberRotor.innerHTML = "";

    const max =
        maxNumber();

    const total =
        max + 1;

    const radius =
        wheel.clientWidth * 0.385;


    for(
        let i = 0;
        i < total;
        i++
    ){

        const el =
            document.createElement("div");

        const color =
            getNumberClass(i);

        el.className =
            `wheelNumber ${color}`;

        el.textContent =
            i;

        const angle =
            (360 / total) * i - 90;

        const rad =
            angle * Math.PI / 180;

        const x =
            Math.cos(rad) * radius;

        const y =
            Math.sin(rad) * radius;

        el.style.transform =
            `translate(${x}px,${y}px)`;

        numberRotor.appendChild(el);
    }
}


/* =====================================================
   NUMBER GRID
===================================================== */

function createNumberGrid(){

    numberGrid.innerHTML = "";

    for(
        let number = 0;
        number <= maxNumber();
        number++
    ){

        createBetButton(number);
    }
}


/* =====================================================
   BET BUTTON
   FIXED FOR IPHONE / TOUCH
===================================================== */

function createBetButton(number){

    const button =
        document.createElement("button");

    const color =
        getNumberClass(number);

    button.className =
        "betNumber";

    if(color === "red"){
        button.classList.add(
            "redNumber"
        );
    }

    if(color === "black"){
        button.classList.add(
            "blackNumber"
        );
    }

    if(color === "green"){
        button.classList.add(
            "greenNumber"
        );
    }

    button.innerHTML = `
        ${number}
        <span
            class="betCount"
            id="bet-${number}">
            BET 0
        </span>
    `;


    let holdTimer = null;

    let holding = false;


    /* =========================
       ADD ONE POINT
    ========================= */

    function addBet(){

        if(
            spinning ||
            !bettingOpen ||
            balance <= 0 ||
            !holding
        ){
            stopHold();
            return;
        }


        balance -= 1;


        if(!bets[number]){
            bets[number] = 0;
        }


        bets[number]++;


        saveBalance();

        updateBetCount(
            number
        );


        resultEl.textContent =
            `Number ${number} par ${bets[number]} points bet`;


        button.classList.add(
            "selected"
        );
    }


    /* =========================
       STOP
    ========================= */

    function stopHold(){

        holding = false;

        if(holdTimer !== null){

            clearInterval(
                holdTimer
            );

            holdTimer = null;
        }

        button.classList.remove(
            "selected"
        );

        try{
            button.releasePointerCapture(
                activePointerId
            );
        }catch(e){}
    }


    let activePointerId = null;


    /* =========================
       START HOLD
    ========================= */

    function startHold(event){

        event.preventDefault();

        if(spinning){
            return;
        }


        if(!bettingOpen){

            resultEl.textContent =
                "Betting band hai";

            return;
        }


        if(balance <= 0){

            resultEl.textContent =
                "Balance khatam hai";

            return;
        }


        activePointerId =
            event.pointerId;


        holding = true;

        selectedNumber =
            number;


        button.classList.add(
            "selected"
        );


        try{
            button.setPointerCapture(
                event.pointerId
            );
        }catch(e){}


        /*
          IMPORTANT:

          First point immediately.

          After that:
          every 0.25 second = 1 point.
        */

        addBet();


        holdTimer =
            setInterval(
                addBet,
                BET_SPEED
            );
    }


    /* =========================
       POINTER EVENTS
    ========================= */

    button.addEventListener(
        "pointerdown",
        startHold,
        {passive:false}
    );


    button.addEventListener(
        "pointerup",
        function(event){

            event.preventDefault();

            stopHold();
        },
        {passive:false}
    );


    button.addEventListener(
        "pointercancel",
        stopHold
    );


    button.addEventListener(
        "lostpointercapture",
        stopHold
    );


    button.addEventListener(
        "contextmenu",
        e => e.preventDefault()
    );


    numberGrid.appendChild(
        button
    );
}


/* =====================================================
   BET COUNT
===================================================== */

function updateBetCount(number){

    const el =
        document.getElementById(
            `bet-${number}`
        );

    if(!el) return;

    el.textContent =
        `BET ${bets[number] || 0}`;
}


/* =====================================================
   BUTTON STATE
===================================================== */

function updateBetButtons(){

    document
        .querySelectorAll(".betNumber")
        .forEach(button=>{

            if(
                bettingOpen &&
                !spinning
            ){

                button.classList.remove(
                    "disabled"
                );

            }else{

                button.classList.add(
                    "disabled"
                );
            }

        });
}


/* =====================================================
   TIMER
===================================================== */

function startRound(){

    clearInterval(
        timerInterval
    );


    const savedStart =
        Number(
            localStorage.getItem(
                "zyno_round_start"
            )
        );


    const now =
        Date.now();


    if(
        Number.isFinite(savedStart) &&
        savedStart > 0 &&
        now - savedStart <
        (ROUND_TIME * 1000)
    ){

        roundStart =
            savedStart;

    }else{

        roundStart =
            now;

        localStorage.setItem(
            "zyno_round_start",
            String(roundStart)
        );
    }


    bettingOpen = true;

    spinning = false;

    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            100
        );
}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(){

    const elapsed =
        Math.floor(
            (
                Date.now() -
                roundStart
            ) / 1000
        );


    let remaining =
        ROUND_TIME -
        elapsed;


    if(remaining < 0){
        remaining = 0;
    }


    timerEl.textContent =
        String(remaining);


    if(
        remaining <= BET_CLOSE_TIME &&
        bettingOpen
    ){

        bettingOpen = false;


        timerEl.classList.add(
            "closed"
        );


        updateBetButtons();


        resultEl.textContent =
            "Betting band — wheel spin hoga";
    }


    if(
        remaining === 0 &&
        !spinning
    ){

        clearInterval(
            timerInterval
        );

        spinWheel();
    }
}


/* =====================================================
   WINNER
===================================================== */

function randomWinner(){

    return Math.floor(
        Math.random() *
        (maxNumber() + 1)
    );
}


/* =====================================================
   ROTATION
===================================================== */

function getWinningRotation(winner){

    const total =
        maxNumber() + 1;

    const numberAngle =
        (360 / total) *
        winner;

    const fullRotations =
        5 +
        Math.floor(
            Math.random() * 3
        );

    return (
        -(fullRotations * 360) -
        numberAngle
    );
}


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning) return;


    spinning = true;

    bettingOpen = false;


    updateBetButtons();


    resultEl.textContent =
        "Wheel spin ho raha hai...";


    const winner =
        randomWinner();


    const rotation =
        getWinningRotation(
            winner
        );


    numberRotor.style.transition =
        "transform 5.5s cubic-bezier(.12,.72,.12,1)";


    numberRotor.style.transform =
        `rotate(${rotation}deg)`;


    spinTimeout =
        setTimeout(()=>{

            finishRound(
                winner,
                rotation
            );

        },5700);
}


/* =====================================================
   FINISH ROUND
===================================================== */

function finishRound(
    winner,
    rotation
){

    wheelRotation =
        rotation;


    const winningBet =
        bets[winner] || 0;


    centerText.innerHTML =
        `WIN<br>${winner}`;


    addLastWin(
        winner
    );


    if(mode === "11"){

        if(winningBet > 0){

            const payout =
                winningBet * 10;


            balance += payout;


            resultEl.textContent =
                `WIN ${winner} — ${payout} points mile`;

        }else{

            resultEl.textContent =
                `Winning Number: ${winner}`;
        }
    }

    else{

        if(winningBet > 0){

            const winAmount =
                winningBet * 35;

            const returnedBet =
                winningBet;

            const totalPayout =
                winAmount +
                returnedBet;


            balance +=
                totalPayout;


            resultEl.textContent =
                `WIN ${winner} — ${totalPayout} points mile`;

        }else{

            resultEl.textContent =
                `Winning Number: ${winner}`;
        }
    }


    saveBalance();


    setTimeout(
        resetRound,
        3000
    );
}


/* =====================================================
   LAST 4
===================================================== */

function addLastWin(number){

    lastWins.push(
        number
    );


    if(
        lastWins.length > 4
    ){

        lastWins.shift();
    }


    saveLastWins();

    renderLastWins();
}


function renderLastWins(){

    lastWinsEl.innerHTML =
        "";


    const values = [
        null,
        null,
        null,
        null
    ];


    const start =
        4 -
        lastWins.length;


    lastWins.forEach(
        (number,index)=>{

            values[
                start + index
            ] = number;
        }
    );


    values.forEach(
        number=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "lastNumber";


            div.textContent =
                number === null
                ? "—"
                : number;


            lastWinsEl.appendChild(
                div
            );
        }
    );
}


/* =====================================================
   RESET ROUND
===================================================== */

function resetRound(){

    clearTimeout(
        spinTimeout
    );


    bets = {};

    selectedNumber = null;

    spinning = false;

    bettingOpen = true;


    centerText.textContent =
        "ZYNO";


    resultEl.textContent =
        "Number select karo";


    timerEl.classList.remove(
        "closed"
    );


    timerEl.textContent =
        "60";


    roundStart =
        Date.now();


    localStorage.setItem(
        "zyno_round_start",
        String(roundStart)
    );


    numberRotor.style.transition =
        "none";


    numberRotor.style.transform =
        "rotate(0deg)";


    wheelRotation =
        0;


    createNumberGrid();

    updateBetButtons();

    startRound();
}


/* =====================================================
   MODE BUTTONS
===================================================== */

mode36.addEventListener(
    "click",
    ()=>{
        setMode("36");
    }
);


mode11.addEventListener(
    "click",
    ()=>{
        setMode("11");
    }
);


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    ()=>{

        renderLastWins();

        setMode(mode);

        startRound();
    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        createWheel();
    }
);

</script>
