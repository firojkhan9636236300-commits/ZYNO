<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;

    background:
        radial-gradient(
            circle at top,
            #102b49 0%,
            #020b18 48%,
            #010611 100%
        );

    color:#fff;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;

    padding:
        2px
        4px
        calc(60px + env(safe-area-inset-bottom));
}


/* =========================
   GAME BOX
========================= */

.game-box{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #21143a 0%,
            #17102d 45%,
            #0b0b1e 100%
        );

    border:3px solid #00e5ff;

    border-radius:38px 38px 0 0;

    padding:5px 6px 20px;

    box-shadow:
        0 0 20px rgba(0,229,255,.18),
        inset 0 0 60px rgba(102,0,180,.08);
}


/* =========================
   WHEEL AREA
========================= */

.wheel-area{
    display:flex;

    justify-content:center;
    align-items:center;

    padding:0 0 5px;
}


/* =========================
   WHEEL
========================= */

.wheel{
    width:min(57vw,245px);
    height:min(57vw,245px);

    border-radius:50%;

    position:relative;

    border:7px solid #ffd34e;

    background:
        repeating-conic-gradient(
            from -4.86deg,
            #090b12 0deg 4.86deg,
            #5a287f 4.86deg 9.72deg
        );

    box-shadow:
        0 0 0 3px #513814,
        0 0 24px rgba(255,211,78,.35),
        inset 0 0 30px #000;

    transform:rotate(0deg);

    will-change:transform;
}


/* =========================
   INNER RING
========================= */

.wheel-ring{
    position:absolute;

    inset:15%;

    border-radius:50%;

    border:3px solid #ffd34e;

    box-shadow:
        0 0 12px rgba(255,211,78,.25),
        inset 0 0 18px #000;
}


/* =========================
   CENTER / WINNING NUMBER
========================= */

.wheel-center{
    position:absolute;

    width:29%;
    height:29%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#080b16;

    border:5px solid #00e5ff;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#00e5ff;

    font-size:13px;

    font-weight:bold;

    letter-spacing:1px;

    text-align:center;

    box-shadow:
        0 0 17px rgba(0,229,255,.35),
        inset 0 0 13px #000;

    z-index:10;
}


/* WIN NUMBER */

.wheel-center.win{
    color:#ffd34e;

    border-color:#ffd34e;

    font-size:18px;

    line-height:1.1;

    text-shadow:
        0 0 12px rgba(255,211,78,.7);
}


/* =========================
   WHEEL NUMBERS
========================= */

.wheel-number{
    position:absolute;

    width:17px;
    height:17px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:8px;

    font-weight:bold;

    text-shadow:
        0 2px 3px #000;

    z-index:4;

    pointer-events:none;
}


/* =========================
   POINTER
========================= */

.pointer{
    position:absolute;

    top:-9px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:18px solid #ffd34e;

    filter:
        drop-shadow(
            0 0 6px rgba(255,211,78,.7)
        );

    z-index:20;
}


/* =========================
   NUMBER SECTION
========================= */

.number-section{
    margin-top:0;
}

.number-title{
    text-align:center;

    color:#00e5ff;

    font-weight:bold;

    font-size:12px;

    margin-bottom:6px;

    letter-spacing:.5px;
}

.number-grid{
    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:3px;
}


/* =========================
   NUMBER
========================= */

.number{
    min-height:38px;

    border-radius:5px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    font-size:11px;

    font-weight:bold;

    border:1px solid rgba(255,255,255,.15);

    cursor:pointer;

    user-select:none;

    transition:.1s;

    touch-action:none;

    overflow:hidden;
}

.number.red{
    background:#542049;
}

.number.black{
    background:#090b12;
}

.number.zero{
    background:#078b67;
}


/* =========================
   PRESSED NUMBER
========================= */

.number.pressed{
    border:2px solid #ffd34e;

    box-shadow:
        0 0 0 2px rgba(255,211,78,.15),
        0 0 15px rgba(255,211,78,.8);

    transform:scale(.94);
}


/* =========================
   BET COUNT
========================= */

.bet-count{
    position:absolute;

    top:2px;
    right:3px;

    color:#ffd34e;

    font-size:7px;

    font-weight:bold;

    line-height:1;

    background:rgba(0,0,0,.65);

    border-radius:3px;

    padding:2px 3px;

    pointer-events:none;
}


/* =========================
   BETTING TIME
   NOW BELOW NUMBERS
========================= */

.betting-time{
    text-align:center;

    padding:8px 0 5px;

    margin-top:5px;

    border-top:1px solid rgba(0,229,255,.15);
}

.betting-title{
    color:#c1bfd7;

    font-size:12px;

    letter-spacing:1px;

    font-weight:bold;
}

.timer-big{
    color:#ffd34e;

    font-size:34px;

    line-height:1;

    font-weight:bold;

    text-shadow:
        0 0 18px rgba(255,211,78,.35);

    margin-top:3px;
}


/* =========================
   SELECTED BET
========================= */

.selected-bet{
    margin-top:7px;

    background:
        linear-gradient(
            135deg,
            #24183d,
            #100d20
        );

    border:1px solid #5b4677;

    border-radius:8px;

    padding:8px;

    text-align:center;

    color:#bfc6d8;

    font-size:11px;
}

.selected-bet strong{
    color:#00e5ff;
}


/* =========================
   GAME BUTTONS
========================= */

.game-buttons{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:4px;

    margin-top:7px;
}

.game-button{
    min-height:40px;

    border-radius:8px;

    border:1px solid #00bde9;

    background:
        linear-gradient(
            135deg,
            #24143f,
            #101126
        );

    color:#00e5ff;

    font-size:9px;

    font-weight:bold;

    box-shadow:
        0 0 10px rgba(0,229,255,.12);

    cursor:pointer;

    touch-action:manipulation;
}

.game-button:active{
    transform:scale(.97);
}


/* =========================
   RESULT
========================= */

.result{
    text-align:center;

    margin-top:7px;

    min-height:21px;

    color:#ffd34e;

    font-weight:bold;

    font-size:11px;
}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:350px){

    .wheel{
        width:55vw;
        height:55vw;
    }

    .wheel-number{
        width:16px;
        height:16px;

        font-size:7px;
    }

    .number{
        min-height:36px;

        font-size:10px;
    }

    .game-button{
        font-size:8px;

        min-height:38px;
    }

    .timer-big{
        font-size:31px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="game-box">


<!-- =========================
     WHEEL
========================= -->

<div class="wheel-area">

<div
    class="wheel"
    id="wheel">

    <div class="pointer"></div>

    <div class="wheel-ring"></div>

    <div
        class="wheel-center"
        id="wheelCenter">

        ZYNO

    </div>

</div>

</div>


<!-- =========================
     NUMBERS
========================= -->

<div class="number-section">

<div class="number-title">

    SELECT NUMBER 0 - 36

</div>

<div
    class="number-grid"
    id="numberGrid">
</div>

</div>


<!-- =========================
     BETTING TIME
     BELOW NUMBERS
========================= -->

<div class="betting-time">

    <div class="betting-title">

        BETTING TIME

    </div>

    <div
        class="timer-big"
        id="bigTimer">

        60

    </div>

</div>


<!-- =========================
     SELECTED BET
========================= -->

<div
    class="selected-bet"
    id="selectedBet">

    Number select karo

</div>


<!-- =========================
     OTHER GAMES
========================= -->

<div class="game-buttons">

<button
    class="game-button"
    onclick="openLudo()">

    🎲 ZYNO LUDO

</button>


<button
    class="game-button"
    onclick="openZeroEleven()">

    🔢 ZYNO 0–11

</button>


<button
    class="game-button"
    onclick="openTeenPatti()">

    🃏 TEEN PATTI

</button>

</div>


<!-- =========================
     RESULT
========================= -->

<div
    class="result"
    id="result">

    Number select karo

</div>


</div>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let balance = 10000;

let selectedNumber = null;

let totalBet = 0;

let timeLeft = 60;

let spinning = false;

let roundRunning = true;

let pressTimer = null;

let currentBetDiv = null;

let wheelRotation = 0;


/* =========================
   RED NUMBERS
========================= */

const redNumbers = [

    1,3,5,7,9,
    12,14,16,18,
    19,21,23,25,27,
    30,32,34,36

];


/* =========================
   ELEMENTS
========================= */

const numberGrid =
    document.getElementById(
        "numberGrid"
    );

const wheel =
    document.getElementById(
        "wheel"
    );

const wheelCenter =
    document.getElementById(
        "wheelCenter"
    );

const bigTimer =
    document.getElementById(
        "bigTimer"
    );

const result =
    document.getElementById(
        "result"
    );

const selectedBet =
    document.getElementById(
        "selectedBet"
    );


/* =========================
   NUMBER GRID
========================= */

for(let i = 0; i <= 36; i++){

    const div =
        document.createElement("div");

    div.classList.add("number");


    if(i === 0){

        div.classList.add("zero");

    }
    else if(
        redNumbers.includes(i)
    ){

        div.classList.add("red");

    }
    else{

        div.classList.add("black");

    }


    const numberText =
        document.createElement("span");

    numberText.textContent = i;

    div.appendChild(
        numberText
    );


    const betCount =
        document.createElement("span");

    betCount.className =
        "bet-count";

    betCount.textContent = "";

    div.appendChild(
        betCount
    );


    /* =========================
       PRESS DOWN
    ========================= */

    div.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(spinning) return;

            if(!roundRunning) return;

            startHolding(
                i,
                div,
                betCount
            );

        }
    );


    /* =========================
       PRESS UP
    ========================= */

    div.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            stopHolding();

        }
    );


    /* =========================
       CANCEL
    ========================= */

    div.addEventListener(
        "pointercancel",
        function(){

            stopHolding();

        }
    );


    /* =========================
       LEAVE
    ========================= */

    div.addEventListener(
        "pointerleave",
        function(){

            if(
                pressTimer !== null
            ){

                stopHolding();

            }

        }
    );


    numberGrid.appendChild(
        div
    );

}


/* =========================
   START HOLDING
========================= */

function startHolding(
    number,
    div,
    betCount
){

    stopHolding();


    selectedNumber = number;

    currentBetDiv = div;

    totalBet = 0;


    /*
       OLD PRESSED REMOVE
    */

    document
        .querySelectorAll(".number")
        .forEach(function(n){

            n.classList.remove(
                "pressed"
            );

        });


    div.classList.add(
        "pressed"
    );


    /*
       FIRST POINT
       IMMEDIATELY
    */

    placeOnePointBet(
        betCount
    );


    /*
       EVERY 0.25 SECOND
       +1 POINT
    */

    pressTimer =
        setInterval(function(){

            if(!roundRunning){

                stopHolding();

                return;

            }


            if(spinning){

                stopHolding();

                return;

            }


            if(timeLeft <= 0){

                stopHolding();

                return;

            }


            placeOnePointBet(
                betCount
            );

        },250);

}


/* =========================
   STOP HOLDING
========================= */

function stopHolding(){

    if(pressTimer !== null){

        clearInterval(
            pressTimer
        );

        pressTimer = null;

    }


    if(currentBetDiv){

        currentBetDiv.classList.remove(
            "pressed"
        );

    }

    currentBetDiv = null;

}


/* =========================
   ONE POINT BET
========================= */

function placeOnePointBet(
    betCount
){

    if(
        selectedNumber === null
    ){

        return;

    }


    if(balance < 1){

        result.textContent =
            "💰 Balance khatam ho gaya";

        stopHolding();

        return;

    }


    /*
       1 POINT MINUS
    */

    balance =
        balance - 1;


    /*
       TOTAL BET
    */

    totalBet =
        totalBet + 1;


    /*
       BET COUNT
    */

    if(betCount){

        betCount.textContent =
            "BET " + totalBet;

    }


    /*
       SELECTED BET
    */

    selectedBet.innerHTML =
        "Number <strong>" +
        selectedNumber +
        "</strong> par total <strong>" +
        totalBet +
        "</strong> points bet";


    /*
       RESULT
    */

    result.textContent =
        "⚡ Number " +
        selectedNumber +
        " par " +
        totalBet +
        " points";

}


/* =========================
   WHEEL NUMBERS
========================= */

for(let i = 0; i <= 36; i++){

    const number =
        document.createElement("div");

    number.className =
        "wheel-number";

    number.textContent =
        i;


    /*
       37 NUMBERS CIRCLE
    */

    const angle =
        (i * 360 / 37) - 90;


    const radius = 39;


    const angleRad =
        angle *
        Math.PI /
        180;


    const x =
        50 +
        Math.cos(angleRad) *
        radius;


    const y =
        50 +
        Math.sin(angleRad) *
        radius;


    number.style.left =
        x + "%";

    number.style.top =
        y + "%";


    number.style.transform =
        "translate(-50%,-50%)";


    wheel.appendChild(
        number
    );

}


/* =========================
   LOCK BETTING
========================= */

function lockBetting(){

    roundRunning = false;

    stopHolding();

}


/* =========================
   SPIN WHEEL
========================= */

function spinWheel(){

    if(spinning) return;

    spinning = true;

    roundRunning = false;

    stopHolding();


    /*
       WINNING NUMBER
    */

    const winningNumber =
        Math.floor(
            Math.random() * 37
        );


    /*
       37 SEGMENTS
    */

    const segment =
        360 / 37;


    /*
       WINNING NUMBER ANGLE
    */

    const targetAngle =
        winningNumber * segment;


    /*
       EXTRA SPINS
    */

    const extraSpins =
        6 * 360;


    /*
       FINAL ROTATION
    */

    const finalRotation =
        wheelRotation +
        extraSpins +
        (360 - targetAngle);


    wheel.style.transition =
        "transform 4.5s cubic-bezier(.12,.72,.18,1)";

    wheel.style.transform =
        "rotate(" +
        finalRotation +
        "deg)";


    wheelRotation =
        finalRotation;


    result.textContent =
        "🎡 Wheel ghoom raha hai...";


    /*
       SPIN COMPLETE
    */

    setTimeout(function(){

        showWinningNumber(
            winningNumber
        );

    },4600);

}


/* =========================
   SHOW WINNING NUMBER
========================= */

function showWinningNumber(
    winningNumber
){

    /*
       WIN NUMBER
       CENTER MEIN
    */

    wheelCenter.classList.add(
        "win"
    );


    wheelCenter.innerHTML =
        "WIN<br>" +
        winningNumber;


    /*
       CHECK BET
    */

    if(
        selectedNumber !== null &&
        totalBet > 0
    ){

        if(
            winningNumber ===
            selectedNumber
        ){

            const winAmount =
                totalBet * 35;


            const returnedBet =
                totalBet;


            const totalPayout =
                winAmount +
                returnedBet;


            balance =
                balance +
                totalPayout;


            result.textContent =
                "🎉 WIN! Number " +
                winningNumber +
                " — +" +
                winAmount +
                " profit";

        }

        else{

            result.textContent =
                "Number " +
                winningNumber +
                " aaya — " +
                totalBet +
                " points lost";

        }

    }
    else{

        result.textContent =
            "Winning Number: " +
            winningNumber;

    }


    /*
       4 SECOND WIN DISPLAY
    */

    setTimeout(function(){

        wheelCenter.classList.remove(
            "win"
        );

        wheelCenter.innerHTML =
            "ZYNO";


        /*
           RESET BET
        */

        totalBet = 0;

        selectedNumber = null;


        document
            .querySelectorAll(".number")
            .forEach(function(n){

                n.classList.remove(
                    "pressed"
                );

            });


        document
            .querySelectorAll(".bet-count")
            .forEach(function(b){

                b.textContent = "";

            });


        selectedBet.textContent =
            "Number select karo";


        /*
           NEXT ROUND
        */

        timeLeft = 60;

        bigTimer.textContent =
            "60";


        spinning = false;

        roundRunning = true;


        result.textContent =
            "Number select karo";

    },4000);

}


/* =========================
   BETTING TIMER
========================= */

setInterval(function(){

    /*
       SPIN KE TIME TIMER STOP
    */

    if(spinning){

        return;

    }


    /*
       COUNTDOWN
    */

    if(timeLeft > 0){

        timeLeft--;

    }


    /*
       TIMER DISPLAY
    */

    bigTimer.textContent =
        timeLeft;


    /*
       ZERO PAR SPIN
    */

    if(timeLeft === 0){

        lockBetting();


        setTimeout(function(){

            spinWheel();

        },300);

    }

},1000);


/* =========================
   OTHER GAMES
========================= */

function openLudo(){

    result.textContent =
        "🎲 ZYNO LUDO opening soon";

}


function openZeroEleven(){

    result.textContent =
        "🔢 ZYNO 0–11 opening soon";

}


function openTeenPatti(){

    result.textContent =
        "🃏 TEEN PATTI opening soon";

}

</script>

</body>
</html>
