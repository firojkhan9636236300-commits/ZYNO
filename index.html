<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;

    background:
        radial-gradient(
            circle at top,
            #102b49 0%,
            #020b18 48%,
            #010611 100%
        );

    color:#fff;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;

    padding:
        2px
        4px
        calc(60px + env(safe-area-inset-bottom));
}


/* =========================
   GAME BOX
========================= */

.game-box{
    position:relative;

    background:
        linear-gradient(
            145deg,
            #21143a 0%,
            #17102d 45%,
            #0b0b1e 100%
        );

    border:3px solid #00e5ff;

    border-radius:38px 38px 0 0;

    padding:5px 6px 20px;

    box-shadow:
        0 0 20px rgba(0,229,255,.18),
        inset 0 0 60px rgba(102,0,180,.08);
}


/* =========================
   WHEEL AREA
========================= */

.wheel-area{
    display:flex;

    justify-content:center;
    align-items:center;

    padding:12px 0 5px;
}


/* =========================
   OUTER WHEEL - FIXED
========================= */

.wheel{
    width:min(57vw,245px);
    height:min(57vw,245px);

    border-radius:50%;

    position:relative;

    border:7px solid #ffd34e;

    background:
        repeating-conic-gradient(
            from -4.86deg,
            #090b12 0deg 4.86deg,
            #5a287f 4.86deg 9.72deg
        );

    box-shadow:
        0 0 0 3px #513814,
        0 0 24px rgba(255,211,78,.35),
        inset 0 0 30px #000;

    transform:none;

    will-change:auto;
}


/* =========================
   INNER RING - FIXED
========================= */

.wheel-ring{
    position:absolute;

    inset:15%;

    border-radius:50%;

    border:3px solid #ffd34e;

    box-shadow:
        0 0 12px rgba(255,211,78,.25),
        inset 0 0 18px #000;

    z-index:2;
}


/* =========================
   MOVING NUMBER LAYER
========================= */

.wheel-numbers{
    position:absolute;

    inset:0;

    border-radius:50%;

    z-index:4;

    transition:
        transform 4.5s cubic-bezier(.12,.72,.18,1);

    will-change:transform;
}


/* =========================
   WHEEL NUMBERS
========================= */

.wheel-number{
    position:absolute;

    width:17px;
    height:17px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:8px;

    font-weight:bold;

    text-shadow:
        0 2px 3px #000;

    pointer-events:none;
}


/* =========================
   CENTER - FIXED
========================= */

.wheel-center{
    position:absolute;

    width:29%;
    height:29%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#080b16;

    border:5px solid #00e5ff;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#00e5ff;

    font-size:13px;

    font-weight:bold;

    letter-spacing:1px;

    text-align:center;

    box-shadow:
        0 0 17px rgba(0,229,255,.35),
        inset 0 0 13px #000;

    z-index:10;
}


/* =========================
   WIN NUMBER
========================= */

.wheel-center.win{
    color:#ffd34e;

    border-color:#ffd34e;

    font-size:18px;

    line-height:1.1;

    text-shadow:
        0 0 12px rgba(255,211,78,.7);
}


/* =========================
   POINTER - FIXED
========================= */

.pointer{
    position:absolute;

    top:-9px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-top:18px solid #ffd34e;

    filter:
        drop-shadow(
            0 0 6px rgba(255,211,78,.7)
        );

    z-index:20;
}


/* =========================
   NUMBER SECTION
========================= */

.number-section{
    margin-top:4px;
}

.number-title{
    text-align:center;

    color:#00e5ff;

    font-weight:bold;

    font-size:12px;

    margin-bottom:6px;

    letter-spacing:.5px;
}

.number-grid{
    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:3px;
}


/* =========================
   NUMBER
========================= */

.number{
    min-height:38px;

    border-radius:5px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    font-size:11px;

    font-weight:bold;

    border:1px solid rgba(255,255,255,.15);

    cursor:pointer;

    user-select:none;

    transition:.1s;

    touch-action:none;

    overflow:hidden;
}

.number.red{
    background:#542049;
}

.number.black{
    background:#090b12;
}

.number.zero{
    background:#078b67;
}


/* =========================
   PRESSED NUMBER
========================= */

.number.pressed{
    border:2px solid #ffd34e;

    box-shadow:
        0 0 0 2px rgba(255,211,78,.15),
        0 0 15px rgba(255,211,78,.8);

    transform:scale(.94);
}


/* =========================
   BET COUNT
========================= */

.bet-count{
    position:absolute;

    top:2px;
    right:3px;

    color:#ffd34e;

    font-size:7px;

    font-weight:bold;

    line-height:1;

    background:rgba(0,0,0,.65);

    border-radius:3px;

    padding:2px 3px;

    pointer-events:none;
}


/* =========================
   BALANCE / TIMER / LAST 4
========================= */

.betting-time{
    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    align-items:center;

    gap:5px;

    padding:6px 3px 7px;

    margin-top:5px;

    border-top:1px solid rgba(0,229,255,.15);

    border-bottom:1px solid rgba(0,229,255,.12);
}

.info-box{
    text-align:center;

    min-width:0;
}

.info-title{
    color:#c1bfd7;

    font-size:9px;

    font-weight:bold;

    letter-spacing:.5px;

    white-space:nowrap;
}

.info-value{
    color:#ffd34e;

    font-size:16px;

    font-weight:bold;

    margin-top:3px;

    white-space:nowrap;
}

.timer-big{
    color:#ffd34e;

    font-size:30px;

    line-height:1;

    font-weight:bold;

    text-shadow:
        0 0 18px rgba(255,211,78,.35);

    margin-top:3px;
}


/* =========================
   LAST 4 WIN NUMBERS
========================= */

.last-numbers{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:3px;

    margin-top:3px;

    min-height:20px;
}

.last-number{
    width:20px;
    height:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#090b12;

    border:1px solid #00e5ff;

    color:#fff;

    font-size:8px;

    font-weight:bold;

    flex-shrink:0;
}

.last-number.red{
    background:#542049;
}

.last-number.black{
    background:#090b12;
}

.last-number.zero{
    background:#078b67;
}


/* =========================
   SELECTED BET
========================= */

.selected-bet{
    margin-top:7px;

    background:
        linear-gradient(
            135deg,
            #24183d,
            #100d20
        );

    border:1px solid #5b4677;

    border-radius:8px;

    padding:8px;

    text-align:center;

    color:#bfc6d8;

    font-size:11px;
}

.selected-bet strong{
    color:#00e5ff;
}


/* =========================
   GAME BUTTONS
========================= */

.game-buttons{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:4px;

    margin-top:7px;
}

.game-button{
    min-height:40px;

    border-radius:8px;

    border:1px solid #00bde9;

    background:
        linear-gradient(
            135deg,
            #24143f,
            #101126
        );

    color:#00e5ff;

    font-size:9px;

    font-weight:bold;

    box-shadow:
        0 0 10px rgba(0,229,255,.12);

    cursor:pointer;

    touch-action:manipulation;
}

.game-button:active{
    transform:scale(.97);
}


/* =========================
   RESULT
========================= */

.result{
    text-align:center;

    margin-top:7px;

    min-height:21px;

    color:#ffd34e;

    font-weight:bold;

    font-size:11px;
}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:350px){

    .wheel{
        width:55vw;
        height:55vw;
    }

    .wheel-number{
        width:16px;
        height:16px;

        font-size:7px;
    }

    .number{
        min-height:36px;

        font-size:10px;
    }

    .game-button{
        font-size:8px;

        min-height:38px;
    }

    .timer-big{
        font-size:27px;
    }

    .info-title{
        font-size:8px;
    }

    .info-value{
        font-size:14px;
    }

    .last-number{
        width:18px;
        height:18px;

        font-size:7px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="game-box">


<!-- =========================
     WHEEL
========================= -->

<div class="wheel-area">

<div
    class="wheel"
    id="wheel">

    <div class="pointer"></div>

    <div class="wheel-ring"></div>

    <!-- ONLY THIS LAYER WILL ROTATE -->

    <div
        class="wheel-numbers"
        id="wheelNumbers">
    </div>

    <div
        class="wheel-center"
        id="wheelCenter">

        ZYNO

    </div>

</div>

</div>


<!-- =========================
     NUMBERS
========================= -->

<div class="number-section">

<div class="number-title">

    SELECT NUMBER 0 - 36

</div>

<div
    class="number-grid"
    id="numberGrid">
</div>

</div>


<!-- =========================
     BALANCE / TIMER / LAST 4
========================= -->

<div class="betting-time">


    <!-- BALANCE -->

    <div class="info-box">

        <div class="info-title">
            BALANCE
        </div>

        <div
            class="info-value"
            id="balanceDisplay">

            10000

        </div>

    </div>


    <!-- BETTING TIMER -->

    <div class="info-box">

        <div class="info-title">
            BETTING TIME
        </div>

        <div
            class="timer-big"
            id="bigTimer">

            60

        </div>

    </div>


    <!-- LAST 4 WIN -->

    <div class="info-box">

        <div class="info-title">
            LAST 4 WIN
        </div>

        <div
            class="last-numbers"
            id="lastNumbers">

            <span class="last-number">-</span>
            <span class="last-number">-</span>
            <span class="last-number">-</span>
            <span class="last-number">-</span>

        </div>

    </div>


</div>


<!-- =========================
     SELECTED BET
========================= -->

<div
    class="selected-bet"
    id="selectedBet">

    Number select karo

</div>


<!-- =========================
     OTHER GAMES
========================= -->

<div class="game-buttons">

<button
    class="game-button"
    onclick="openLudo()">

    🎲 ZYNO LUDO

</button>


<button
    class="game-button"
    onclick="openZeroEleven()">

    🔢 ZYNO 0–11

</button>


<button
    class="game-button"
    onclick="openTeenPatti()">

    🃏 TEEN PATTI

</button>

</div>


<!-- =========================
     RESULT
========================= -->

<div
    class="result"
    id="result">

    Number select karo

</div>


</div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let balance = 10000;

let selectedNumber = null;

let totalBet = 0;

let timeLeft = 60;

let spinning = false;

let roundRunning = true;

let pressTimer = null;

let currentBetDiv = null;

let wheelRotation = 0;

let lastWinningNumbers = [];


/* =========================
   SOUND SYSTEM
========================= */

let audioContext = null;


/*
   iPhone/Safari par sound
   user interaction ke baad chalega.
*/

function initAudio(){

    if(!audioContext){

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioCtx){

            audioContext =
                new AudioCtx();

        }

    }


    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }

}


/* =========================
   BET SOUND
========================= */

function playBetSound(){

    initAudio();

    if(!audioContext) return;


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        520,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        700,
        audioContext.currentTime + 0.045
    );


    gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.055,
        audioContext.currentTime + 0.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.055
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.06
    );

}


/* =========================
   SPIN SOUND
========================= */

function playSpinSound(){

    initAudio();

    if(!audioContext) return;


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        "triangle";

    oscillator.frequency.setValueAtTime(
        180,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        90,
        audioContext.currentTime + 4
    );


    gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.08,
        audioContext.currentTime + 0.05
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 4
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 4.05
    );

}


/* =========================
   WIN SOUND
========================= */

function playWinSound(){

    initAudio();

    if(!audioContext) return;


    const now =
        audioContext.currentTime;


    [523,659,784].forEach(
        function(freq,index){

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";

            oscillator.frequency.value =
                freq;


            const start =
                now +
                index * 0.12;


            gain.gain.setValueAtTime(
                0.0001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                0.10,
                start + 0.02
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                start + 0.25
            );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start + 0.27
            );

        }
    );

}


/* =========================
   RED NUMBERS
========================= */

const redNumbers = [

    1,3,5,7,9,
    12,14,16,18,
    19,21,23,25,27,
    30,32,34,36

];


/* =========================
   ELEMENTS
========================= */

const numberGrid =
    document.getElementById(
        "numberGrid"
    );

const wheel =
    document.getElementById(
        "wheel"
    );

const wheelNumbers =
    document.getElementById(
        "wheelNumbers"
    );

const wheelCenter =
    document.getElementById(
        "wheelCenter"
    );

const bigTimer =
    document.getElementById(
        "bigTimer"
    );

const result =
    document.getElementById(
        "result"
    );

const selectedBet =
    document.getElementById(
        "selectedBet"
    );

const balanceDisplay =
    document.getElementById(
        "balanceDisplay"
    );

const lastNumbers =
    document.getElementById(
        "lastNumbers"
    );


/* =========================
   BALANCE DISPLAY
========================= */

function updateBalance(){

    balanceDisplay.textContent =
        balance.toLocaleString();

}


/* =========================
   LAST 4 WINNING NUMBERS
========================= */

function addWinningNumber(number){

    /*
       NEW NUMBER RIGHT SIDE MEIN
    */

    lastWinningNumbers.push(
        number
    );


    /*
       SIRF LAST 4
    */

    if(
        lastWinningNumbers.length > 4
    ){

        lastWinningNumbers.shift();

    }


    lastNumbers.innerHTML = "";


    lastWinningNumbers.forEach(
        function(num){

            const span =
                document.createElement(
                    "span"
                );

            span.className =
                "last-number";


            if(num === 0){

                span.classList.add(
                    "zero"
                );

            }
            else if(
                redNumbers.includes(num)
            ){

                span.classList.add(
                    "red"
                );

            }
            else{

                span.classList.add(
                    "black"
                );

            }


            span.textContent =
                num;


            lastNumbers.appendChild(
                span
            );

        }
    );


    /*
       4 SE KAM HAIN
       PLACEHOLDER
    */

    while(
        lastNumbers.children.length < 4
    ){

        const span =
            document.createElement(
                "span"
            );

        span.className =
            "last-number";

        span.textContent =
            "-";

        lastNumbers.appendChild(
            span
        );

    }

}


/* =========================
   NUMBER GRID
========================= */

for(let i = 0; i <= 36; i++){

    const div =
        document.createElement(
            "div"
        );

    div.classList.add(
        "number"
    );


    if(i === 0){

        div.classList.add(
            "zero"
        );

    }
    else if(
        redNumbers.includes(i)
    ){

        div.classList.add(
            "red"
        );

    }
    else{

        div.classList.add(
            "black"
        );

    }


    const numberText =
        document.createElement(
            "span"
        );

    numberText.textContent =
        i;

    div.appendChild(
        numberText
    );


    const betCount =
        document.createElement(
            "span"
        );

    betCount.className =
        "bet-count";

    betCount.textContent =
        "";

    div.appendChild(
        betCount
    );


    /* =========================
       PRESS DOWN
    ========================= */

    div.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            if(spinning) return;

            if(!roundRunning) return;


            /*
               SOUND USER GESTURE PAR
            */

            initAudio();


            startHolding(
                i,
                div,
                betCount
            );

        }
    );


    /* =========================
       PRESS UP
    ========================= */

    div.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            stopHolding();

        }
    );


    /* =========================
       CANCEL
    ========================= */

    div.addEventListener(
        "pointercancel",
        function(){

            stopHolding();

        }
    );


    /* =========================
       LEAVE
    ========================= */

    div.addEventListener(
        "pointerleave",
        function(){

            if(
                pressTimer !== null
            ){

                stopHolding();

            }

        }
    );


    numberGrid.appendChild(
        div
    );

}


/* =========================
   START HOLDING
========================= */

function startHolding(
    number,
    div,
    betCount
){

    stopHolding();


    selectedNumber =
        number;

    currentBetDiv =
        div;

    totalBet =
        0;


    document
        .querySelectorAll(
            ".number"
        )
        .forEach(
            function(n){

                n.classList.remove(
                    "pressed"
                );

            }
        );


    div.classList.add(
        "pressed"
    );


    /*
       FIRST POINT IMMEDIATELY
    */

    placeOnePointBet(
        betCount
    );


    /*
       EVERY 100ms
       = 10 POINTS PER SECOND
    */

    pressTimer =
        setInterval(
            function(){

                if(!roundRunning){

                    stopHolding();

                    return;

                }


                if(spinning){

                    stopHolding();

                    return;

                }


                if(timeLeft <= 0){

                    stopHolding();

                    return;

                }


                placeOnePointBet(
                    betCount
                );

            },
            100
        );

}


/* =========================
   STOP HOLDING
========================= */

function stopHolding(){

    if(
        pressTimer !== null
    ){

        clearInterval(
            pressTimer
        );

        pressTimer =
            null;

    }


    if(currentBetDiv){

        currentBetDiv.classList.remove(
            "pressed"
        );

    }

    currentBetDiv =
        null;

}


/* =========================
   ONE POINT BET
========================= */

function placeOnePointBet(
    betCount
){

    if(
        selectedNumber === null
    ){

        return;

    }


    if(balance < 1){

        result.textContent =
            "💰 Balance khatam ho gaya";

        stopHolding();

        return;

    }


    /*
       1 POINT MINUS
    */

    balance =
        balance - 1;


    updateBalance();


    /*
       BET SOUND
    */

    playBetSound();


    /*
       TOTAL BET
    */

    totalBet =
        totalBet + 1;


    /*
       BET COUNT
    */

    if(betCount){

        betCount.textContent =
            "BET " +
            totalBet;

    }


    /*
       SELECTED BET
    */

    selectedBet.innerHTML =
        "Number <strong>" +
        selectedNumber +
        "</strong> par total <strong>" +
        totalBet +
        "</strong> points bet";


    result.textContent =
        "⚡ Number " +
        selectedNumber +
        " par " +
        totalBet +
        " points";

}


/* =========================
   WHEEL NUMBERS
========================= */

for(let i = 0; i <= 36; i++){

    const number =
        document.createElement(
            "div"
        );

    number.className =
        "wheel-number";

    number.textContent =
        i;


    /*
       37 NUMBERS CIRCLE
    */

    const angle =
        (i * 360 / 37) - 90;


    const radius =
        39;


    const angleRad =
        angle *
        Math.PI /
        180;


    const x =
        50 +
        Math.cos(angleRad) *
        radius;


    const y =
        50 +
        Math.sin(angleRad) *
        radius;


    number.style.left =
        x + "%";

    number.style.top =
        y + "%";


    number.style.transform =
        "translate(-50%,-50%)";


    /*
       IMPORTANT:
       NUMBER WHEEL KE ANDAR
       FIXED OUTER WHEEL KE NAHI
    */

    wheelNumbers.appendChild(
        number
    );

}


/* =========================
   LOCK BETTING
========================= */

function lockBetting(){

    roundRunning =
        false;

    stopHolding();

}


/* =========================
   SPIN NUMBERS ONLY
========================= */

function spinWheel(){

    if(spinning) return;


    spinning =
        true;

    roundRunning =
        false;

    stopHolding();


    /*
       SPIN SOUND
    */

    playSpinSound();


    /*
       WINNING NUMBER
    */

    const winningNumber =
        Math.floor(
            Math.random() * 37
        );


    /*
       37 SEGMENTS
    */

    const segment =
        360 / 37;


    /*
       WINNING NUMBER ANGLE
    */

    const targetAngle =
        winningNumber *
        segment;


    /*
       EXTRA SPINS
    */

    const extraSpins =
        6 * 360;


    /*
       FINAL ROTATION

       IMPORTANT:
       SIRF NUMBERS ROTATE
    */

    const finalRotation =
        wheelRotation +
        extraSpins +
        (360 - targetAngle);


    wheelNumbers.style.transition =
        "transform 4.5s cubic-bezier(.12,.72,.18,1)";


    wheelNumbers.style.transform =
        "rotate(" +
        finalRotation +
        "deg)";


    wheelRotation =
        finalRotation;


    result.textContent =
        "🎡 Numbers ghoom rahe hain...";


    /*
       SPIN COMPLETE
    */

    setTimeout(
        function(){

            showWinningNumber(
                winningNumber
            );

        },
        4600
    );

}


/* =========================
   SHOW WINNING NUMBER
========================= */

function showWinningNumber(
    winningNumber
){

    /*
       AB OFFICIAL WINNER HAI

       LAST 4 MEIN ADD HOGA
    */

    addWinningNumber(
        winningNumber
    );


    /*
       CENTER WIN
    */

    wheelCenter.classList.add(
        "win"
    );


    wheelCenter.innerHTML =
        "WIN<br>" +
        winningNumber;


    /*
       CHECK BET
    */

    if(
        selectedNumber !== null &&
        totalBet > 0
    ){

        if(
            winningNumber ===
            selectedNumber
        ){

            const winAmount =
                totalBet * 35;


            const returnedBet =
                totalBet;


            const totalPayout =
                winAmount +
                returnedBet;


            balance =
                balance +
                totalPayout;


            updateBalance();


            /*
               WIN SOUND
            */

            playWinSound();


            result.textContent =
                "🎉 WIN! Number " +
                winningNumber +
                " — +" +
                winAmount +
                " profit";

        }

        else{

            result.textContent =
                "Number " +
                winningNumber +
                " aaya — " +
                totalBet +
                " points lost";

        }

    }
    else{

        result.textContent =
            "Winning Number: " +
            winningNumber;

    }


    /*
       4 SECOND WIN DISPLAY
    */

    setTimeout(
        function(){

            wheelCenter.classList.remove(
                "win"
            );

            wheelCenter.innerHTML =
                "ZYNO";


            /*
               RESET BET
            */

            totalBet =
                0;

            selectedNumber =
                null;


            document
                .querySelectorAll(
                    ".number"
                )
                .forEach(
                    function(n){

                        n.classList.remove(
                            "pressed"
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".bet-count"
                )
                .forEach(
                    function(b){

                        b.textContent =
                            "";

                    }
                );


            selectedBet.textContent =
                "Number select karo";


            /*
               NEXT ROUND
            */

            timeLeft =
                60;

            bigTimer.textContent =
                "60";


            spinning =
                false;

            roundRunning =
                true;


            result.textContent =
                "Number select karo";

        },
        4000
    );

}


/* =========================
   BETTING TIMER
========================= */

setInterval(
    function(){

        /*
           SPIN KE TIME TIMER STOP
        */

        if(spinning){

            return;

        }


        /*
           COUNTDOWN
        */

        if(timeLeft > 0){

            timeLeft--;

        }


        /*
           TIMER DISPLAY
        */

        bigTimer.textContent =
            timeLeft;


        /*
           ZERO PAR SPIN
        */

        if(timeLeft === 0){

            lockBetting();


            setTimeout(
                function(){

                    spinWheel();

                },
                300
            );

        }

    },
    1000
);


/* =========================
   INITIAL DISPLAY
========================= */

updateBalance();
