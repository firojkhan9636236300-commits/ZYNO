<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#020b18;
    color:#fff;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:12px 10px 35px;
}

/* HEADER */
.header{
    text-align:center;
    padding:10px 0 15px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#00c8ff;
    letter-spacing:3px;
}

.subtitle{
    color:#9db5c9;
    font-size:12px;
    margin-top:4px;
}

/* GAME BOX */
.game-box{
    background:linear-gradient(145deg,#071b32,#03101f);
    border:1px solid #12385c;
    border-radius:18px;
    padding:12px;
    box-shadow:0 0 25px rgba(0,150,255,.12);
}

/* INFO */
.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:12px;
}

.info-box{
    background:#06172a;
    border:1px solid #16466d;
    border-radius:10px;
    text-align:center;
    padding:8px 4px;
}

.info-title{
    color:#829bb0;
    font-size:9px;
}

.info-value{
    color:#00d5ff;
    font-size:14px;
    font-weight:bold;
    margin-top:4px;
}

/* WHEEL */
.wheel-area{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:8px 0 15px;
}

.wheel{
    width:min(76vw,310px);
    height:min(76vw,310px);
    max-width:310px;
    max-height:310px;
    min-width:220px;
    min-height:220px;
    border-radius:50%;
    position:relative;
    border:10px solid #b68a35;
    background:
        repeating-conic-gradient(
            from 0deg,
            #c92323 0deg 9.73deg,
            #111 9.73deg 19.46deg
        );
    box-shadow:
        0 0 0 5px #38280d,
        0 0 30px rgba(255,180,40,.25),
        inset 0 0 20px #000;
}

.wheel::before{
    content:"";
    position:absolute;
    inset:24%;
    border-radius:50%;
    background:radial-gradient(circle,#e4b84b 0 8%,#75521d 9% 14%,#101010 15% 100%);
    border:5px solid #b68a35;
    box-shadow:inset 0 0 15px #000;
}

.wheel::after{
    content:"ZYNO";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    color:#fff;
    letter-spacing:2px;
    text-shadow:0 2px 5px #000;
}

/* POINTER */
.pointer{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:20px solid #ffd34e;
    z-index:5;
}

/* NUMBERS */
.number-section{
    margin-top:5px;
}

.number-title{
    text-align:center;
    color:#00c8ff;
    font-weight:bold;
    font-size:13px;
    margin-bottom:8px;
}

.number-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
}

.number{
    min-height:39px;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
    border:1px solid rgba(255,255,255,.15);
    cursor:pointer;
    user-select:none;
}

.number.red{
    background:#c51f2b;
}

.number.black{
    background:#15191e;
}

.number.zero{
    background:#078b4b;
    grid-row:span 1;
}

.number.selected{
    box-shadow:0 0 0 2px #00d9ff,0 0 12px #00d9ff;
    transform:scale(.96);
}

/* BET OPTIONS */
.bet-options{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    margin-top:10px;
}

.bet-option{
    background:#071b30;
    border:1px solid #285273;
    color:#fff;
    border-radius:6px;
    min-height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
}

/* BET AMOUNT */
.bet-area{
    margin-top:12px;
    background:#06172a;
    border:1px solid #16466d;
    border-radius:12px;
    padding:10px;
}

.bet-label{
    color:#8ea7ba;
    font-size:11px;
    margin-bottom:6px;
}

.bet-row{
    display:flex;
    gap:7px;
}

.bet-input{
    flex:1;
    min-width:0;
    background:#020c18;
    border:1px solid #285273;
    border-radius:7px;
    color:#fff;
    padding:10px;
    font-size:14px;
    outline:none;
}

.bet-button{
    background:#00aeea;
    color:#00101b;
    border:none;
    border-radius:7px;
    padding:0 16px;
    font-weight:bold;
}

/* SPIN */
.spin-button{
    width:100%;
    margin-top:12px;
    min-height:48px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#008fd1,#00d8ff);
    color:#00101b;
    font-size:17px;
    font-weight:bold;
    box-shadow:0 5px 18px rgba(0,200,255,.2);
}

.spin-button:active{
    transform:scale(.98);
}

/* RESULT */
.result{
    text-align:center;
    margin-top:12px;
    min-height:25px;
    color:#ffd34e;
    font-weight:bold;
    font-size:14px;
}

/* MOBILE */
@media(max-width:480px){

    .container{
        padding:8px 7px 30px;
    }

    .logo{
        font-size:24px;
    }

    .game-box{
        padding:9px;
        border-radius:14px;
    }

    .wheel{
        width:70vw;
        height:70vw;
        min-width:215px;
        min-height:215px;
        border-width:8px;
    }

    .number-grid{
        gap:3px;
    }

    .number{
        min-height:37px;
        font-size:13px;
    }

    .bet-option{
        min-height:34px;
        font-size:10px;
    }

    .spin-button{
        margin-bottom:8px;
    }
}

@media(max-width:350px){

    .number{
        min-height:34px;
        font-size:12px;
    }

    .info-value{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">ZYNO</div>
        <div class="subtitle">ROULETTE • PLAY • WIN • REPEAT</div>
    </div>

    <div class="game-box">

        <div class="info">
            <div class="info-box">
                <div class="info-title">BALANCE</div>
                <div class="info-value" id="balance">10000</div>
            </div>

            <div class="info-box">
                <div class="info-title">BET TIME</div>
                <div class="info-value" id="timer">60</div>
            </div>

            <div class="info-box">
                <div class="info-title">LAST WIN</div>
                <div class="info-value" id="lastWin">0</div>
            </div>
        </div>

        <div class="wheel-area">
            <div class="wheel">
                <div class="pointer"></div>
            </div>
        </div>

        <div class="number-section">

            <div class="number-title">
                SELECT NUMBER 0 - 36
            </div>

            <div class="number-grid" id="numberGrid"></div>

        </div>

        <div class="bet-options">
            <div class="bet-option">1 - 18</div>
            <div class="bet-option">EVEN</div>
            <div class="bet-option">RED</div>
            <div class="bet-option">BLACK</div>
            <div class="bet-option">ODD</div>
            <div class="bet-option">19 - 36</div>
        </div>

        <div class="bet-area">

            <div class="bet-label">
                BET AMOUNT
            </div>

            <div class="bet-row">
                <input
                    type="number"
                    id="betAmount"
                    class="bet-input"
                    placeholder="Enter points"
                    min="1"
                >

                <button class="bet-button" onclick="placeBet()">
                    BET
                </button>
            </div>

        </div>

        <button class="spin-button" onclick="spinRoulette()">
            SPIN
        </button>

        <div class="result" id="result">
            Select a number and place your bet
        </div>

    </div>

</div>

<script>

let balance = 10000;
let selectedNumber = null;
let currentBet = 0;

const redNumbers = [
    1,3,5,7,9,12,14,16,18,
    19,21,23,25,27,30,32,34,36
];

const numberGrid = document.getElementById("numberGrid");

for(let i = 0; i <= 36; i++){

    const div = document.createElement("div");

    div.classList.add("number");

    if(i === 0){
        div.classList.add("zero");
    }
    else if(redNumbers.includes(i)){
        div.classList.add("red");
    }
    else{
        div.classList.add("black");
    }

    div.textContent = i;

    div.onclick = function(){

        document.querySelectorAll(".number")
        .forEach(n => n.classList.remove("selected"));

        div.classList.add("selected");

        selectedNumber = i;

        document.getElementById("result").textContent =
            "Number " + i + " selected";
    };

    numberGrid.appendChild(div);
}


function placeBet(){

    const amount =
        Number(document.getElementById("betAmount").value);

    if(selectedNumber === null){
        document.getElementById("result").textContent =
            "Pehle number select karo";
        return;
    }

    if(!amount || amount < 1){
        document.getElementById("result").textContent =
            "Minimum bet 1 point hai";
        return;
    }

    if(amount > balance){
        document.getElementById("result").textContent =
            "Balance kam hai";
        return;
    }

    currentBet = amount;

    document.getElementById("result").textContent =
        "Bet placed: " + amount + " points on " + selectedNumber;
}


function spinRoulette(){

    if(selectedNumber === null){
        document.getElementById("result").textContent =
            "Pehle number select karo";
        return;
    }

    if(currentBet <= 0){
        document.getElementById("result").textContent =
            "Pehle bet amount enter karke BET dabao";
        return;
    }

    const winningNumber =
        Math.floor(Math.random() * 37);

    if(winningNumber === selectedNumber){

        const winAmount = currentBet * 35;

        balance += winAmount;

        document.getElementById("lastWin").textContent =
            winAmount;

        document.getElementById("result").textContent =
            "🎉 WIN! Number " + winningNumber +
            " — +" + winAmount + " points";

    }else{

        balance -= currentBet;

        document.getElementById("lastWin").textContent =
            0;

        document.getElementById("result").textContent =
            "Number " + winningNumber +
            " aaya — Bet lost " + currentBet + " points";
    }

    document.getElementById("balance").textContent =
        balance;

    currentBet = 0;
}


/* 60 SECOND TIMER */
let timeLeft = 60;

setInterval(function(){

    if(timeLeft > 0){
        timeLeft--;
    }else{
        timeLeft = 60;
    }

    document.getElementById("timer").textContent =
        timeLeft;

},1000);

</script>

</body>
</html>
