<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 35%,#102d55 0%,#06152d 42%,#020914 100%);
    color:white;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:520px;
    height:100dvh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:
        max(8px,env(safe-area-inset-top))
        10px
        max(8px,env(safe-area-inset-bottom));
    overflow:hidden;
}

/* LOGO */
.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    letter-spacing:6px;
    color:#00e5ff;
    text-shadow:
        0 0 7px #00e5ff,
        0 0 18px #00e5ff,
        0 0 35px #008cff;
    margin-bottom:5px;
}

/* INFO */
.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:6px;
}

.infoBox{
    background:rgba(5,20,43,.88);
    border:1px solid rgba(0,229,255,.4);
    border-radius:12px;
    padding:6px 8px;
    text-align:center;
    box-shadow:0 0 12px rgba(0,229,255,.08);
}

.infoTitle{
    font-size:10px;
    color:#8faecb;
    letter-spacing:1px;
}

.infoValue{
    font-size:17px;
    font-weight:800;
    color:#fff;
    margin-top:2px;
}

/* LAST WIN */
.lastWins{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-bottom:5px;
}

.winBall{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
    background:#0a203c;
    border:1px solid #315274;
}

/* WHEEL */
.wheelArea{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    flex:0 0 auto;
    margin-top:1px;
}

.pointer{
    position:absolute;
    top:-3px;
    z-index:20;
    width:0;
    height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:18px solid #ffd34e;
    filter:drop-shadow(0 0 5px #ffd34e);
}

.wheel{
    width:min(57vw,245px);
    height:min(57vw,245px);
    max-width:245px;
    max-height:245px;
    min-width:205px;
    min-height:205px;
    border-radius:50%;
    position:relative;

    background:
        conic-gradient(
            #06345a 0deg 9.73deg,
            #075b87 9.73deg 19.46deg,
            #06345a 19.46deg 29.19deg,
            #075b87 29.19deg 38.92deg,
            #06345a 38.92deg 48.65deg,
            #075b87 48.65deg 58.38deg,
            #06345a 58.38deg 68.11deg,
            #075b87 68.11deg 77.84deg,
            #06345a 77.84deg 87.57deg,
            #075b87 87.57deg 97.3deg,
            #06345a 97.3deg 107.03deg,
            #075b87 107.03deg 116.76deg,
            #06345a 116.76deg 126.49deg,
            #075b87 126.49deg 136.22deg,
            #06345a 136.22deg 145.95deg,
            #075b87 145.95deg 155.68deg,
            #06345a 155.68deg 165.41deg,
            #075b87 165.41deg 175.14deg,
            #06345a 175.14deg 184.87deg,
            #075b87 184.87deg 194.6deg,
            #06345a 194.6deg 204.33deg,
            #075b87 204.33deg 214.06deg,
            #06345a 214.06deg 223.79deg,
            #075b87 223.79deg 233.52deg,
            #06345a 233.52deg 243.25deg,
            #075b87 243.25deg 252.98deg,
            #06345a 252.98deg 262.71deg,
            #075b87 262.71deg 272.44deg,
            #06345a 272.44deg 282.17deg,
            #075b87 282.17deg 291.9deg,
            #06345a 291.9deg 301.63deg,
            #075b87 301.63deg 311.36deg,
            #06345a 311.36deg 321.09deg,
            #075b87 321.09deg 330.82deg,
            #06345a 330.82deg 340.55deg,
            #075b87 340.55deg 350.28deg,
            #06345a 350.28deg 360deg
        );

    border:4px solid #ffd34e;
    box-shadow:
        0 0 8px #ffd34e,
        0 0 22px rgba(255,211,78,.45),
        inset 0 0 15px rgba(0,0,0,.8);

    transition:transform 4.8s cubic-bezier(.12,.72,.15,1);
}

.wheel::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:50%;
}

.number{
    position:absolute;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    margin-left:-15px;
    margin-top:-15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:900;
    color:#fff;

    transform:
        rotate(var(--angle))
        translateY(calc(min(57vw,245px) / -2 + 18px))
        rotate(calc(var(--angle) * -1));

    text-shadow:0 1px 3px #000;
}

/* CENTER */
.center{
    position:absolute;
    width:64px;
    height:64px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:
        radial-gradient(circle,#123b68 0%,#061a34 65%,#020b18 100%);

    border:3px solid #ffd34e;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#00e5ff;
    font-size:14px;
    font-weight:900;
    letter-spacing:1px;

    box-shadow:
        0 0 10px #00e5ff,
        inset 0 0 15px rgba(0,229,255,.25);
}

/* TIMER */
.timerBox{
    margin:5px auto 5px;
    width:180px;
    text-align:center;
}

.timerLabel{
    font-size:9px;
    letter-spacing:2px;
    color:#91a8c1;
}

.timer{
    font-size:27px;
    line-height:30px;
    font-weight:900;
    color:#ffd34e;
    text-shadow:0 0 10px rgba(255,211,78,.6);
}

/* RESULT */
.result{
    min-height:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#d8edff;
}

/* SELECTED BET */
.selected{
    min-height:31px;
    border:1px solid rgba(0,229,255,.3);
    border-radius:10px;
    background:rgba(3,18,38,.8);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:#b7d4ed;
    margin-bottom:5px;
}

/* NUMBER GRID */
.grid{
    flex:1 1 auto;
    min-height:0;

    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;

    overflow:hidden;
    padding:1px;
}

.numBtn{
    border:1px solid #16456d;
    background:linear-gradient(145deg,#0b3156,#061a32);
    border-radius:7px;

    color:white;
    font-size:14px;
    font-weight:900;

    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;

    box-shadow:inset 0 0 7px rgba(0,0,0,.5);
}

.numBtn.zero{
    background:linear-gradient(145deg,#0b5770,#063246);
    color:#ffd34e;
}

.numBtn.active{
    border-color:#00e5ff;
    background:linear-gradient(145deg,#087a9d,#063e62);
    box-shadow:
        0 0 8px rgba(0,229,255,.65),
        inset 0 0 10px rgba(0,229,255,.2);
}

.betCount{
    position:absolute;
    right:2px;
    bottom:1px;
    font-size:7px;
    color:#ffd34e;
}

/* BOTTOM */
.footer{
    text-align:center;
    font-size:8px;
    color:#46637f;
    padding-top:3px;
    flex:0 0 auto;
}

/* MOBILE */
@media(max-height:700px){

    .logo{
        font-size:25px;
        margin-bottom:2px;
    }

    .info{
        margin-bottom:3px;
    }

    .lastWins{
        margin-bottom:2px;
    }

    .winBall{
        width:25px;
        height:25px;
    }

    .wheel{
        width:min(52vw,215px);
        height:min(52vw,215px);
        min-width:190px;
        min-height:190px;
    }

    .number{
        transform:
            rotate(var(--angle))
            translateY(calc(min(52vw,215px) / -2 + 16px))
            rotate(calc(var(--angle) * -1));
    }

    .timerBox{
        margin:2px auto;
    }

    .timer{
        font-size:23px;
        line-height:25px;
    }

    .selected{
        min-height:27px;
    }

    .grid{
        gap:3px;
    }

    .numBtn{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">ZYNO</div>

    <div class="info">
        <div class="infoBox">
            <div class="infoTitle">BALANCE</div>
            <div class="infoValue" id="balance">10000</div>
        </div>

        <div class="infoBox">
            <div class="infoTitle">LAST WIN</div>
            <div class="infoValue" id="lastWin">-</div>
        </div>
    </div>

    <div class="lastWins" id="lastWins">
        <div class="winBall">-</div>
        <div class="winBall">-</div>
        <div class="winBall">-</div>
        <div class="winBall">-</div>
    </div>

    <div class="wheelArea">
        <div class="pointer"></div>

        <div class="wheel" id="wheel">

            <div class="center" id="center">
                ZYNO
            </div>

        </div>
    </div>

    <div class="timerBox">
        <div class="timerLabel">BETTING TIME</div>
        <div class="timer" id="timer">60</div>
    </div>

    <div class="result" id="result">
        Number select karo
    </div>

    <div class="selected" id="selected">
        Koi number select nahi hai
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
        ZYNO ROULETTE
    </div>

</div>

<script>

/* =========================
   GAME SETTINGS
========================= */

let balance = 10000;

const BET_TIME = 60;

let timeLeft = BET_TIME;
let bettingOpen = true;
let spinning = false;

let selectedNumber = null;
let selectedBet = 0;

let bets = {};

let lastResults = [];

let timerInterval = null;

let holdTimer = null;
let holdStart = 0;


/* =========================
   ELEMENTS
========================= */

const wheel = document.getElementById("wheel");
const grid = document.getElementById("grid");

const timer = document.getElementById("timer");
const balanceEl = document.getElementById("balance");
const lastWinEl = document.getElementById("lastWin");

const result = document.getElementById("result");
const selected = document.getElementById("selected");

const center = document.getElementById("center");
const lastWins = document.getElementById("lastWins");


/* =========================
   WHEEL NUMBERS
========================= */

const wheelNumbers = [];

for(let i=0;i<=36;i++){

    wheelNumbers.push(i);

    const n = document.createElement("div");

    n.className = "number";
    n.textContent = i;

    const angle = i * (360 / 37);

    n.style.setProperty("--angle", angle + "deg");

    wheel.appendChild(n);
}


/* =========================
   NUMBER GRID
========================= */

for(let i=0;i<=36;i++){

    const btn = document.createElement("div");

    btn.className = "numBtn";

    if(i === 0){
        btn.classList.add("zero");
    }

    btn.dataset.number = i;

    btn.innerHTML = `
        <span>${i}</span>
        <span class="betCount"></span>
    `;

    /*
       PRESS AND HOLD
       0.25 SECOND = 1 POINT
    */

    btn.addEventListener("pointerdown",(e)=>{

        if(!bettingOpen || spinning) return;

        e.preventDefault();

        selectedNumber = i;

        updateSelected();

        holdStart = performance.now();

        holdTimer = setInterval(()=>{

            const elapsed =
                performance.now() - holdStart;

            const points =
                Math.floor(elapsed / 250);

            if(points > 0){

                addBet(i, points);

                holdStart = performance.now();

            }

        },250);

        btn.classList.add("active");
    });


    const stopHold = ()=>{

        clearInterval(holdTimer);
        holdTimer = null;

        btn.classList.remove("active");
    };


    btn.addEventListener("pointerup",stopHold);
    btn.addEventListener("pointercancel",stopHold);
    btn.addEventListener("pointerleave",stopHold);

    grid.appendChild(btn);
}


/* =========================
   ADD BET
========================= */

function addBet(number, points){

    if(!bettingOpen || spinning) return;

    if(balance <= 0){

        result.textContent =
            "Balance khatam ho gaya";

        return;
    }

    points = Math.min(points,balance);

    if(!bets[number]){
        bets[number] = 0;
    }

    bets[number] += points;

    balance -= points;

    balanceEl.textContent =
        Math.floor(balance);

    updateBetDisplay(number);
    updateSelected();
}


/* =========================
   BET DISPLAY
========================= */

function updateBetDisplay(number){

    const btn =
        document.querySelector(
            `.numBtn[data-number="${number}"]`
        );

    if(!btn) return;

    const count =
        btn.querySelector(".betCount");

    count.textContent =
        bets[number]
        ? "BET " + bets[number]
        : "";
}


/* =========================
   SELECTED DISPLAY
========================= */

function updateSelected(){

    if(selectedNumber === null){

        selected.textContent =
            "Koi number select nahi hai";

        return;
    }

    const total =
        bets[selectedNumber] || 0;

    selected.textContent =
        `Number ${selectedNumber} par total ${total} points bet`;
}


/* =========================
   TIMER
========================= */

function startTimer(){

    clearInterval(timerInterval);

    timerInterval = setInterval(()=>{

        if(!bettingOpen) return;

        timeLeft--;

        timer.textContent =
            timeLeft;

        /*
           LAST 4 SECONDS:
           BETTING CLOSED
        */

        if(timeLeft <= 4){

            bettingOpen = false;

            timer.textContent = "0";

            result.textContent =
                "Betting band — wheel spin ho raha hai";

            clearInterval(timerInterval);

            setTimeout(spinWheel,500);
        }

    },1000);
}


/* =========================
   SPIN
========================= */

function spinWheel(){

    if(spinning) return;

    spinning = true;
    bettingOpen = false;

    let winningNumber =
        Math.floor(Math.random() * 37);

    /*
       NUMBER KO POINTER KE NICHE
       LANE KE LIYE ROTATION
    */

    const segment =
        360 / 37;

    const targetAngle =
        360 - (winningNumber * segment);

    const extraSpins =
        360 * 6;

    wheel.style.transform =
        `rotate(${extraSpins + targetAngle}deg)`;

    setTimeout(()=>{

        showResult(winningNumber);

    },4800);
}


/* =========================
   RESULT
========================= */

function showResult(number){

    center.textContent =
        "WIN " + number;

    lastWinEl.textContent =
        number;

    result.textContent =
        "Winning Number: " + number;

    /*
       LAST 4
    */

    lastResults.push(number);

    if(lastResults.length > 4){
        lastResults.shift();
    }

    renderLastWins();


    /*
       PAYOUT
       0-36:
       BET × 35 + ORIGINAL BET
    */

    let winningBet =
        bets[number] || 0;

    if(winningBet > 0){

        const winAmount =
            winningBet * 35;

        const returnedBet =
            winningBet;

        const totalPayout =
            winAmount + returnedBet;

        balance += totalPayout;

        result.textContent =
            `WIN! ${number} par ${winningBet} bet — +${totalPayout} points`;

    }else{

        result.textContent =
            `Winning Number: ${number}`;
    }

    balanceEl.textContent =
        Math.floor(balance);


    /*
       RESET BETS
    */

    bets = {};

    document
        .querySelectorAll(".betCount")
        .forEach(el=>{
            el.textContent="";
        });


    document
        .querySelectorAll(".numBtn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });


    /*
       NEXT ROUND
    */

    setTimeout(()=>{

        center.textContent = "ZYNO";

        wheel.style.transition = "none";
        wheel.style.transform = "rotate(0deg)";

        /*
           Browser ko reset render karne ka time
        */

        requestAnimationFrame(()=>{

            requestAnimationFrame(()=>{

                wheel.style.transition =
                    "transform 4.8s cubic-bezier(.12,.72,.15,1)";

            });

        });

        selectedNumber = null;
        selectedBet = 0;

        selected.textContent =
            "Koi number select nahi hai";

        timeLeft = BET_TIME;

        timer.textContent =
            timeLeft;

        bettingOpen = true;
        spinning = false;

        result.textContent =
            "Number select karo";

        startTimer();

    },2500);
}


/* =========================
   LAST 4 WIN
========================= */

function renderLastWins(){

    const balls =
        lastWins.querySelectorAll(".winBall");

    const values =
        [
            ...Array(4-lastResults.length).fill("-"),
            ...lastResults
        ];

    balls.forEach((ball,index)=>{

        ball.textContent =
            values[index];

    });
}


/* =========================
   START
========================= */

balanceEl.textContent =
    balance;

timer.textContent =
    timeLeft;

startTimer();

</script>

</body>
</html>
