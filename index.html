<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYNO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #06152d;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #16345f;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #00bfff;
      letter-spacing: 3px;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #b9c7da;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: #00bfff;
      color: #00152b;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 17px;
    }

    .games {
      padding: 30px 20px 60px;
      text-align: center;
    }

    .games h2 {
      margin-bottom: 25px;
    }

    .card {
      max-width: 420px;
      margin: 15px auto;
      padding: 25px;
      background: #0b2345;
      border: 1px solid #163f70;
      border-radius: 15px;
    }

    .card h3 {
      color: #00bfff;
      margin-bottom: 8px;
    }

    .card p {
      color: #aebed3;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #71839d;
      border-top: 1px solid #16345f;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ZYNO</div>
  </header>

  <section class="hero">
    <h1>Welcome to ZYNO</h1>
    <p>Play. Enjoy. Experience ZYNO.</p>
    <a href="#games" class="btn">Explore Games</a>
  </section>

  <section class="games" id="games">
    <h2>Games</h2>

    <div class="card">
      <h3>Coming Soon</h3>
      <p>New games are coming to ZYNO.</p>
    </div>
  </section>

  <footer>
    © 2026 ZYNO. All rights reserved.
  </footer>

</body>
</html>
