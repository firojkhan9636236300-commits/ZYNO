<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#0a3154 0%,#041522 45%,#01070d 100%);
    color:#fff;
    user-select:none;
    position:fixed;
    inset:0;
}

.app{
    width:100%;
    max-width:520px;
    height:100dvh;
    margin:auto;
    padding:7px 10px 7px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* =========================
   LOGO
========================= */

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
    color:#00e5ff;
    text-shadow:
        0 0 8px #00e5ff,
        0 0 18px #00e5ff,
        0 0 35px rgba(0,229,255,.7);
    margin-bottom:6px;
}

/* =========================
   MODE
========================= */

.modeRow{
    display:flex;
    gap:7px;
    margin-bottom:6px;
}

.modeButton{
    flex:1;
    padding:8px 4px;
    border-radius:9px;
    border:1px solid rgba(0,229,255,.4);
    background:#061a2b;
    color:#d9f8ff;
    font-size:11px;
    font-weight:900;
}

.modeButton.active{
    color:#00e5ff;
    border-color:#00e5ff;
    box-shadow:0 0 10px rgba(0,229,255,.25);
}

/* =========================
   WHEEL AREA
========================= */

.wheelArea{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 0 4px;
}

.wheel{
    position:relative;
    width:min(66vw,275px);
    height:min(66vw,275px);
    border-radius:50%;

    /* RED + BLACK WHEEL */
    border:7px solid #ff2020;

    background:
        radial-gradient(
            circle,
            #101010 0%,
            #050505 62%,
            #000 100%
        );

    box-shadow:
        0 0 12px rgba(255,25,25,.9),
        0 0 30px rgba(255,0,0,.35),
        inset 0 0 30px rgba(255,0,0,.18);

    overflow:hidden;
}

/* Outer red/black ring */

.wheelRing{
    position:absolute;
    inset:11px;
    border:2px solid #ff2020;
    border-radius:50%;
    pointer-events:none;
    z-index:5;
}

/* =========================
   ONLY THIS PART ROTATES
========================= */

.numberRotor{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:50%;
    transform:rotate(0deg);
    z-index:10;
}

/* =========================
   WHEEL NUMBERS
========================= */

.wheelNumber{
    position:absolute;
    left:50%;
    top:50%;
    width:34px;
    height:34px;
    margin-left:-17px;
    margin-top:-17px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:15px;
    font-weight:900;

    border-radius:50%;

    pointer-events:none;

    text-shadow:
        0 1px 3px #000;
}

/* Roulette colors */

.wheelNumber.red{
    color:#ff3030;
}

.wheelNumber.black{
    color:#ffffff;
}

.wheelNumber.green{
    color:#00ff75;
}

/* =========================
   POINTER
========================= */

.pointer{
    position:absolute;
    left:50%;
    top:-5px;
    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:20px solid #ff4545;

    filter:drop-shadow(0 0 5px #ff4545);

    z-index:50;
}

/* =========================
   CENTER
========================= */

.wheelCenter{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:78px;
    height:78px;

    border-radius:50%;

    background:#030303;

    border:3px solid #ff2020;

    box-shadow:
        0 0 14px rgba(255,0,0,.8),
        inset 0 0 14px rgba(255,0,0,.3);

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    z-index:40;
}

.centerText{
    color:#ff3030;
    font-size:18px;
    font-weight:900;
    line-height:20px;
}

/* =========================
   BETTING TIMER
========================= */

.timerBox{
    text-align:center;
    margin:0 0 3px;
}

.timerTitle{
    color:#91aaba;
    font-size:9px;
    font-weight:800;
    letter-spacing:.5px;
}

.timer{
    color:#ffd34e;
    font-size:20px;
    font-weight:900;
    line-height:22px;
    text-shadow:
        0 0 7px rgba(255,211,78,.7);
}

.timer.closed{
    color:#ff4040;
    text-shadow:
        0 0 7px rgba(255,50,50,.7);
}

/* =========================
   RESULT
========================= */

.result{
    min-height:18px;
    text-align:center;
    color:#b9d6e5;
    font-size:12px;
    font-weight:700;
    margin-bottom:3px;
}

/* =========================
   LAST 4
========================= */

.lastTitle{
    text-align:center;
    color:#819caf;
    font-size:10px;
    margin-bottom:3px;
}

.lastWins{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:5px;
}

.lastNumber{
    width:36px;
    height:32px;
    border-radius:8px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#061b2c;
    border:1px solid rgba(0,229,255,.35);

    color:#fff;
    font-size:15px;
    font-weight:900;
}

/* =========================
   NUMBER GRID
========================= */

.numberGrid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:5px;

    flex:1;
    overflow:hidden;
}

.betNumber{
    min-height:47px;

    border-radius:9px;

    border:1px solid rgba(0,229,255,.4);

    background:
        linear-gradient(
            180deg,
            #092640,
            #031421
        );

    color:#fff;

    font-size:19px;
    font-weight:900;

    position:relative;

    touch-action:none;

    transition:
        transform .08s,
        box-shadow .15s;
}

.betNumber:active{
    transform:scale(.94);
}

/* selected bet */

.betNumber.selected{
    border-color:#00e5ff;

    box-shadow:
        0 0 11px rgba(0,229,255,.55),
        inset 0 0 9px rgba(0,229,255,.12);
}

/* disabled */

.betNumber.disabled{
    opacity:.45;
}

/* grid roulette colors */

.betNumber.redNumber{
    color:#ff3a3a;
}

.betNumber.blackNumber{
    color:#ffffff;
}

.betNumber.greenNumber{
    color:#00ff75;
}

.betCount{
    display:block;
    color:#00e5ff;
    font-size:8px;
    line-height:10px;
}

/* =========================
   BOTTOM BUTTONS
========================= */

.gameButtons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:6px;
    flex-shrink:0;
}

.gameButton{
    border:1px solid rgba(0,229,255,.35);
    background:#061a2b;
    color:#d8f8ff;
    border-radius:9px;
    padding:7px 3px;
    font-size:10px;
    font-weight:900;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:360px){

    .app{
        padding-left:7px;
        padding-right:7px;
    }

    .logo{
        font-size:29px;
        margin-bottom:5px;
    }

    .wheel{
        width:250px;
        height:250px;
    }

    .numberGrid{
        gap:4px;
    }

    .betNumber{
        min-height:44px;
        font-size:18px;
    }

    .wheelNumber{
        font-size:14px;
    }

    .wheelCenter{
        width:70px;
        height:70px;
    }

    .centerText{
        font-size:17px;
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="logo">
        ZYNO
    </div>

    <div class="modeRow">

        <button
            class="modeButton active"
            id="mode36">
            🔴 ZYNO 0–36
        </button>

        <button
            class="modeButton"
            id="mode11">
            🔢 ZYNO 0–11
        </button>

    </div>


    <!-- WHEEL -->

    <div class="wheelArea">

        <div class="wheel" id="wheel">

            <div class="pointer"></div>

            <!-- ONLY NUMBERS ROTATE -->
            <div
                class="numberRotor"
                id="numberRotor">
            </div>

            <div class="wheelRing"></div>

            <div class="wheelCenter">

                <div
                    class="centerText"
                    id="centerText">
                    ZYNO
                </div>

            </div>

        </div>

    </div>


    <!-- BETTING TIMER -->

    <div class="timerBox">

        <div class="timerTitle">
            BETTING TIME
        </div>

        <div
            class="timer"
            id="timer">
            60
        </div>

    </div>


    <div
        class="result"
        id="result">
        Number select karo
    </div>


    <!-- LAST 4 -->

    <div class="lastTitle">
        LAST 4 WIN
    </div>

    <div
        class="lastWins"
        id="lastWins">
    </div>


    <!-- NUMBER GRID -->

    <div
        class="numberGrid"
        id="numberGrid">
    </div>


    <!-- BOTTOM BUTTONS -->

    <div class="gameButtons">

        <button class="gameButton">
            🎲 ZYNO LUDO
        </button>

        <button class="gameButton">
            🔢 ZYNO 0–11
        </button>

        <button class="gameButton">
            🃏 TEEN PATTI
        </button>

    </div>

</div>


<script>

/* =====================================================
   ZYNO SETTINGS
===================================================== */

const START_BALANCE = 10000;

const ROUND_TIME = 60;

/*
   Last 4 seconds:
   60 → 59 → ... → 5 = betting open
   4 → 3 → 2 → 1 → 0 = betting closed
*/
const BET_CLOSE_TIME = 4;

const BET_SPEED = 250;


/* =====================================================
   STATE
===================================================== */

let balance =
    Number(
        localStorage.getItem("zyno_balance")
    );

if(!Number.isFinite(balance)){
    balance = START_BALANCE;
}

let mode =
    localStorage.getItem("zyno_mode") || "36";

let bets = {};

let selectedNumber = null;

let bettingOpen = true;

let spinning = false;

let roundStart = 0;

let timerInterval = null;

let spinTimeout = null;

let wheelRotation = 0;

let lastWins =
    JSON.parse(
        localStorage.getItem(
            "zyno_last_wins"
        ) || "[]"
    );


/* =====================================================
   ELEMENTS
===================================================== */

const timerEl =
    document.getElementById("timer");

const lastWinsEl =
    document.getElementById("lastWins");

const numberGrid =
    document.getElementById("numberGrid");

const resultEl =
    document.getElementById("result");

const wheel =
    document.getElementById("wheel");

const numberRotor =
    document.getElementById("numberRotor");

const centerText =
    document.getElementById("centerText");

const mode36 =
    document.getElementById("mode36");

const mode11 =
    document.getElementById("mode11");


/* =====================================================
   ROULETTE COLORS
===================================================== */

const redNumbers = new Set([

    1,3,5,7,9,
    12,14,16,18,
    19,21,23,25,27,
    30,32,34,36

]);

function getNumberClass(number){

    if(number === 0){
        return "green";
    }

    if(redNumbers.has(number)){
        return "red";
    }

    return "black";
}


/* =====================================================
   STORAGE
===================================================== */

function saveBalance(){

    localStorage.setItem(
        "zyno_balance",
        String(Math.floor(balance))
    );
}

function saveLastWins(){

    localStorage.setItem(
        "zyno_last_wins",
        JSON.stringify(lastWins)
    );
}


/* =====================================================
   MODE
===================================================== */

function maxNumber(){

    return mode === "36"
        ? 36
        : 11;
}


function setMode(newMode){

    if(spinning) return;

    mode = newMode;

    localStorage.setItem(
        "zyno_mode",
        mode
    );

    mode36.classList.toggle(
        "active",
        mode === "36"
    );

    mode11.classList.toggle(
        "active",
        mode === "11"
    );

    bets = {};

    selectedNumber = null;

    centerText.textContent =
        "ZYNO";

    resultEl.textContent =
        "Number select karo";

    wheelRotation = 0;

    numberRotor.style.transition =
        "none";

    numberRotor.style.transform =
        "rotate(0deg)";

    createWheel();

    createNumberGrid();

    updateBetButtons();
}


/* =====================================================
   CREATE WHEEL
===================================================== */

function createWheel(){

    numberRotor.innerHTML = "";

    const max =
        maxNumber();

    const total =
        max + 1;

    const radius =
        wheel.clientWidth * 0.385;


    for(
        let i = 0;
        i < total;
        i++
    ){

        const el =
            document.createElement("div");

        const color =
            getNumberClass(i);

        el.className =
            `wheelNumber ${color}`;

        el.textContent =
            i;


        /*
          Number 0 is at the top.
          Every number is evenly spaced.
        */

        const angle =
            (360 / total) * i - 90;

        const rad =
            angle * Math.PI / 180;

        const x =
            Math.cos(rad) * radius;

        const y =
            Math.sin(rad) * radius;


        el.style.transform =
            `translate(${x}px,${y}px)`;


        numberRotor.appendChild(el);
    }
}


/* =====================================================
   NUMBER GRID
===================================================== */

function createNumberGrid(){

    numberGrid.innerHTML = "";

    for(
        let number = 0;
        number <= maxNumber();
        number++
    ){

        createBetButton(number);
    }
}


/* =====================================================
   BET BUTTON
===================================================== */

function createBetButton(number){

    const button =
        document.createElement("button");


    const color =
        getNumberClass(number);


    button.className =
        "betNumber";


    if(color === "red"){
        button.classList.add(
            "redNumber"
        );
    }

    if(color === "black"){
        button.classList.add(
            "blackNumber"
        );
    }

    if(color === "green"){
        button.classList.add(
            "greenNumber"
        );
    }


    button.innerHTML = `
        ${number}
        <span
            class="betCount"
            id="bet-${number}">
            BET 0
        </span>
    `;


    let holdTimer = null;


    function stopHold(){

        if(holdTimer !== null){

            clearInterval(
                holdTimer
            );

            holdTimer = null;
        }

        button.classList.remove(
            "selected"
        );
    }


    function startHold(event){

        event.preventDefault();

        if(spinning) return;


        if(!bettingOpen){

            resultEl.textContent =
                "Betting band hai";

            return;
        }


        if(balance <= 0){

            resultEl.textContent =
                "Balance khatam hai";

            return;
        }


        selectedNumber =
            number;


        button.classList.add(
            "selected"
        );


        /*
          Every 0.25 second = 1 point
        */

        holdTimer =
            setInterval(()=>{

                if(
                    spinning ||
                    !bettingOpen ||
                    balance <= 0
                ){

                    stopHold();

                    return;
                }


                balance -= 1;


                if(!bets[number]){
                    bets[number] = 0;
                }


                bets[number]++;


                saveBalance();

                updateBetCount(
                    number
                );


            },BET_SPEED);
    }


    button.addEventListener(
        "pointerdown",
        startHold
    );

    button.addEventListener(
        "pointerup",
        stopHold
    );

    button.addEventListener(
        "pointercancel",
        stopHold
    );

    button.addEventListener(
        "pointerleave",
        stopHold
    );

    button.addEventListener(
        "contextmenu",
        e => e.preventDefault()
    );


    numberGrid.appendChild(
        button
    );
}


/* =====================================================
   BET COUNT
===================================================== */

function updateBetCount(number){

    const el =
        document.getElementById(
            `bet-${number}`
        );

    if(!el) return;

    el.textContent =
        `BET ${bets[number] || 0}`;
}


/* =====================================================
   BUTTON STATE
===================================================== */

function updateBetButtons(){

    document
        .querySelectorAll(".betNumber")
        .forEach(button=>{

            if(
                bettingOpen &&
                !spinning
            ){

                button.classList.remove(
                    "disabled"
                );

            }else{

                button.classList.add(
                    "disabled"
                );
            }

        });
}


/* =====================================================
   TIMER
===================================================== */

function startRound(){

    clearInterval(
        timerInterval
    );


    /*
      IMPORTANT:
      Refresh karne par naya 60 second
      round start nahi hoga.
    */

    const savedStart =
        Number(
            localStorage.getItem(
                "zyno_round_start"
            )
        );


    const now =
        Date.now();


    if(
        Number.isFinite(savedStart) &&
        savedStart > 0 &&
        now - savedStart <
        (ROUND_TIME * 1000)
    ){

        roundStart =
            savedStart;

    }else{

        roundStart =
            now;

        localStorage.setItem(
            "zyno_round_start",
            String(roundStart)
        );
    }


    bettingOpen = true;

    spinning = false;

    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            100
        );
}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(){

    const elapsed =
        Math.floor(
            (
                Date.now() -
                roundStart
            ) / 1000
        );


    let remaining =
        ROUND_TIME -
        elapsed;


    if(remaining < 0){
        remaining = 0;
    }


    timerEl.textContent =
        String(remaining);


    /*
      Last 4 seconds:
      Betting CLOSE
    */

    if(
        remaining <= BET_CLOSE_TIME &&
        bettingOpen
    ){

        bettingOpen = false;


        timerEl.classList.add(
            "closed"
        );


        updateBetButtons();


        resultEl.textContent =
            "Betting band — wheel spin hoga";
    }


    /*
      0 seconds:
      Spin
    */

    if(
        remaining === 0 &&
        !spinning
    ){

        clearInterval(
            timerInterval
        );

        spinWheel();
    }
}


/* =====================================================
   WINNING NUMBER
===================================================== */

function randomWinner(){

    return Math.floor(
        Math.random() *
        (maxNumber() + 1)
    );
}


/* =====================================================
   FIND ROTATION
===================================================== */

function getWinningRotation(winner){

    const total =
        maxNumber() + 1;

    /*
      Number position:
      winner * slice

      Need winner to come under
      fixed top pointer.
    */

    const numberAngle =
        (360 / total) *
        winner;

    /*
      Add multiple full rotations
      for visual spinning.
    */

    const fullRotations =
        5 + Math.floor(
            Math.random() * 3
        );

    /*
      Negative because the number ring
      rotates opposite direction.
    */

    return (
        -(fullRotations * 360) -
        numberAngle
    );
}


/* =====================================================
   SPIN
===================================================== */

function spinWheel(){

    if(spinning) return;


    spinning = true;

    bettingOpen = false;


    updateBetButtons();


    resultEl.textContent =
        "Wheel spin ho raha hai...";


    const winner =
        randomWinner();


    const rotation =
        getWinningRotation(
            winner
        );


    /*
      IMPORTANT:
      Whole wheel does NOT rotate.
      ONLY numberRotor rotates.
    */

    numberRotor.style.transition =
        "transform 5.5s cubic-bezier(.12,.72,.12,1)";


    numberRotor.style.transform =
        `rotate(${rotation}deg)`;


    spinTimeout =
        setTimeout(()=>{

            finishRound(
                winner,
                rotation
            );

        },5700);
}


/* =====================================================
   FINISH ROUND
===================================================== */

function finishRound(
    winner,
    rotation
){

    /*
      Keep winning number under pointer.
    */

    wheelRotation =
        rotation;


    const winningBet =
        bets[winner] || 0;


    centerText.innerHTML =
        `WIN<br>${winner}`;


    addLastWin(
        winner
    );


    /* =========================
       0–11
    ========================= */

    if(mode === "11"){

        if(winningBet > 0){

            /*
              10 bet = 100 points
            */

            const payout =
                winningBet * 10;


            balance += payout;


            resultEl.textContent =
                `WIN ${winner} — ${payout} points mile`;

        }else{

            resultEl.textContent =
                `Winning Number: ${winner}`;
        }
    }


    /* =========================
       0–36
    ========================= */

    else{

        if(winningBet > 0){

            const winAmount =
                winningBet * 35;


            const returnedBet =
                winningBet;


            const totalPayout =
                winAmount +
                returnedBet;


            balance +=
                totalPayout;


            resultEl.textContent =
                `WIN ${winner} — ${totalPayout} points mile`;

        }else{

            resultEl.textContent =
                `Winning Number: ${winner}`;
        }
    }


    saveBalance();


    setTimeout(
        resetRound,
        3000
    );
}


/* =====================================================
   LAST 4 WIN
===================================================== */

function addLastWin(number){

    lastWins.push(
        number
    );


    if(
        lastWins.length > 4
    ){

        lastWins.shift();
    }


    saveLastWins();

    renderLastWins();
}


function renderLastWins(){

    lastWinsEl.innerHTML =
        "";


    const values = [
        null,
        null,
        null,
        null
    ];


    const start =
        4 -
        lastWins.length;


    lastWins.forEach(
        (number,index)=>{

            values[
                start + index
            ] = number;
        }
    );


    values.forEach(
        number=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "lastNumber";


            div.textContent =
                number === null
                ? "—"
                : number;


            lastWinsEl.appendChild(
                div
            );
        }
    );
}


/* =====================================================
   RESET ROUND
===================================================== */

function resetRound(){

    clearTimeout(
        spinTimeout
    );


    bets = {};

    selectedNumber = null;

    spinning = false;

    bettingOpen = true;


    centerText.textContent =
        "ZYNO";


    resultEl.textContent =
        "Number select karo";


    timerEl.classList.remove(
        "closed"
    );


    timerEl.textContent =
        "60";


    /*
      New round starts here.
    */

    roundStart =
        Date.now();


    localStorage.setItem(
        "zyno_round_start",
        String(roundStart)
    );


    numberRotor.style.transition =
        "none";


    numberRotor.style.transform =
        "rotate(0deg)";


    wheelRotation =
        0;


    createNumberGrid();

    updateBetButtons();

    startRound();
}


/* =====================================================
   MODE BUTTONS
===================================================== */

mode36.addEventListener(
    "click",
    ()=>{
        setMode("36");
    }
);
