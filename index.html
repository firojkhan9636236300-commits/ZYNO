<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ZYNO Roulette</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 50% 35%,#161616 0%,#080808 45%,#020202 100%);
    color:#fff;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:520px;
    height:100dvh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:
        max(7px,env(safe-area-inset-top))
        10px
        max(7px,env(safe-area-inset-bottom));
    overflow:hidden;
}

/* =========================
   LOGO
========================= */

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    letter-spacing:6px;
    color:#00e5ff;
    text-shadow:
        0 0 7px #00e5ff,
        0 0 18px #00e5ff,
        0 0 35px #008cff;
    margin-bottom:5px;
}

/* =========================
   WHEEL
========================= */

.wheelArea{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    flex:0 0 auto;
    margin-top:2px;
}

.pointer{
    position:absolute;
    top:-3px;
    z-index:20;
    width:0;
    height:0;

    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-top:18px solid #ffd34e;

    filter:
        drop-shadow(0 0 4px #ffd34e)
        drop-shadow(0 0 8px rgba(255,211,78,.7));
}

/* WHEEL COLOUR CHANGED */
.wheel{
    width:min(57vw,245px);
    height:min(57vw,245px);

    max-width:245px;
    max-height:245px;

    min-width:205px;
    min-height:205px;

    border-radius:50%;
    position:relative;

    background:
        conic-gradient(
            #050505 0deg 9.73deg,
            #7c0b16 9.73deg 19.46deg,
            #050505 19.46deg 29.19deg,
            #7c0b16 29.19deg 38.92deg,
            #050505 38.92deg 48.65deg,
            #7c0b16 48.65deg 58.38deg,
            #050505 58.38deg 68.11deg,
            #7c0b16 68.11deg 77.84deg,
            #050505 77.84deg 87.57deg,
            #7c0b16 87.57deg 97.3deg,
            #050505 97.3deg 107.03deg,
            #7c0b16 107.03deg 116.76deg,
            #050505 116.76deg 126.49deg,
            #7c0b16 126.49deg 136.22deg,
            #050505 136.22deg 145.95deg,
            #7c0b16 145.95deg 155.68deg,
            #050505 155.68deg 165.41deg,
            #7c0b16 165.41deg 175.14deg,
            #050505 175.14deg 184.87deg,
            #7c0b16 184.87deg 194.6deg,
            #050505 194.6deg 204.33deg,
            #7c0b16 204.33deg 214.06deg,
            #050505 214.06deg 223.79deg,
            #7c0b16 223.79deg 233.52deg,
            #050505 233.52deg 243.25deg,
            #7c0b16 243.25deg 252.98deg,
            #050505 252.98deg 262.71deg,
            #7c0b16 262.71deg 272.44deg,
            #050505 272.44deg 282.17deg,
            #7c0b16 282.17deg 291.9deg,
            #050505 291.9deg 301.63deg,
            #7c0b16 301.63deg 311.36deg,
            #050505 311.36deg 321.09deg,
            #7c0b16 321.09deg 330.82deg,
            #050505 330.82deg 340.55deg,
            #7c0b16 340.55deg 350.28deg,
            #050505 350.28deg 360deg
        );

    border:4px solid #ffd34e;

    box-shadow:
        0 0 8px #ffd34e,
        0 0 20px rgba(255,211,78,.4),
        inset 0 0 18px rgba(0,0,0,.9);

    transition:
        transform 4.8s cubic-bezier(.12,.72,.15,1);
}

.wheel::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(255,211,78,.35);
    border-radius:50%;
}

.number{
    position:absolute;
    left:50%;
    top:50%;

    width:32px;
    height:32px;

    margin-left:-16px;
    margin-top:-16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:900;

    color:#fff;

    transform:
        rotate(var(--angle))
        translateY(calc(min(57vw,245px) / -2 + 17px))
        rotate(calc(var(--angle) * -1));

    text-shadow:
        0 1px 3px #000,
        0 0 3px rgba(255,255,255,.25);
}

/* =========================
   CENTER
========================= */

.center{
    position:absolute;

    width:64px;
    height:64px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #262626 0%,
            #0b0b0b 65%,
            #020202 100%
        );

    border:3px solid #ffd34e;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#00e5ff;

    font-size:14px;
    font-weight:900;
    letter-spacing:1px;

    box-shadow:
        0 0 10px #ffd34e,
        inset 0 0 15px rgba(255,211,78,.15);
}

/* =========================
   BALANCE / LAST WIN
   MOVED BELOW WHEEL
========================= */

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;

    margin:5px 0 3px;
}

.infoBox{
    background:rgba(8,8,8,.9);

    border:1px solid rgba(255,211,78,.35);

    border-radius:10px;

    padding:5px 8px;

    text-align:center;

    box-shadow:
        0 0 8px rgba(255,211,78,.08);
}

.infoTitle{
    font-size:9px;
    color:#9d9d9d;
    letter-spacing:1px;
}

.infoValue{
    font-size:16px;
    font-weight:900;
    color:#fff;
    margin-top:1px;
}

/* =========================
   LAST 4
========================= */

.lastWins{
    display:flex;
    justify-content:center;
    gap:5px;

    margin-bottom:3px;
}

.winBall{
    width:26px;
    height:26px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:900;

    background:#090909;

    border:1px solid #555;

    box-shadow:
        inset 0 0 6px rgba(255,255,255,.08);
}

/* =========================
   TIMER
========================= */

.timerBox{
    margin:2px auto 3px;
    width:180px;
    text-align:center;
}

.timerLabel{
    font-size:9px;
    letter-spacing:2px;
    color:#999;
}

.timer{
    font-size:26px;
    line-height:28px;

    font-weight:900;

    color:#ffd34e;

    text-shadow:
        0 0 10px rgba(255,211,78,.6);
}

/* =========================
   RESULT
========================= */

.result{
    min-height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:12px;
    font-weight:700;

    color:#ddd;
}

/* =========================
   SELECTED BET
========================= */

.selected{
    min-height:29px;

    border:1px solid rgba(255,211,78,.25);

    border-radius:9px;

    background:rgba(5,5,5,.85);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    color:#bbb;

    margin-bottom:4px;
}

/* =========================
   NUMBER GRID
========================= */

.grid{
    flex:1 1 auto;
    min-height:0;

    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:4px;

    overflow:hidden;

    padding:1px;
}

.numBtn{
    border:1px solid #393939;

    background:
        linear-gradient(
            145deg,
            #191919,
            #070707
        );

    border-radius:7px;

    color:#fff;

    font-size:14px;
    font-weight:900;

    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    box-shadow:
        inset 0 0 7px rgba(0,0,0,.8);
}

.numBtn.zero{
    background:
        linear-gradient(
            145deg,
            #65101a,
            #260609
        );

    color:#ffd34e;

    border-color:#7d252d;
}

.numBtn.active{
    border-color:#ffd34e;

    background:
        linear-gradient(
            145deg,
            #513d0a,
            #171000
        );

    box-shadow:
        0 0 8px rgba(255,211,78,.6),
        inset 0 0 10px rgba(255,211,78,.18);
}

.betCount{
    position:absolute;

    right:2px;
    bottom:1px;

    font-size:7px;

    color:#ffd34e;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    font-size:8px;

    color:#555;

    padding-top:2px;

    flex:0 0 auto;
}

/* =========================
   MOBILE
========================= */

@media(max-height:700px){

    .logo{
        font-size:25px;
        margin-bottom:2px;
    }

    .wheel{
        width:min(52vw,215px);
        height:min(52vw,215px);

        min-width:190px;
        min-height:190px;
    }

    .number{
        font-size:13px;

        transform:
            rotate(var(--angle))
            translateY(calc(min(52vw,215px) / -2 + 16px))
            rotate(calc(var(--angle) * -1));
    }

    .info{
        margin-top:3px;
    }

    .winBall{
        width:24px;
        height:24px;
    }

    .timerBox{
        margin:1px auto;
    }

    .timer{
        font-size:23px;
        line-height:25px;
    }

    .selected{
        min-height:26px;
    }

    .grid{
        gap:3px;
    }

    .numBtn{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">ZYNO</div>

    <div class="wheelArea">

        <div class="pointer"></div>

        <div class="wheel" id="wheel">

            <div class="center" id="center">
                ZYNO
            </div>

        </div>

    </div>

    <!-- BALANCE + LAST WIN MOVED HERE -->

    <div class="info">

        <div class="infoBox">
            <div class="infoTitle">BALANCE</div>
            <div class="infoValue" id="balance">10000</div>
        </div>

        <div class="infoBox">
            <div class="infoTitle">LAST WIN</div>
            <div class="infoValue" id="lastWin">-</div>
        </div>

    </div>

    <div class="lastWins" id="lastWins">

        <div class="winBall">-</div>
        <div class="winBall">-</div>
        <div class="winBall">-</div>
        <div class="winBall">-</div>

    </div>

    <div class="timerBox">

        <div class="timerLabel">
            BETTING TIME
        </div>

        <div class="timer" id="timer">
            60
        </div>

    </div>

    <div class="result" id="result">
        Number select karo
    </div>

    <div class="selected" id="selected">
        Koi number select nahi hai
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
        ZYNO ROULETTE
    </div>

</div>

<script>

/* =========================
   GAME SETTINGS
========================= */

let balance = 10000;

const BET_TIME = 60;

let timeLeft = BET_TIME;

let bettingOpen = true;
let spinning = false;

let selectedNumber = null;

let selectedBet = 0;

let bets = {};

let lastResults = [];

let timerInterval = null;

let holdTimer = null;

let holdStart = 0;


/* =========================
   ELEMENTS
========================= */

const wheel =
    document.getElementById("wheel");

const grid =
    document.getElementById("grid");

const timer =
    document.getElementById("timer");

const balanceEl =
    document.getElementById("balance");

const lastWinEl =
    document.getElementById("lastWin");

const result =
    document.getElementById("result");

const selected =
    document.getElementById("selected");

const center =
    document.getElementById("center");

const lastWins =
    document.getElementById("lastWins");


/* =========================
   WHEEL NUMBERS
========================= */

for(let i=0;i<=36;i++){

    const n =
        document.createElement("div");

    n.className = "number";

    n.textContent = i;

    const angle =
        i * (360 / 37);

    n.style.setProperty(
        "--angle",
        angle + "deg"
    );

    wheel.appendChild(n);
}


/* =========================
   NUMBER GRID
========================= */

for(let i=0;i<=36;i++){

    const btn =
        document.createElement("div");

    btn.className = "numBtn";

    if(i === 0){
        btn.classList.add("zero");
    }

    btn.dataset.number = i;

    btn.innerHTML = `
        <span>${i}</span>
        <span class="betCount"></span>
    `;


    btn.addEventListener(
        "pointerdown",
        (e)=>{

            if(!bettingOpen || spinning)
                return;

            e.preventDefault();

            selectedNumber = i;

            updateSelected();

            holdStart =
                performance.now();

            holdTimer =
                setInterval(()=>{

                    const elapsed =
                        performance.now()
                        - holdStart;

                    const points =
                        Math.floor(
                            elapsed / 250
                        );

                    if(points > 0){

                        addBet(
                            i,
                            points
                        );

                        holdStart =
                            performance.now();
                    }

                },250);

            btn.classList.add("active");
        }
    );


    const stopHold = ()=>{

        clearInterval(holdTimer);

        holdTimer = null;

        btn.classList.remove("active");
    };


    btn.addEventListener(
        "pointerup",
        stopHold
    );

    btn.addEventListener(
        "pointercancel",
        stopHold
    );

    btn.addEventListener(
        "pointerleave",
        stopHold
    );

    grid.appendChild(btn);
}


/* =========================
   ADD BET
========================= */

function addBet(number,points){

    if(!bettingOpen || spinning)
        return;

    if(balance <= 0){

        result.textContent =
            "Balance khatam ho gaya";

        return;
    }

    points =
        Math.min(points,balance);

    if(!bets[number]){
        bets[number] = 0;
    }

    bets[number] += points;

    balance -= points;

    balanceEl.textContent =
        Math.floor(balance);

    updateBetDisplay(number);

    updateSelected();
}


/* =========================
   BET DISPLAY
========================= */

function updateBetDisplay(number){

    const btn =
        document.querySelector(
            `.numBtn[data-number="${number}"]`
        );

    if(!btn)
        return;

    const count =
        btn.querySelector(
            ".betCount"
        );

    count.textContent =
        bets[number]
        ? "BET " + bets[number]
        : "";
}


/* =========================
   SELECTED
========================= */

function updateSelected(){

    if(selectedNumber === null){

        selected.textContent =
            "Koi number select nahi hai";

        return;
    }

    const total =
        bets[selectedNumber] || 0;

    selected.textContent =
        `Number ${selectedNumber} par total ${total} points bet`;
}


/* =========================
   TIMER
========================= */

function startTimer(){

    clearInterval(timerInterval);

    timerInterval =
        setInterval(()=>{

            if(!bettingOpen)
                return;

            timeLeft--;

            timer.textContent =
                timeLeft;

            /*
               LAST 4 SECONDS
               BETTING CLOSES
            */

            if(timeLeft <= 4){

                bettingOpen = false;

                timer.textContent = "0";

                result.textContent =
                    "Betting band — wheel spin ho raha hai";

                clearInterval(
                    timerInterval
                );

                setTimeout(
                    spinWheel,
                    500
                );
            }

        },1000);
}


/* =========================
   SPIN
========================= */

function spinWheel(){

    if(spinning)
        return;

    spinning = true;

    bettingOpen = false;

    const winningNumber =
        Math.floor(
            Math.random() * 37
        );

    const segment =
        360 / 37;

    const targetAngle =
        360 -
        (winningNumber * segment);

    const extraSpins =
        360 * 6;

    wheel.style.transform =
        `rotate(${extraSpins + targetAngle}deg)`;


    setTimeout(()=>{

        showResult(
            winningNumber
        );

    },4800);
}


/* =========================
   RESULT
========================= */

function showResult(number){

    center.textContent =
        "WIN " + number;

    lastWinEl.textContent =
        number;

    result.textContent =
        "Winning Number: " + number;


    lastResults.push(number);

    if(lastResults.length > 4){

        lastResults.shift();

    }

    renderLastWins();


    /*
       35:1 WIN
       ORIGINAL BET RETURNED
    */

    const winningBet =
        bets[number] || 0;

    if(winningBet > 0){

        const winAmount =
            winningBet * 35;

        const returnedBet =
            winningBet;

        const totalPayout =
            winAmount +
            returnedBet;

        balance +=
            totalPayout;

        result.textContent =
            `WIN! ${number} par ${winningBet} bet — +${totalPayout} points`;

    }else{

        result.textContent =
            `Winning Number: ${number}`;

    }

    balanceEl.textContent =
        Math.floor(balance);


    /*
       RESET BETS
    */

    bets = {};

    document
        .querySelectorAll(".betCount")
        .forEach(el=>{
            el.textContent = "";
        });

    document
        .querySelectorAll(".numBtn")
        .forEach(btn=>{
            btn.classList.remove(
                "active"
            );
        });


    /*
       NEXT ROUND
    */

    setTimeout(()=>{

        center.textContent =
            "ZYNO";

        wheel.style.transition =
            "none";

        wheel.style.transform =
            "rotate(0deg)";


        requestAnimationFrame(()=>{

            requestAnimationFrame(()=>{

                wheel.style.transition =
                    "transform 4.8s cubic-bezier(.12,.72,.15,1)";

            });

        });


        selectedNumber = null;

        selectedBet = 0;

        selected.textContent =
            "Koi number select nahi hai";

        timeLeft = BET_TIME;

        timer.textContent =
            timeLeft;

        bettingOpen = true;

        spinning = false;

        result.textContent =
            "Number select karo";

        startTimer();

    },2500);
}


/* =========================
   LAST 4 WIN
========================= */

function renderLastWins(){

    const balls =
        lastWins.querySelectorAll(
            ".winBall"
        );

    const values = [

        ...Array(
            4 - lastResults.length
        ).fill("-"),

        ...lastResults

    ];

    balls.forEach(
        (ball,index)=>{

            ball.textContent =
                values[index];

        }
    );
}


/* =========================
   START
========================= */

balanceEl.textContent =
    balance;

timer.textContent =
    timeLeft;

startTimer();

</script>

</body>
</html>
